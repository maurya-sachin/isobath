<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookie consent mockup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&display=swap');

/* Colours: copied verbatim from app/src/theme/palette.css (generated by `npm run theme:build`). No other colour
   values appear in this file. */
:root {
  --hue: 265;
  --background: oklch(0.985 0.004 var(--hue));
  --foreground: oklch(0.24 0.03 var(--hue));
  --card: oklch(0.997 0.002 var(--hue));
  --card-foreground: oklch(0.24 0.03 var(--hue));
  --muted-foreground: oklch(0.48 0.03 var(--hue));
  --border: oklch(0.9 0.014 var(--hue));
  --input: oklch(0.6 0.02 var(--hue));
  --ring: oklch(0.48 0.19 var(--hue));
  --link: oklch(0.48 0.19 var(--hue));
  --accent: oklch(0.955 0.01 var(--hue));
  --radius: 0.625rem;
}
.dark {
  --background: oklch(0.17 0.02 var(--hue));
  --foreground: oklch(0.935 0.01 var(--hue));
  --card: oklch(0.205 0.022 var(--hue));
  --card-foreground: oklch(0.935 0.01 var(--hue));
  --muted-foreground: oklch(0.72 0.03 var(--hue));
  --border: oklch(0.31 0.03 var(--hue));
  --input: oklch(0.56 0.03 var(--hue));
  --ring: oklch(0.76 0.12 var(--hue));
  --link: oklch(0.76 0.12 var(--hue));
  --accent: oklch(0.245 0.025 var(--hue));
}

* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.5 'Geist', system-ui, sans-serif; background: #888; color: #222; padding: 24px; }
h1 { font-size: 1.1rem; margin: 0 0 4px; color: #fff; }
.note { color: #eee; font-size: 0.85rem; max-width: 70ch; margin: 0 0 20px; }
.grid { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
figure { margin: 0; }
figcaption { color: #fff; font-size: 0.8rem; margin-bottom: 6px; }

/* A stand-in viewport showing a real isobath page, with the banner pinned to its bottom. */
.frame { position: relative; overflow: hidden; border-radius: 8px; background: var(--background); color: var(--foreground); }
.frame.wide { width: 880px; height: 440px; }
.frame.narrow { width: 375px; height: 640px; }
.hdr { display: flex; align-items: center; gap: 16px; padding: 12px 24px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
.hdr b { font-family: 'Newsreader', serif; font-size: 1.25rem; }
.hdr span { color: var(--muted-foreground); }
.page { padding: 28px 24px; max-width: 720px; }
.page .eyebrow { color: var(--muted-foreground); font-size: 0.8rem; }
.page h2 { font-family: 'Newsreader', serif; font-size: 1.7rem; line-height: 1.2; margin: 6px 0 12px; }
.page p { color: var(--muted-foreground); margin: 0 0 10px; }

/* The banner. A non-modal region: focus is never trapped and the page behind stays usable. */
.consent {
  position: absolute; z-index: 30;
  background: var(--card); color: var(--card-foreground);
  border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.4);
  box-shadow: 0 8px 28px oklch(0 0 0 / 0.18);
  padding: 16px;
}
.wide .consent { left: 16px; bottom: 16px; width: 380px; }
.narrow .consent { left: 8px; right: 8px; bottom: 8px; }
.consent h3 { margin: 0 0 4px; font-size: 0.95rem; font-weight: 600; }
.consent p { margin: 0 0 14px; font-size: 0.875rem; line-height: 1.5; color: var(--muted-foreground); }
.consent a { color: var(--link); text-underline-offset: 2px; }
.actions { display: flex; gap: 8px; }
/* Accept and Decline share one style, size and weight: neither is nudged. */
.btn {
  flex: 1; min-height: 40px; padding: 0 14px; font: 500 0.9rem 'Geist', sans-serif;
  color: var(--foreground); background: var(--background); border: 1px solid var(--input);
  border-radius: calc(var(--radius) * 0.8); cursor: pointer;
}
.btn:hover { background: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
/* The site footer, as it reads after a choice. */
.sitefoot { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 16px 24px; border-top: 1px solid var(--border); font-size: 0.875rem; color: var(--muted-foreground); }
.sitefoot a, .sitefoot button { color: var(--link); background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.sitefoot button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
</style>
</head>
<body>
<h1>Cookie consent: banner</h1>
<p class="note">Shown on a real isobath question page (React chapter). Same banner in light and dark, at 1024+ (bottom-left card) and 375px (bottom sheet). Accept and Decline are one style, size and weight. The last frame shows the footer entry that reopens the choice.</p>

<div class="grid">
  <figure>
    <figcaption>Desktop, light</figcaption>
    <div class="frame wide">
      <div class="hdr"><b>isobath</b><span>Paths</span><span>Practice</span><span>Roadmap</span></div>
      <div class="page">
        <div class="eyebrow">React · Rendering</div>
        <h2>When do you need <code>useLayoutEffect</code> instead of <code>useEffect</code>?</h2>
        <p>Short answer, then the full answer, pitfalls and follow-ups.</p>
      </div>
      <section class="consent" role="region" aria-labelledby="c1">
        <h3 id="c1">Anonymous analytics</h3>
        <p>Accept to let us recognise returning visitors and see where readers come from. If you decline, your visit is still counted anonymously and only your choice is remembered on your device. <a href="#">Privacy</a></p>
        <div class="actions"><button class="btn">Decline</button><button class="btn">Accept</button></div>
      </section>
    </div>
  </figure>

  <figure>
    <figcaption>Desktop, dark</figcaption>
    <div class="frame wide dark">
      <div class="hdr"><b>isobath</b><span>Paths</span><span>Practice</span><span>Roadmap</span></div>
      <div class="page">
        <div class="eyebrow">React · Rendering</div>
        <h2>When do you need <code>useLayoutEffect</code> instead of <code>useEffect</code>?</h2>
        <p>Short answer, then the full answer, pitfalls and follow-ups.</p>
      </div>
      <section class="consent" role="region" aria-labelledby="c2">
        <h3 id="c2">Anonymous analytics</h3>
        <p>Accept to let us recognise returning visitors and see where readers come from. If you decline, your visit is still counted anonymously and only your choice is remembered on your device. <a href="#">Privacy</a></p>
        <div class="actions"><button class="btn">Decline</button><button class="btn">Accept</button></div>
      </section>
    </div>
  </figure>

  <figure>
    <figcaption>375px, light</figcaption>
    <div class="frame narrow">
      <div class="hdr"><b>isobath</b></div>
      <div class="page">
        <div class="eyebrow">React · Rendering</div>
        <h2>When do you need <code>useLayoutEffect</code> instead of <code>useEffect</code>?</h2>
        <p>Short answer, then the full answer, pitfalls and follow-ups.</p>
      </div>
      <section class="consent" role="region" aria-labelledby="c3">
        <h3 id="c3">Anonymous analytics</h3>
        <p>Accept to let us recognise returning visitors and see where readers come from. If you decline, your visit is still counted anonymously and only your choice is remembered on your device. <a href="#">Privacy</a></p>
        <div class="actions"><button class="btn">Decline</button><button class="btn">Accept</button></div>
      </section>
    </div>
  </figure>
  <figure>
    <figcaption>Footer after a choice (reopens the banner)</figcaption>
    <div class="frame wide" style="height:auto">
      <div class="sitefoot"><span>isobath, by Sachin Maurya</span><a href="#">Changelog</a><a href="#">GitHub</a><a href="#">Privacy</a><button>Cookie settings</button></div>
    </div>
  </figure>
</div>
</body>
</html>
