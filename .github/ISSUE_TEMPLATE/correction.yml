name: Correction
description: Something in a question is wrong or misleading
title: "Fix: "
body:
  - type: input
    id: question
    attributes:
      label: Question
      description: The question's id, e.g. javascript/closures/what-is-a-closure
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page address
      description: Filled in automatically when you use "Suggest a fix" on the site.
  - type: input
    id: section
    attributes:
      label: Section
      description: Filled in when you select text on the page and use "Suggest a fix".
  - type: textarea
    id: quote
    attributes:
      label: Quoted text
      description: Filled in from the text you selected. Edit it if it holds more than the problem.
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Say what is wrong and what it should be. If the quoted text is empty, quote the sentence here.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: A link to the spec, MDN, or engine docs that shows the correct behaviour.
