name: Source links

# Checks every page the questions cite in `sources`. Kept out of ci.yml so a third-party outage cannot block a merge.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run --silent sources:list > ../urls.txt
        working-directory: app
      # 429 is a rate limit, not a dead link.
      - uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          args: --no-progress --max-retries 3 --timeout 30 --accept '200..=299, 429' urls.txt
          format: markdown
          output: lychee/out.md
          fail: false
      - id: existing
        if: steps.lychee.outputs.exit_code != 0
        run: echo "number=$(gh issue list --state open --search 'in:title "Dead source links"' --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # Updates last week's issue when it is still open, so one issue holds the current list.
      - uses: peter-evans/create-issue-from-file@v6
        if: steps.lychee.outputs.exit_code != 0
        with:
          issue-number: ${{ steps.existing.outputs.number }}
          title: Dead source links
          content-filepath: lychee/out.md
          labels: documentation
