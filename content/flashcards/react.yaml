# 01 Rendering model
- id: jsx-is-syntax-not-react
  front: "Is JSX a React feature? What turns it into runnable code?"
  back: "No, it is syntax. A compiler (Babel, esbuild, SWC, TypeScript) turns every tag into a function call before the code runs."
  question: react/rendering-model/jsx-and-elements
- id: jsx-automatic-runtime-output
  front: "What does the automatic runtime compile `<Greeting key=\"g1\" name=\"Ada\" />` to, and since which React version is it required?"
  back: "`jsx(Greeting, { name: \"Ada\" }, \"g1\")`, with `jsx` imported from `react/jsx-runtime` by the compiler. The automatic runtime is required since React 19."
  question: react/rendering-model/jsx-and-elements
- id: jsx-type-host-vs-component
  front: "In `jsx(type, props, key)`, what is `type` for a host tag versus a capitalised tag?"
  back: "A string for host tags (`\"h1\"`), the component itself for capitalised tags. That is why `<greeting />` means a DOM tag called `greeting`."
  question: react/rendering-model/jsx-and-elements
- id: jsx-children-in-props
  front: "Where do JSX children go in the compiled `jsx` call?"
  back: "Inside `props`, as `props.children`."
  question: react/rendering-model/jsx-and-elements
- id: jsx-jsxs-purpose
  front: "What is `jsxs` for in the automatic runtime?"
  back: "It is used for several static children. It tells React the children array is fixed, so React skips the missing-`key` warning."
  question: react/rendering-model/jsx-and-elements
- id: jsx-key-separate-argument
  front: "How does `key` travel in the compiled `jsx` call, and does it reach `props`?"
  back: "It is a separate third argument and never reaches `props`. Reading `props.key` gives `undefined`, and development builds warn that `key` is not a prop."
  question: react/rendering-model/jsx-and-elements
- id: jsx-dev-runtime
  front: "What do development builds call instead of `jsx`, and what does it add?"
  back: "`jsxDEV` from `react/jsx-dev-runtime`. It adds the source location and a few checks."
  question: react/rendering-model/jsx-and-elements
- id: jsx-classic-transform
  front: "What did the classic JSX transform compile to, and does that function still exist?"
  back: "`React.createElement(type, props, ...children)`. `createElement` still exists for code written without JSX."
  question: react/rendering-model/jsx-and-elements
- id: jsx-element-shape
  front: "What is a React element, and which fields does it have?"
  back: "A plain object describing what to render: `$$typeof`, `type`, `key` (a string or `null`) and `props`."
  question: react/rendering-model/jsx-and-elements
- id: jsx-typeof-symbol
  front: "What is `$$typeof` in React 19, and why can injected JSON not pose as an element?"
  back: "`Symbol.for('react.transitional.element')`. React renders only objects carrying this tag, and a JSON payload cannot contain a symbol."
  question: react/rendering-model/jsx-and-elements
- id: jsx-creating-element-does-nothing
  front: "What happens when you create an element such as `<Greeting />`?"
  back: "Only an object is created. The component is not called and no DOM exists yet. React calls the component later, during rendering, when it reaches that element in the tree."
  question: react/rendering-model/jsx-and-elements
- id: jsx-elements-frozen-in-dev
  front: "Are elements immutable? How does that differ between development and production builds?"
  back: "They are immutable snapshots. Development builds shallowly freeze each element and its `props`; production builds skip the freeze for speed, so mutation goes unnoticed there. To change the UI, render again and return new elements."
  question: react/rendering-model/jsx-and-elements
- id: jsx-element-ref-react-19
  front: "Why does React 19.3.1 warn when you read `element.ref` in development?"
  back: "`ref` is now an ordinary prop, read as `element.props.ref`. In development `element.ref` is a getter that logs a warning; production builds still set a plain `ref` field."
  question: react/rendering-model/jsx-and-elements
- id: jsx-transitional-symbol-reason
  front: "Why did React 19 change the element symbol from `react.element` to `react.transitional.element`?"
  back: "React 19 changed what an element carries (`ref` moved into `props`). The new tag lets React reject elements made by an older copy of React; `react-dom/client` 19.3.1 throws \"A React Element from an older version of React was rendered.\""
  question: react/rendering-model/jsx-and-elements
- id: jsx-handmade-element
  front: "Can you build an element by hand, and should you?"
  back: "Yes, any object with the right `$$typeof`, `type`, `key` and `props` renders, because elements are plain data. Do not: the shape is an implementation detail, and `jsx` or `createElement` are the supported APIs."
  question: react/rendering-model/jsx-and-elements
- id: jsx-spread-key
  front: "Given `const props = { key: 'a', id: 1 }`, what are `element.key` and `element.props` for `<div {...props} />`?"
  back: "`element.key` is `\"a\"` and `element.props` is `{ id: 1 }`. At runtime `jsx` moves `key` out of the config object, and development builds warn that keys must be passed directly to JSX."
  question: react/rendering-model/jsx-and-elements

- id: rc-three-steps
  front: "Into which steps does React split an update, and whose job is painting?"
  back: "Trigger, render and commit. Painting is the browser's job afterwards."
  question: react/rendering-model/render-and-commit
- id: rc-trigger-queues
  front: "What does calling `setCount` do right away?"
  back: "It does not change `count` or the DOM. It queues an update on the component and asks React to schedule a render, so code after it in the handler still sees the old state and old DOM."
  question: react/rendering-model/render-and-commit
- id: rc-render-meaning
  front: "What does \"render\" mean in React?"
  back: "Calling your components to get elements, not drawing pixels. React compares the elements with the previous render's output to work out which DOM changes are needed; nothing is applied yet."
  question: react/rendering-model/render-and-commit
- id: rc-render-must-be-pure
  front: "Why must the render phase be free of side effects?"
  back: "React can repeat it (Strict Mode), pause it, or throw the result away (concurrent rendering) without the user seeing anything."
  question: react/rendering-model/render-and-commit
- id: rc-commit-synchronous
  front: "What is special about the commit phase?"
  back: "React applies the minimal DOM operations in one synchronous pass that cannot be interrupted, so the page never shows half an update. Commit never yields."
  question: react/rendering-model/render-and-commit
- id: rc-commit-leaves-unchanged
  front: "Why does an `<input>` keep its typed text when its parent re-renders?"
  back: "Commit leaves unchanged nodes alone; only attributes, text and nodes whose output differed are changed."
  question: react/rendering-model/render-and-commit
- id: rc-layout-effects-timing
  front: "What does React do after the DOM is applied in commit, and what can `useLayoutEffect` read?"
  back: "It attaches refs and runs `useLayoutEffect` callbacks, which can read the new layout. `useLayoutEffect`, and any updates it schedules, complete before the browser paints."
  question: react/rendering-model/render-and-commit
- id: rc-paint-timing
  front: "When does the browser paint relative to React's work?"
  back: "Once React's JavaScript and the microtasks after it finish, the browser runs its rendering update: style, layout, paint. Everything up to layout effects finishes inside one task, so the next frame shows the committed DOM."
  question: react/rendering-model/render-and-commit
- id: rc-useeffect-vs-paint
  front: "Does `useEffect` always run after paint?"
  back: "No. It usually runs after paint, but after a discrete input such as a click React may run it before, and in practice does. Work that must wait for paint, such as an `alert()`, goes in a `setTimeout`."
  question: react/rendering-model/render-and-commit
- id: rc-same-output-no-dom-change
  front: "What does a render that produces the same output commit?"
  back: "No DOM changes at all. Effects still run if their dependencies changed."
  question: react/rendering-model/render-and-commit
- id: rc-event-order
  front: "After a real click in the Counter example, in what order do handler, render, layout effect, `useEffect`, microtask and animation frame run?"
  back: "Handler (DOM still shows the old value), render, layout effect (DOM shows the new value), effect, microtask, animation frame. Same in Chrome 156 and Firefox 159, development and production builds of React 19.3.1, no Strict Mode."
  question: react/rendering-model/render-and-commit
- id: rc-render-before-handler-microtask
  front: "Why did the render run before the handler's own microtask in the click example?"
  back: "`setCount` had already queued React's scheduling microtask. That is an implementation detail."
  question: react/rendering-model/render-and-commit
- id: rc-flushsync
  front: "How do you make the DOM update before the next line of a handler, and what does it cost?"
  back: "Wrap the update in `flushSync(() => setCount(c => c + 1))` from `react-dom`. React renders and commits inside the call; in the test both effects had also run before it returned. It is a last resort: it defeats batching and can hurt performance."
  question: react/rendering-model/render-and-commit
- id: rc-interruptible-render
  front: "Can the render phase be interrupted?"
  back: "Yes, for non-urgent updates such as transitions: React can yield to the browser between components and restart with newer state. Urgent updates like typing and clicks render synchronously."
  question: react/rendering-model/render-and-commit
- id: rc-rerender-not-recreate-dom
  front: "Does a re-render recreate the DOM?"
  back: "No. On the initial render React creates and appends DOM nodes; on later renders it changes only the attributes, text and nodes whose output differed."
  question: react/rendering-model/render-and-commit
- id: rc-trigger-internals
  front: "In React 19.3.1, what does `setState` do internally to schedule a render?"
  back: "It adds an update to the component's fiber, marks a lane (a priority) on it and its ancestors, and calls `ensureRootIsScheduled`, which queues one microtask per batch. This is implementation detail; the documented contract is only that updates are queued and batched."
  question: react/rendering-model/render-and-commit
- id: rc-lanes-scheduling
  front: "In the scheduling microtask, how are sync-lane work and default or transition lane work handled?"
  back: "Sync-lane work (from discrete events like `click` and `keydown`) is rendered and committed right there. Default and transition lanes are handed to React's Scheduler as separate tasks."
  question: react/rendering-model/render-and-commit
- id: rc-render-walk
  front: "How does the render phase treat fibers with and without pending work?"
  back: "Fibers with no pending work and no changed inputs are reused; components with pending updates are called and their returned elements reconciled against existing child fibers. The result is a work-in-progress tree with flags for the DOM operations and effects the commit needs."
  question: react/rendering-model/render-and-commit
- id: rc-commit-passes
  front: "What are the three passes of `commitRoot`?"
  back: "Before mutation (reads the DOM before it changes, e.g. `getSnapshotBeforeUpdate`), mutation (inserts, updates, removes DOM nodes, detaches old refs, runs layout effect cleanups), and layout (attaches refs, runs `useLayoutEffect` setups, `componentDidMount`, `componentDidUpdate`)."
  question: react/rendering-model/render-and-commit
- id: rc-root-current-swap
  front: "When does React make the work-in-progress tree the current one?"
  back: "After the mutation pass and before the layout pass (`root.current = finishedWork`)."
  question: react/rendering-model/render-and-commit
- id: rc-passive-effects-flush
  front: "When are passive effects (`useEffect`) flushed in React 19.3.1?"
  back: "They run last. The source flushes them synchronously at the end of a commit that included the sync lane, \"so that the result is immediately observable\"; otherwise they wait until after paint. React 18 introduced that rule for discrete events."
  question: react/rendering-model/render-and-commit
- id: rc-flushsync-effects-run
  front: "In Chrome 156 and Firefox 159 development, what had run when `flushSync` returned in the Counter example?"
  back: "The whole render and commit, effects included: render, layout effect and effect logs all came before the line after `flushSync`."
  question: react/rendering-model/render-and-commit
- id: rc-timeout-update-order
  front: "A `setState` in a `setTimeout` callback: does it render before the next animation frame?"
  back: "It uses the default lane and renders in a Scheduler task. Chrome 156 rendered it before the next animation frame and Firefox 159 after it, so do not depend on either."
  question: react/rendering-model/render-and-commit
- id: rc-layout-effect-sets-state
  front: "What happens when a layout effect sets state?"
  back: "The update is processed synchronously before paint, so a measured-then-corrected position never flashes. That is the documented use of `useLayoutEffect`, at the cost of blocking paint."
  question: react/rendering-model/render-and-commit
- id: rc-scroll-new-item
  front: "Why does `setItems(next)` followed by `listRef.current.lastChild.scrollIntoView()` scroll to the old last item?"
  back: "The new `<li>` does not exist until commit. Wrap the update in `flushSync`, or move the scroll into an effect that runs after the commit."
  question: react/rendering-model/render-and-commit
- id: rc-default-subtree-rerender
  front: "By default, what does an update re-render, and what are the opt-outs?"
  back: "The whole subtree below the component that changed. `memo` and the React Compiler are the opt-outs, not the commit phase."
  question: react/rendering-model/render-and-commit

- id: pure-render-contract
  front: "What must a component do during render, as far as React is concerned?"
  back: "Be a pure calculation: given the same props, state and context it must return the same elements, and it must not change anything that existed before the call (module variables, props, state objects, the DOM, a network request)."
  question: react/rendering-model/purity-and-strict-mode
- id: pure-why-needed
  front: "Why does React need render to be pure?"
  back: "React does not promise one call per update. It may render and discard the result (interrupted transition, Suspense retry), render twice (Strict Mode), skip the component (`memo`, React Compiler), or render on the server. Each is safe only if calling the component has no effect beyond its return value."
  question: react/rendering-model/purity-and-strict-mode
- id: pure-local-mutation-ok
  front: "Is mutation allowed during render?"
  back: "Local mutation is fine: building a new array and pushing into it during render changes nothing anyone else can see. Lazy initialisation (a `useState` initializer) is fine too."
  question: react/rendering-model/purity-and-strict-mode
- id: pure-side-effects-where
  front: "Where do side effects belong if not in render?"
  back: "In event handlers, or in effects as a last resort; they run outside rendering."
  question: react/rendering-model/purity-and-strict-mode
- id: strict-double-invoked
  front: "What does Strict Mode call twice in development builds?"
  back: "The component body (not event handlers); functions passed to `useState`, `useReducer` and `useMemo`, and reducer and updater functions; and some class methods such as `constructor`, `render` and `shouldComponentUpdate`."
  question: react/rendering-model/purity-and-strict-mode
- id: strict-which-result-kept
  front: "How does double invocation reveal impurity, and which result does React keep?"
  back: "A pure function returns the same thing twice, so nothing changes; an impure one shows the difference (an item pushed twice, a counter that skips numbers). React keeps one result and ignores the other."
  question: react/rendering-model/purity-and-strict-mode
- id: strict-extra-effect-cycle
  front: "What other checks does Strict Mode add, and what do they test?"
  back: "An extra effect setup and cleanup cycle, and an extra ref callback setup and cleanup on mount. Those test cleanup, not purity."
  question: react/rendering-model/purity-and-strict-mode
- id: strict-dev-only
  front: "Does Strict Mode double-invocation happen in production builds?"
  back: "No. It is development only."
  question: react/rendering-model/purity-and-strict-mode
- id: strict-limits
  front: "What kind of impurity does double rendering catch, and what slips through?"
  back: "Only impurity that changes the result between two back-to-back calls. An in-place `sort()` of a props array returns the same order twice, so it passes, yet still mutates the parent's data."
  question: react/rendering-model/purity-and-strict-mode
- id: strict-counter-id-example
  front: "A component computes `field-${nextId++}` from a module variable. What do ids look like in a development build of React 19.3.1 with Strict Mode, versus production?"
  back: "Development: `field-1, field-3` then `field-5, field-7`, because each body ran twice. Production: `field-0, field-1` then `field-2, field-3`. The ids drift on every render either way, and a server render would differ from the client; Strict Mode just makes it visible on the first render."
  question: react/rendering-model/purity-and-strict-mode
- id: pure-useid-fix
  front: "How do you replace a module-counter id so it is pure?"
  back: "Use `useId`, which derives the id from the component's position in the tree and gives the same id each time."
  question: react/rendering-model/purity-and-strict-mode
- id: strict-dont-remove-to-silence
  front: "Is removing `<StrictMode>` or adding a \"has run\" flag a fix for double logs?"
  back: "No. It hides the bug; production can still call the component more than once."
  question: react/rendering-model/purity-and-strict-mode
- id: pure-no-props-mutation
  front: "How do you avoid mutating props during render, such as `items.push(extra)` on an array from props?"
  back: "Copy first, or compute a new array."
  question: react/rendering-model/purity-and-strict-mode
- id: pure-unstable-reads
  front: "Where should values that change between calls, like `Math.random()` or `new Date()`, be read?"
  back: "Not in render. Move them into an effect, a handler or a lazy initializer."
  question: react/rendering-model/purity-and-strict-mode
- id: strict-console-log
  front: "Does `console.log` in a component print twice in Strict Mode in React 19.3.1?"
  back: "Yes, both calls printed in Chrome and Firefox. With React DevTools installed the second log is dimmed, and a DevTools setting can hide it. Legacy: React 17 suppressed console logs during the second call."
  question: react/rendering-model/purity-and-strict-mode
- id: strict-usememo-not-four
  front: "Does Strict Mode run the `useMemo` calculation four times on mount?"
  back: "No. In React 19.3.1 the `useState` initializer and the `useMemo` calculation each ran twice during the first body call, and the second body call reused their results, as the React 19 upgrade guide describes."
  question: react/rendering-model/purity-and-strict-mode
- id: strict-handlers-not-doubled
  front: "Are event handlers double-invoked in Strict Mode?"
  back: "No. They do not run during rendering, so they need not be pure; that is where side effects belong. Only the component body and functions React calls while rendering are doubled."
  question: react/rendering-model/purity-and-strict-mode
- id: strict-call-order
  front: "In a development build, in what order do two sibling components `Item a` and `Item b` push their names under Strict Mode?"
  back: "`a a b b`. Each component body is called twice in a row before React moves to the next component. A production build gives `a b`."
  question: react/rendering-model/purity-and-strict-mode

- id: hooks-order-slots
  front: "How does React know which state variable a `useState` call refers to?"
  back: "By order. React keeps a list of hook slots per component instance and hands them out one by one as hooks are called; the first `useState` gets slot 1, the next hook slot 2, every render."
  question: react/rendering-model/rules-of-hooks
- id: hooks-rule-top-level
  front: "What does \"call hooks only at the top level\" exclude?"
  back: "Conditions, loops, nested functions, `try`/`catch`/`finally`, and anything after an early `return`."
  question: react/rendering-model/rules-of-hooks
- id: hooks-rule-react-functions
  front: "Where may hooks be called from?"
  back: "Only React functions: components and custom hooks (functions named `use…`). Never plain functions, class components, event handlers or effects."
  question: react/rendering-model/rules-of-hooks
- id: hooks-shift-same-count
  front: "What happens when a condition skips a hook but the number and types of hooks stay the same?"
  back: "It is silent: every later hook shifts one slot, so a variable shows another variable's state, with no error or warning in either build."
  question: react/rendering-model/rules-of-hooks
- id: hooks-shift-different-count
  front: "What errors does React throw when the hook count changes between renders?"
  back: "\"Rendered more hooks than during the previous render.\" or \"Rendered fewer hooks than expected. This may be caused by an accidental early return statement.\" When hook kinds at a position differ, development builds also log \"React has detected a change in the order of Hooks\"."
  question: react/rendering-model/rules-of-hooks
- id: hooks-fix-structural
  front: "How do you fix a conditionally needed hook?"
  back: "Call the hook unconditionally and put the condition inside it (in the effect body or the value you use), or move the conditional part into a child component that renders conditionally, so it gets its own slots."
  question: react/rendering-model/rules-of-hooks
- id: hooks-lint-rule
  front: "Which lint rule enforces the Rules of Hooks, and which hook is exempt?"
  back: "`react-hooks/rules-of-hooks` in `eslint-plugin-react-hooks`. `use` is the exception: it can be called in conditions and loops."
  question: react/rendering-model/rules-of-hooks
- id: hooks-minified-errors
  front: "What do production builds throw instead of the hook-count messages in React 19.3.1?"
  back: "Minified React error #310 for \"more hooks\" and #300 for \"fewer hooks\"; #311 replaces \"Should have a queue…\" for a `useState`/`useRef` kind swap."
  question: react/rendering-model/rules-of-hooks
- id: hooks-early-return-pitfall
  front: "Why is `if (!user) return null;` above a `useEffect` a bug even though it works at first?"
  back: "It works until the condition flips, then the hook count changes and React throws."
  question: react/rendering-model/rules-of-hooks
- id: hooks-custom-hook-conditional
  front: "Is calling a custom hook conditionally allowed?"
  back: "No. It is the same violation: all the hooks inside it shift."
  question: react/rendering-model/rules-of-hooks
- id: hooks-use-exception
  front: "Why does `use` get an exception from the Rules of Hooks?"
  back: "It does not take a slot in the hook list; it reads a promise or context passed to it directly, so its position does not matter. It cannot go inside `try`/`catch`, and React 19.3 added a warning for some incorrect conditional uses."
  question: react/rendering-model/rules-of-hooks
- id: hooks-outside-component
  front: "What happens in React 19.3.1 if you call `useState` outside a component?"
  back: "There is no dispatcher. Development builds log \"Invalid hook call. Hooks can only be called inside of the body of a function component.\" and then a `TypeError` is thrown; production builds throw only the `TypeError`."
  question: react/rendering-model/rules-of-hooks
- id: hooks-fixed-length-loop
  front: "Why not call a hook in a loop of fixed length?"
  back: "The order would be stable, but the lint rule rejects it and a later change to the length breaks it. Render one child component per item instead; each gets its own hook list."
  question: react/rendering-model/rules-of-hooks
- id: hooks-impl-linked-list
  front: "The docs describe hooks as an array plus an index. How does React 19.3.1 implement it?"
  back: "As a linked list (an implementation detail): the fiber's `memoizedState` points to the first `Hook` object, and each holds `memoizedState`, `baseState`, `baseQueue`, `queue` and `next`."
  question: react/rendering-model/rules-of-hooks
- id: hooks-impl-mount-update
  front: "How do mount and update differ for hooks in React 19.3.1?"
  back: "Mount: `mountWorkInProgressHook` creates a new `Hook` for each call and appends it. Update: `updateWorkInProgressHook` walks the previous list in step with the calls, so the nth call clones the nth hook. Nothing checks which hook created the slot; only position counts."
  question: react/rendering-model/rules-of-hooks
- id: hooks-impl-wrong-kind
  front: "What error appears when a `useState` call lands on a slot created by `useRef`?"
  back: "It finds no update queue and throws \"Should have a queue. You are likely calling Hooks conditionally, which is not allowed.\" (production: error #311), after a development warning."
  question: react/rendering-model/rules-of-hooks
- id: hooks-dev-order-warning
  front: "How do development builds produce the \"change in the order of Hooks\" warning?"
  back: "They record the name of every hook called and compare it with the last render, printing a two-column table of previous and next hook names."
  question: react/rendering-model/rules-of-hooks
- id: hooks-queue-belongs-to-slot
  front: "After a hook-order shift, which variable does a state setter update?"
  back: "The same slot. Each update queue belongs to the hook object, not to the variable name, so the setter keeps updating that slot even when a different variable now reads it."
  question: react/rendering-model/rules-of-hooks
- id: hooks-zero-then-one
  front: "What happens when a component has 0 hooks on one render and 1 on the next?"
  back: "No error: a fiber with no hooks yet takes the mount path. A component whose early `return` comes before every hook therefore does not crash, so the bug ships; the lint rule still reports it."
  question: react/rendering-model/rules-of-hooks
- id: hooks-lint-message-version
  front: "What does the lint rule report for a `useMemo` after an early return, and with which tool versions was it measured?"
  back: "\"React Hook \"useMemo\" is called conditionally. React Hooks must be called in the exact same order in every component render. Did you accidentally call a React Hook after an early return?\" From `eslint-plugin-react-hooks` 7.1.1 with ESLint 10.13."
  question: react/rendering-model/rules-of-hooks
- id: hooks-tradeoff
  front: "What do order-based hooks buy, and what do they cost?"
  back: "A terse API: no keys to invent, and custom hooks compose without name clashes because two calls take different slots. The price is a static rule the language cannot enforce, so it falls to the linter. When modes need different state, render different components or reset one with a `key`."
  question: react/rendering-model/rules-of-hooks

- id: rerender-three-reasons
  front: "What are the three reasons a component re-renders after the first render?"
  back: "Its own state changed, its parent re-rendered, or a context it reads changed. External stores read through `useSyncExternalStore` work like state."
  question: react/rendering-model/when-components-rerender
- id: rerender-state-object-is
  front: "How does React decide whether a state setter call re-renders?"
  back: "It compares the new value with `Object.is`. If it is the same, React skips the component and its children, though it may still call the component once before bailing out."
  question: react/rendering-model/when-components-rerender
- id: rerender-parent-recursive
  front: "When a component renders, which child components render, and does React compare props by default?"
  back: "Every component in the JSX it returns renders too, whether or not their props changed. Each call creates a new props object, and by default React does not compare props."
  question: react/rendering-model/when-components-rerender
- id: rerender-context-value
  front: "When does a context change re-render consumers?"
  back: "When the provider's `value` changes by `Object.is`, every component that reads that context with `useContext` or `use` re-renders, even if everything between them skipped rendering."
  question: react/rendering-model/when-components-rerender
- id: rerender-props-backwards
  front: "Why is \"it re-renders because its props changed\" backwards?"
  back: "Props come from the parent's render, so they can only change when the parent renders, and that render alone is enough. Mutating an object passed as a prop triggers nothing."
  question: react/rendering-model/when-components-rerender
- id: rerender-same-element-skip
  front: "How can a component skip rendering without `memo`?"
  back: "React skips a component whose element is the same object as last time. Elements received as `children` were created by the parent, so if only the component's own state changed they are unchanged. Moving state down, or passing parts of the tree as `children`, limits re-renders."
  question: react/rendering-model/when-components-rerender
- id: rerender-memo-compiler
  front: "How can you skip rendering when props are shallowly equal?"
  back: "Wrap the child in `memo`; the React Compiler does the equivalent automatically."
  question: react/rendering-model/when-components-rerender
- id: rerender-key-change
  front: "What does a changed `key` do?"
  back: "React unmounts and mounts a new instance instead of re-rendering."
  question: react/rendering-model/when-components-rerender
- id: rerender-example-click-sequence
  front: "In the theme example, what renders on the first, second and third click of \"dark\"?"
  back: "First: `ThemeProvider`, `Footer` (identical props, but its parent rendered), and `ThemedLabel` (through context alone); `Sidebar` is skipped. Second: only `ThemeProvider`. Third: nothing. Same in Chrome 156 and Firefox 159, development and production builds of React 19.3.1, no Strict Mode."
  question: react/rendering-model/when-components-rerender
- id: rerender-memo-fresh-props
  front: "Why does `memo` fail when you pass a fresh object, array or arrow function each render?"
  back: "`Object.is` sees a new reference every time."
  question: react/rendering-model/when-components-rerender
- id: rerender-mutate-same-ref
  front: "Why does `todos.push(x); setTodos(todos)` not render?"
  back: "`todos` is the same array object, so `Object.is` says nothing changed and React drops the update. Use `setTodos([...todos, 'eggs'])`."
  question: react/rendering-model/when-components-rerender
- id: rerender-lift-state-pitfall
  front: "What is the cost of lifting state to the top of the tree \"just in case\"?"
  back: "Every update then re-renders everything below it."
  question: react/rendering-model/when-components-rerender
- id: rerender-strict-counting
  front: "Why count renders outside Strict Mode?"
  back: "Development builds call each component twice per render in Strict Mode. Strict Mode does not add re-renders, so the trigger rules are the same; count in production or outside `<StrictMode>`."
  question: react/rendering-model/when-components-rerender
- id: rerender-context-passthrough
  front: "Does a component re-render if it only passes a context's provider down?"
  back: "No. Only components that read the context re-render because of it; `Sidebar` between provider and `ThemedLabel` was skipped."
  question: react/rendering-model/when-components-rerender
- id: rerender-eager-bailout
  front: "Why did the second same-value \"dark\" click still call `ThemeProvider` in React 19.3.1?"
  back: "`setState` compares eagerly only when neither copy of the component's fiber has pending work. Right after the first update one still did, so React rendered `ThemeProvider`, found the state unchanged, and skipped its children. By the third click the eager comparison applied and nothing was scheduled."
  question: react/rendering-model/when-components-rerender
- id: rerender-not-dom-change
  front: "Does a re-render mean the DOM changed?"
  back: "No. Re-rendering means React called the component. The commit then applies only the differences, often none."
  question: react/rendering-model/when-components-rerender
- id: rerender-fiber-lanes
  front: "How does React 19.3.1 know which subtrees contain pending work?"
  back: "A state update marks a lane on the component's fiber and a `childLanes` marker on every ancestor (implementation detail, `ReactFiberBeginWork.js` and `ReactFiberHooks.js`)."
  question: react/rendering-model/when-components-rerender
- id: rerender-props-reference-check
  front: "How does React 19.3.1 compare props for a fiber, and what is the result after a parent renders?"
  back: "By reference: `oldProps !== newProps`. A parent that rendered created new elements with new props objects, so the check fails and the child renders. A fiber whose element was not recreated keeps the same props object."
  question: react/rendering-model/when-components-rerender
- id: rerender-bailout-childlanes
  front: "On a bailout with same props, no pending update and no changed context, what does React do with the subtree?"
  back: "It does not call the component. If no descendant has pending work (`childLanes`), it skips the entire subtree; otherwise it reuses this fiber and keeps walking to the descendants that do."
  question: react/rendering-model/when-components-rerender
- id: rerender-context-marks-consumers
  front: "How do context consumers render inside a bailed-out subtree?"
  back: "When a provider's value changes, React finds the fibers that depend on that context and marks updates on them."
  question: react/rendering-model/when-components-rerender
- id: rerender-dispatch-eager
  front: "How does `dispatchSetState` handle a same-value update?"
  back: "When the fiber's queue is empty it computes the next state immediately and, if `Object.is` says unchanged, drops the update without scheduling. When the queue is not empty, React must render the component to find out, then bails out on its children."
  question: react/rendering-model/when-components-rerender
- id: rerender-updater-returns-prev
  front: "Does an updater function that returns the previous state bail out?"
  back: "Yes, the same way. `setTodos((t) => t)` logged nothing on two clicks."
  question: react/rendering-model/when-components-rerender
- id: rerender-context-object-value
  front: "Why does `<Theme value={{ theme, toggle }}>` re-render every consumer?"
  back: "It creates a new object every time the provider renders, so consumers re-render even if `theme` did not change. Memoize the value or split the context."
  question: react/rendering-model/when-components-rerender
- id: rerender-search-box-scenario
  front: "How do you stop each keystroke re-rendering header, results and footer when `query` lives in the top-level component?"
  back: "Move `query` into a `<SearchBox>` component, or have the layout take the slow parts as `children`. Reach for `memo` when the structure cannot change."
  question: react/rendering-model/when-components-rerender
- id: rerender-tradeoff
  front: "Why does React re-render children by default, and what does it cost?"
  back: "It is simple and correct: React never has to know whether a child depends on something the parent did not pass as a prop. The cost is CPU time for components whose output did not change; the optimisation is left to `memo`, `useMemo`, composition or the React Compiler, which memoizes automatically when code follows the Rules of React."
  question: react/rendering-model/when-components-rerender

# 02 State
- id: snap-const-binding
  front: "What is `count` in `const [count, setCount] = useState(0)`, and where does React keep the real state?"
  back: "An ordinary local constant. React keeps the real state outside your component and hands your function the value for that render. Everything the render creates, from JSX to handlers, closes over that value: the docs call it a snapshot."
  question: react/state/state-as-snapshot
- id: snap-setter-does-not-reassign
  front: "Why can `setCount(count + 1)` not change `count` in the running handler?"
  back: "`count` is a `const` inside a function call that already ran. The setter queues an update and asks React to render again; the next render is a new call with a new `count` binding. The running handler keeps the old value, even after an `await` or in a late timeout."
  question: react/state/state-as-snapshot
- id: snap-symptoms
  front: "What are the usual symptoms of the state snapshot?"
  back: "`console.log(count)` right after the setter prints the old value; `setCount(count + 1)` three times in one handler adds 1; a `setInterval` created once in an effect with `[]` reads the first render's value forever."
  question: react/state/state-as-snapshot
- id: snap-getting-new-value
  front: "How do you get the new value when you need it?"
  back: "In the same handler, compute it into a variable and keep using it. Based on previous state, pass an updater `setCount(c => c + 1)`, which receives the latest queued state. From a long-lived callback, let the effect re-subscribe when the value changes, or keep the latest value in a ref."
  question: react/state/state-as-snapshot
- id: snap-deliberate
  front: "Why is the snapshot behaviour deliberate?"
  back: "A handler acts on what the user saw when they clicked, not on whatever state has become after an async step. For discrete events like clicks React also renders before the next one, so the next click's handler already sees the new value."
  question: react/state/state-as-snapshot
- id: snap-timeout-example
  front: "In the Counter example, a click calls `setCount(count + 1)` and logs `count` in the handler and in a 1-second timeout. What is logged on the first click?"
  back: "`handler 0`, then `render 1`, then `timeout 0`: the timeout closed over the first render's `count`. The second click ran the second render's handler. Same in Chrome 156 and Firefox 159, development and production builds of React 19.3.1, no Strict Mode."
  question: react/state/state-as-snapshot
- id: snap-check-after-set
  front: "Why is `setItems(next); if (items.length > 10) …` wrong?"
  back: "It checks the old array. Use `next`."
  question: react/state/state-as-snapshot
- id: snap-no-hide-stale-closure
  front: "Is removing a variable from an effect's dependencies, or suppressing the lint rule, a fix for a stale read?"
  back: "No. It hides the stale closure instead of fixing it."
  question: react/state/state-as-snapshot
- id: snap-class-components
  front: "Do class components behave like the hook snapshot?"
  back: "Only partly. Right after `this.setState`, `this.state` still holds the old value, but React replaces `this.state` on the instance when it renders the update, so a timeout reading `this.state.count` logged `1` where the hook version logged `0`. Hooks have no instance for React to update."
  question: react/state/state-as-snapshot
- id: snap-not-a-bug
  front: "Is the stale value a React bug?"
  back: "No, it is how closures work: each render is a function call and callbacks keep the bindings of the call that created them. React could only \"fix\" it by mutating your variables, which would make one render's output disagree with its own handlers."
  question: react/state/state-as-snapshot
- id: snap-interval-latest
  front: "How do you read the latest state inside an interval?"
  back: "To compute the next state, use an updater: `setSeconds(s => s + 1)`. If you need the value for something else, such as sending it, list it as a dependency so the effect recreates the interval, or mirror it in a ref."
  question: react/state/state-as-snapshot
- id: snap-impl-hook-object
  front: "Where does React 19.3.1 store a `useState` call's value, and how does your local constant get it?"
  back: "In a hook object on the component's fiber, matched to the call by position (implementation detail). The hook holds the committed value (`memoizedState`) and a queue of pending updates; `useState` returns `[hook.memoizedState, setter]` and your destructuring copies the value into a local constant."
  question: react/state/state-as-snapshot
- id: snap-setter-identity
  front: "Why does the state setter's identity never change?"
  back: "It is `dispatchSetState`, bound to that fiber and queue when the component mounted. It appends an update and schedules a render, and never touches your variable."
  question: react/state/state-as-snapshot
- id: snap-await-example
  front: "A handler does `setStatus('sending')`, awaits a 200ms promise, then logs `status`. What does it log, and why?"
  back: "The old value, `idle`, although the component had already rendered with `'sending'`. The variable belongs to the call, not to the moment. Same in Chrome 156 and Firefox 159, development and production."
  question: react/state/state-as-snapshot
- id: snap-objects-by-reference
  front: "Is the state snapshot a deep copy of objects?"
  back: "No, the snapshot is the reference. If someone mutates the object, an old closure sees the mutation, which is one more reason to update state immutably."
  question: react/state/state-as-snapshot
- id: snap-refs-not-snapshotted
  front: "Are refs snapshotted like state?"
  back: "No. `ref.current` read in a timeout returns whatever it holds at that moment, which is why refs are the escape hatch for \"latest value\" reads and why reading them during render is discouraged."
  question: react/state/state-as-snapshot
- id: snap-autosave-scenario
  front: "An autosave interval created in an effect with `[]` saves the empty initial draft. Why does adding `draft` as a dependency not fully fix it, and what does?"
  back: "It fixes the value but restarts the timer on every keystroke, so a fast typist never triggers a save. Keep the interval stable and read the current draft from a ref the component keeps updated, or from an Effect Event."
  question: react/state/state-as-snapshot
- id: snap-tradeoff
  front: "What do snapshots buy, and what do they cost?"
  back: "Each render is internally consistent (output, handlers and effects agree on one set of values), and React can prepare a render with newer state, as concurrent rendering does, without changing handlers already on screen. The cost lands on long-lived callbacks, which must opt into fresh values via updaters, dependencies or refs."
  question: react/state/state-as-snapshot
- id: snap-timer-stops
  front: "A `Timer` runs `setInterval(() => setSeconds(seconds + 1), 1000)` in an effect with `[]`. What does it show over time, and what fixes it?"
  back: "It shows `1` after a second and stays at `1`: the callback closed over `seconds = 0`, so every tick calls `setSeconds(1)` and React bails out once unchanged. `setSeconds((s) => s + 1)` counts up."
  question: react/state/state-as-snapshot

- id: batch-what
  front: "What is batching, and in which contexts does it apply since React 18 with `createRoot`?"
  back: "A setter appends an update to a queue and schedules a render; when the running code finishes, React renders once, applying all queued updates across all state and components. It holds in React event handlers, `setTimeout`, promise callbacks and native `addEventListener` handlers. Separate user events each get their own render."
  question: react/state/batching-and-updater-functions
- id: batch-value-vs-updater
  front: "How does React treat a value versus an updater function in the update queue?"
  back: "A value, `setN(n + 1)`, means \"replace with this\", computed from the render's snapshot. An updater, `setN(m => m + 1)`, means \"compute from the state so far\": React passes it the previous update's result. Updates are processed in the order queued."
  question: react/state/batching-and-updater-functions
- id: batch-queue-results
  front: "With `n = 0`, what do `setN(n + 1)` twice, `setN(m => m + 1)` twice, and `setN(n + 5); setN(m => m + 1)` give?"
  back: "`1`, `2` and `6`. A later `setN(42)` in the same handler replaces all of that with `42`."
  question: react/state/batching-and-updater-functions
- id: batch-when-updater
  front: "When should you use an updater function?"
  back: "When the next state depends on the previous one and more than one update can queue before the next render: several updates in one handler, or a timer or subscription created in an earlier render. For a single update per click both forms behave the same, since React renders before the next click."
  question: react/state/batching-and-updater-functions
- id: batch-updaters-pure
  front: "Why must updater functions be pure?"
  back: "They run during rendering (React may run the first one early, as an optimization), so no side effects and no other setters. Strict Mode calls them twice in development."
  question: react/state/batching-and-updater-functions
- id: batch-flushsync
  front: "How do you opt out of batching, and when?"
  back: "`flushSync(() => setN(1))` from `react-dom` renders and commits before returning, so the next line sees the updated DOM. It is a last resort for code that must read the DOM immediately."
  question: react/state/batching-and-updater-functions
- id: batch-legacy-react17
  front: "How did batching work before React 18 and with `ReactDOM.render`?"
  back: "Only React event handlers batched. `ReactDOM.render` was removed in React 19."
  question: react/state/batching-and-updater-functions
- id: batch-one-render-per-click
  front: "In the Counter example, how many renders does each click log, and what do `replaceTwice`, `updateTwice` and `mixed` render from 0?"
  back: "Exactly one render each, whatever the number of setter calls: `1`, `2` and `6`; `mixed` followed by `setN(42)` renders `42`. Chrome 156 and Firefox 159, development and production builds of React 19.3.1, no Strict Mode."
  question: react/state/batching-and-updater-functions
- id: batch-loop-same-snapshot
  front: "Why does `setCount(count + 1)` called several times in a row not accumulate?"
  back: "Every call reads the same snapshot."
  question: react/state/batching-and-updater-functions
- id: batch-updater-wrong-variable
  front: "What does `setN(m => n + 1)` do?"
  back: "It reads the snapshot `n` instead of the argument, ignores the queue and behaves like a plain value."
  question: react/state/batching-and-updater-functions
- id: batch-dom-next-line
  front: "Does the DOM reflect a state change on the next line of a handler?"
  back: "No, not until React renders; use `flushSync` only when you really must."
  question: react/state/batching-and-updater-functions
- id: batch-setstate-async
  front: "Is `setState` asynchronous?"
  back: "Not in the Promise sense: it returns `undefined` and cannot be awaited. It queues an update synchronously; the render happens later, after the running code finishes. For a click, React 19.3.1 renders in a microtask it queues on the first update."
  question: react/state/batching-and-updater-functions
- id: batch-two-timeouts
  front: "Do two separate `setTimeout` callbacks get batched together?"
  back: "Each callback's updates are batched within it. Whether two callbacks share a render depends on whether React's scheduled render ran between them, so do not rely on it either way."
  question: react/state/batching-and-updater-functions
- id: batch-unstable-batchedupdates
  front: "What does `unstable_batchedUpdates` do with `createRoot`?"
  back: "Nothing; it is unnecessary because everything is already batched. The React 18 working group kept the export for libraries, and `react-dom` 19.3.1 still exports it."
  question: react/state/batching-and-updater-functions
- id: batch-impl-queue
  front: "How does React 19.3.1 store and schedule pending state updates?"
  back: "As a circular linked list (`queue.pending`) on the hook; each update records its `action` and lane. The setter `dispatchSetState` appends an update and calls `scheduleUpdateOnFiber`. Scheduling is per root: the first update queues one microtask and later updates find the render already scheduled. Implementation details from `ReactFiberHooks.js`."
  question: react/state/batching-and-updater-functions
- id: batch-impl-reducer
  front: "What reducer does `useState` run the update queue through?"
  back: "Literally `typeof action === 'function' ? action(state) : action`: a value ignores the state it is given, an updater uses it."
  question: react/state/batching-and-updater-functions
- id: batch-lanes-skipped
  front: "What happens to updates whose lane is not part of the current render?"
  back: "They are skipped and kept, then re-applied in their original order in a later render, so the final state is the same as if everything had run in order."
  question: react/state/batching-and-updater-functions
- id: batch-two-setters-one-render
  front: "Two setters called in one callback, run from a handler, a `setTimeout`, a promise or a native listener: how many renders?"
  back: "One render in every case, in development and production, Chrome 156 and Firefox 159. A synthetic `button.click()` from script also gave one."
  question: react/state/batching-and-updater-functions
- id: batch-updater-runs-early
  front: "When do updaters actually run in React 19.3.1, compared with the docs?"
  back: "The docs say during the next render. React 19.3.1 adds an optimization in `dispatchSetState`: when the component has no pending update, it computes the first update immediately at the setter call so it can drop no-op updates. Later updates wait for the render. Pure code cannot tell the difference."
  question: react/state/batching-and-updater-functions
- id: batch-early-updater-sequence
  front: "Two updaters in one handler: what order do they run on the first click after mount versus the second click?"
  back: "First click: updater 1 gets 0, handler done, updater 2 gets 1, render 2. Second click: handler done, then updater 1 gets 2 and updater 2 gets 3, render 4, because the fiber's other copy still had work marked so nothing ran early. Chrome 156 and Firefox 159, development and production, no Strict Mode."
  question: react/state/batching-and-updater-functions
- id: batch-flushsync-splits
  front: "What does `flushSync(() => setA(...))` followed by `setB(...)` in one handler do?"
  back: "It splits the batch: render with new `a`, the DOM already shows the new `a` on the next line, then a second render for `setB`. Development and production, both browsers. Per the docs, `flushSync` may also flush other pending updates and effects first, and can force a Suspense fallback to show."
  question: react/state/batching-and-updater-functions
- id: batch-render-phase-updates
  front: "When is calling a setter during render allowed?"
  back: "Only for the component that is rendering; React discards the output and re-renders immediately. That is the \"store information from previous renders\" pattern, not batching."
  question: react/state/batching-and-updater-functions
- id: batch-likes-scenario
  front: "A like button does `setLikes(likes + 1)` and rolls back with `setLikes(likes)` on failure. What goes wrong after two clicks and a failed first request?"
  back: "The rollback restores the first click's snapshot, 0, wiping out the second like too. With `setLikes(l => l + 1)` and rollback `setLikes(l => l - 1)` the count ends at 1, because each change applies to the state as React finds it."
  question: react/state/batching-and-updater-functions
- id: batch-tradeoff
  front: "What does batching trade, and when does a reducer read better than updaters?"
  back: "It trades immediacy for consistency and speed: one render per event and no half-updated UI, but nothing is observable until React renders. When several state variables must change together by rules, a reducer usually reads better than a chain of updaters. The docs treat always using updaters for derived updates as a reasonable style, not a requirement."
  question: react/state/batching-and-updater-functions
- id: batch-predict-render
  front: "From `n = 0`, a handler runs `setN(n + 1)`, `setN(m => m * 2)`, `setN(n + 10)`, `setN(m => m + 1)`. What renders, and after a second click?"
  back: "`11`: replace with 1, double (2), replace with 10, add 1. A second click from 11 renders 22: replace with 12, double (24), replace with 21, add 1."
  question: react/state/batching-and-updater-functions

- id: reducer-signature
  front: "What does `useReducer(reducer, initialArg, init?)` do?"
  back: "It moves update logic out of handlers into one pure function `(state, action) => nextState`. Handlers say what happened (`dispatch({ type: 'submitted' })`); the reducer decides how state changes."
  question: react/state/use-reducer
- id: reducer-same-as-usestate
  front: "What behaves the same in `useReducer` as in `useState`?"
  back: "Each render sees a snapshot, dispatches are queued and batched, an unchanged result (by `Object.is`) skips the children, and `dispatch` keeps the same identity across renders."
  question: react/state/use-reducer
- id: reducer-when-values-together
  front: "Why use a reducer when several values change together?"
  back: "A form's status, error and data move as one: one action updates them consistently, where three setters can leave them disagreeing."
  question: react/state/use-reducer
- id: reducer-sees-whole-state
  front: "What does a reducer see that an updater function does not?"
  back: "The whole state object. An updater only sees its own variable."
  question: react/state/use-reducer
- id: reducer-many-handlers
  front: "Why does a reducer help when many handlers make similar updates?"
  back: "One function is easier to read, log (\"which action caused this?\") and unit-test without rendering anything."
  question: react/state/use-reducer
- id: reducer-dispatch-context
  front: "Why is `dispatch` convenient to pass through context?"
  back: "It is stable, so it can go through context once and every consumer can send actions without new callbacks each render."
  question: react/state/use-reducer
- id: reducer-vs-usestate-choice
  front: "When should you stay with `useState`, and how do the two relate?"
  back: "For independent, simple values such as a toggle, an input or a counter. They mix freely in one component, and `useState` is a reducer whose actions are values or updater functions."
  question: react/state/use-reducer
- id: reducer-rules
  front: "What rules apply to reducers because they run during rendering?"
  back: "Keep them pure (no requests, timeouts or mutation; Strict Mode calls them twice in development), return a new object for a change and the same `state` for a no-op, throw on unknown actions instead of returning `undefined`, and name actions after interactions (`reset_form`), not field assignments."
  question: react/state/use-reducer
- id: reducer-form-example-order
  front: "In the SignupForm example, when does the reducer run relative to `dispatch`, and what does Strict Mode do in development?"
  back: "After `dispatched` is logged, during the render. Under Strict Mode in development every line but `dispatched` appeared twice. Chrome 156 and Firefox 159, development and production builds of React 19.3.1."
  question: react/state/use-reducer
- id: reducer-mutate-return-same
  front: "What happens if a reducer mutates `state` and returns it?"
  back: "The result is the same object, so React discards the render."
  question: react/state/use-reducer
- id: reducer-no-side-effects
  front: "Why not fetch or write `localStorage` in a reducer?"
  back: "They run during render, and twice in Strict Mode development. Do them in the handler that dispatches."
  question: react/state/use-reducer
- id: reducer-partial-state
  front: "What is wrong with `return { status: 'error' }` from a reducer?"
  back: "It drops `error` and anything else. Spread the rest, or return complete states."
  question: react/state/use-reducer
- id: reducer-state-after-dispatch
  front: "Does `state` change right after `dispatch`?"
  back: "No. Like a setter, it only affects the next render."
  question: react/state/use-reducer
- id: reducer-same-state-renders-component
  front: "When a reducer returns the same state in React 19.3.1, does the component itself render?"
  back: "Yes. React skips the children, but `dispatch` does not pre-compute the result the way `useState`'s setter can, so the component renders each time: a no-op action logged `reducer noop` and `render error` on every click while a child stayed silent."
  question: react/state/use-reducer
- id: reducer-not-faster
  front: "Is `useReducer` faster than `useState`?"
  back: "No. In React 19.3.1 `useState` goes through the same code path with a built-in reducer (implementation detail). The choice is about where update logic lives."
  question: react/state/use-reducer
- id: reducer-init-arg
  front: "What is the third argument of `useReducer` for?"
  back: "`init` computes the initial state once: `useReducer(reducer, userId, createInitialState)` calls `createInitialState(userId)` on mount instead of rebuilding the initial value every render. Strict Mode calls it twice in development."
  question: react/state/use-reducer
- id: reducer-toggle-mutation
  front: "A toggle reducer does `state.on = !state.on; return state;`. What happens on a click without Strict Mode, and with it in development?"
  back: "Without Strict Mode the first click logs `render true` yet the button still says `off`: same object, `Object.is` finds no change, React throws the output away. Under Strict Mode the reducer runs twice, flips `on` back, and logs `render false`. Fix: `return { ...state, on: !state.on }`."
  question: react/state/use-reducer

- id: immut-object-is
  front: "How does React decide whether state changed, and what must you do to change it?"
  back: "It compares new and old values with `Object.is`, a reference check for objects and arrays. Treat state as read-only and pass the setter a new object or array."
  question: react/state/immutable-updates
- id: immut-no-render
  front: "What happens with `todo.done = true; setTodos(todos)`?"
  back: "The same array is passed, React sees no change and drops the update."
  question: react/state/immutable-updates
- id: immut-appears-later
  front: "Why do mutated updates sometimes appear later at random?"
  back: "The mutation stays in the object, so the next unrelated render shows it."
  question: react/state/immutable-updates
- id: immut-memoization-miss
  front: "Why do `memo`, `useMemo`, `useCallback` and effect dependencies miss a mutation?"
  back: "They all compare by reference, so a mutated object looks unchanged. The React Compiler's automatic memoization relies on the same rule of React: props and state are immutable."
  question: react/state/immutable-updates
- id: immut-past-rewritten
  front: "How does mutation rewrite the past?"
  back: "Earlier renders' closures, logged objects and any undo history share the mutated object. Strict Mode's double calls also repeat mutations inside updaters and reducers."
  question: react/state/immutable-updates
- id: immut-objects-spread
  front: "How do you update a nested object immutably?"
  back: "Spread copies one level, so copy each level on the path: `{ ...person, address: { ...person.address, city } }`."
  question: react/state/immutable-updates
- id: immut-arrays
  front: "Which array operations are safe on state, and which should you avoid?"
  back: "Add with `[...items, item]`, remove with `filter`, replace with `map`, insert with `toSpliced` or slices, sort with `toSorted` or a copy. Avoid `push`, `splice`, `sort`, `reverse` and index assignment on the state array."
  question: react/state/immutable-updates
- id: immut-object-in-array
  front: "How do you mark one object in a state array as done?"
  back: "`items.map(i => i.id === id ? { ...i, done: true } : i)`."
  question: react/state/immutable-updates
- id: immut-local-mutation
  front: "Is mutating a copy created in the same handler allowed?"
  back: "Yes: `const next = [...items]; next.push(item); setItems(next)` never touches the state."
  question: react/state/immutable-updates
- id: immut-deep-nesting
  front: "What can you do when state nesting gets deep?"
  back: "Flatten the state, or use Immer, which lets you write mutating code against a draft and produces the copies for you."
  question: react/state/immutable-updates
- id: immut-example-click-sequence
  front: "In the TodoList example, what happens on \"Done\" (which mutates and sets the same array) and then on \"Show done\"?"
  back: "\"Done\" logs nothing and the paragraph still says \"Milk: to do\". \"Show done\" renders `true` and the paragraph then says \"Milk: done\". Chrome 156 and Firefox 159, development and production builds of React 19.3.1, no Strict Mode."
  question: react/state/immutable-updates
- id: immut-shallow-copy-pitfall
  front: "What goes wrong when you copy only the top level and mutate a nested object through the copy?"
  back: "The parent re-renders, but anything that compares the nested reference misses the change."
  question: react/state/immutable-updates
- id: immut-sort-in-place
  front: "Why is `setItems(items.sort())` wrong?"
  back: "`items.sort()` mutates the state array even when you pass the result to the setter. Use `toSorted()` or sort a copy."
  question: react/state/immutable-updates
- id: immut-strict-updater-push
  front: "What happened with a `push` inside an updater in Strict Mode development?"
  back: "It ran twice and took a list from 2 items to 4."
  question: react/state/immutable-updates
- id: immut-deep-clone
  front: "Why not deep-clone the whole state \"to be safe\"?"
  back: "Every object gets a new identity, so every memoized child and effect sees a change."
  question: react/state/immutable-updates
- id: immut-copy-cost
  front: "Isn't copying slow?"
  back: "Spread copies one level, so an update costs the objects on the changed path, not the whole state; unchanged branches are reused by reference, which also keeps `Object.is` checks cheap. Huge nested structures are a reason to flatten state."
  question: react/state/immutable-updates
- id: immut-mutation-sometimes-shows
  front: "Why does a mutation sometimes show up and sometimes not?"
  back: "It shows wherever a component happens to render and read the mutated object. A plain child of a re-rendering parent shows it; a `memo` child receiving the same object reference skips rendering and keeps the old output."
  question: react/state/immutable-updates
- id: immut-no-deep-compare
  front: "Why does React not deep-compare state?"
  back: "A deep comparison costs time proportional to the whole structure on every update. With immutable updates `prev === next` already proves nothing inside changed, so one reference check suffices and React needs no proxies or property tracking."
  question: react/state/immutable-updates
- id: immut-half-copied
  front: "A `memo` `Address` child gets `person.address`; `moveToOslo` does `const next = { ...person }; next.address.city = 'Oslo'; setPerson(next)`. What shows after the click?"
  back: "The heading says `Oslo`, the `Address` paragraph still says `Lima`: `next` is new so `Profile` re-renders, but `next.address` is the same mutated object, so `memo` skips `Address`. Copy the nested level too."
  question: react/state/immutable-updates

- id: struct-two-decisions
  front: "What are the two decisions in structuring state?"
  back: "Where each piece of state lives, and whether it should be state at all."
  question: react/state/structuring-state
- id: struct-lift-up
  front: "Where should state live, and what does \"lift it up\" mean?"
  back: "In the closest common parent of every component that reads or changes it. When two siblings need the same value, move it into their parent and pass down the value plus a callback to change it, so each piece of state has one owner."
  question: react/state/structuring-state
- id: struct-dont-lift-too-high
  front: "Why not lift state higher than needed?"
  back: "An update re-renders the owner's whole subtree, and unrelated components become coupled to one owner. Values many distant components need can go through context; shared stores outside React are read with `useSyncExternalStore`."
  question: react/state/structuring-state
- id: struct-derive-dont-store
  front: "What should you do with a value that can be calculated from props or other state?"
  back: "Compute it during render (`useMemo` only if slow). Do not sync it with an effect."
  question: react/state/structuring-state
- id: struct-prop-copy
  front: "What does `useState(props.color)` do when the prop later changes?"
  back: "It uses the prop only as the initial value and ignores later changes. Read the prop directly, name it `initialColor` if only the first value matters, or reset with a `key` to start over when an identity changes."
  question: react/state/structuring-state
- id: struct-selected-id
  front: "How should you store a selected item from a list?"
  back: "Store `selectedId`, not a copy of the selected object, and find the object during render."
  question: react/state/structuring-state
- id: struct-contradicting-values
  front: "How do you avoid state values that can contradict each other, such as `isSending` and `isSent`?"
  back: "Replace them with one `status: 'typing' | 'sending' | 'sent'`."
  question: react/state/structuring-state
- id: struct-group-and-flatten
  front: "What do you do with values that always change together, and with deeply nested state?"
  back: "Group the values into one object or a reducer. Flatten deep nesting into objects keyed by id."
  question: react/state/structuring-state
- id: struct-aim
  front: "What is the aim of good state structure?"
  back: "A structure where invalid combinations cannot be represented and every change is made in exactly one place."
  question: react/state/structuring-state
- id: struct-greeting-example
  front: "In the Greeting example, `useState(name)` and `name.toUpperCase()`: what renders after name changes from Ana to Bo?"
  back: "`render Ana BO`. `useState` ignores its argument after the first render, so `label` kept `Ana`, while the derived `shout` was right without extra code. Chrome 156 and Firefox 159, development and production builds of React 19.3.1, no Strict Mode."
  question: react/state/structuring-state
- id: struct-effect-sync-extra-render
  front: "What is the cost of `useEffect(() => setFullName(first + ' Lee'), [first])`?"
  back: "After a change the component rendered once with `Bo | Ana Lee`, then again with `Bo | Bo Lee`: an extra render that shows inconsistent values."
  question: react/state/structuring-state
- id: struct-stale-selected-copy
  front: "Why does storing the selected object next to the list it came from go stale?"
  back: "Edits to the list create new objects that never reach the copy; the paragraph kept showing `pretzels` after the rename. Store `selectedId` and derive the object with `items.find(...)` during render."
  question: react/state/structuring-state
- id: struct-adjust-on-prop-change
  front: "How do you adjust state when a prop changes, without an effect?"
  back: "First try deriving it instead. To reset all of a component's state, give it a `key` from the prop. For the rare partial adjustment, keep the previous prop in state and call the setter during render when it differs; React re-renders immediately, before the children."
  question: react/state/structuring-state
- id: struct-controlled
  front: "After lifting state up, what makes a child \"controlled\"?"
  back: "Its important information comes from props rather than its own state, so the parent decides what it shows. An uncontrolled component keeps that state locally: simpler to use, harder to coordinate."
  question: react/state/structuring-state
- id: struct-derive-cost
  front: "Isn't calculating in every render wasteful compared to storing it?"
  back: "Usually not: string joins and filters over small lists are cheap, and storing means keeping copies in sync. When profiling shows a slow calculation, wrap it in `useMemo`."
  question: react/state/structuring-state
- id: struct-other-state-kinds
  front: "Which kinds of state have their own tools rather than plain component state?"
  back: "Server data, URL state and form libraries."
  question: react/state/structuring-state

# 03 Effects
- id: efftime-purpose
  front: "What is an effect for, and where do interaction-caused logic and computed values belong instead?"
  back: "Keeping the component synchronized with an external system while it is on screen (a chat connection, a browser event subscription, a non-React widget, `document.title`). Logic caused by one interaction belongs in its event handler; values computed from props and state belong in render."
  question: react/effects/effect-timing
- id: efftime-when-runs
  front: "When does `useEffect` run relative to render, commit and layout effects, and what does it see?"
  back: "Never during rendering. React renders, commits the DOM, runs layout effects, then `useEffect` setups, children before parents. The effect sees the committed DOM and the props and state of the render that created it."
  question: react/effects/effect-timing
- id: efftime-non-discrete
  front: "When is a `useEffect` flushed after a non-discrete update (initial `root.render`, a timer, a network response)?"
  back: "React schedules effects in a separate task, so the browser can paint between the commit and the effect: the documented \"usually after paint\"."
  question: react/effects/effect-timing
- id: efftime-discrete
  front: "When do effects run after a discrete input such as a click or key press?"
  back: "At the end of the same task, before paint, so their result is observable straight away. `flushSync`, or a layout effect that sets state, also flush pending effects synchronously."
  question: react/effects/effect-timing
- id: efftime-after-paint-tendency
  front: "Is \"effects run after paint\" a guarantee?"
  back: "No, it is a tendency. Visual work that must not flicker goes in `useLayoutEffect`."
  question: react/effects/effect-timing
- id: efftime-deps-frequency
  front: "How often does an effect run with no array, with `[]`, and with `[a, b]`?"
  back: "No array: after every commit. `[]`: only after mount. `[a, b]`: after commits where `a` or `b` changed by `Object.is`. Before re-running, React calls the previous cleanup."
  question: react/effects/effect-timing
- id: efftime-not-lifecycle
  front: "Should you read an effect as a lifecycle method, and where do effects not run?"
  back: "No: read it as \"keep this in sync with these values\", not \"run on mount\"; Strict Mode tests that in development with an extra setup and cleanup. Effects never run during server rendering, so they are the place for browser-only APIs."
  question: react/effects/effect-timing
- id: efftime-example-order
  front: "In the Inbox example, what order do render, layout effect, its microtask and the effect run on mount, and does a re-render with the same `unread` run the effect?"
  back: "Render, layout effect, microtask, then effect: the effect ran in a later task. A re-render with the same `unread` skips the effect. Same in Chrome 156 and Firefox 159, development and production builds of React 19.3.1, no Strict Mode."
  question: react/effects/effect-timing
- id: efftime-empty-deps-stale
  front: "What goes wrong when `[]` is read as \"on mount\" while the effect uses props?"
  back: "The effect keeps the first render's values forever. List every value it reads."
  question: react/effects/effect-timing
- id: efftime-ssr-window
  front: "Why is touching `window` or `document` during render \"because effects don't run on the server\" wrong?"
  back: "Render runs on the server too. Browser-only code goes in the effect."
  question: react/effects/effect-timing
- id: efftime-order-tree
  front: "In what order do effects run across a tree?"
  back: "Children before parents, siblings in order. A parent's effect can rely on its children's effects having already run."
  question: react/effects/effect-timing
- id: efftime-no-dom-change
  front: "Does an effect run when the render produced no DOM change?"
  back: "Yes, if its dependencies changed: effects follow dependencies, not DOM output. A component that did not render at all runs no effects."
  question: react/effects/effect-timing
- id: efftime-not-in-body
  front: "Why not put the side effect in the component body?"
  back: "Render must be pure: React can call it twice, discard it, or run it on the server. An effect runs only after a committed render, once per commit."
  question: react/effects/effect-timing
- id: efftime-passive-flag
  front: "How does React 19.3.1 mark and flush passive effects (implementation detail)?"
  back: "`useEffect` flags the effect passive when its dependencies changed; passive effects are outside the synchronous commit passes. At the end of commit: if the committed lanes include the sync lane (discrete events, `flushSync`), React calls `flushPendingEffects()` \"so that the result is immediately observable\"; otherwise it schedules `flushPassiveEffects` as a normal-priority Scheduler task."
  question: react/effects/effect-timing
- id: efftime-flush-order
  front: "How does `flushPassiveEffects` order cleanups and setups, and what happens to pending effects before another commit?"
  back: "It runs every pending cleanup in the tree first, then every setup. Before React commits another update it flushes any effects still pending from the previous commit, so they never pile up or run out of order."
  question: react/effects/effect-timing
- id: efftime-layout-sets-state
  front: "When a layout effect sets state, what happens to pending `useEffect` callbacks?"
  back: "React finishes them first, synchronously: both effects logged before the first microtask. This is what the `useLayoutEffect` caveats describe. Chrome 156 and Firefox 159, development and production builds."
  question: react/effects/effect-timing
- id: efftime-raf-race
  front: "How reliable is \"usually after paint\" in the separate-task case?"
  back: "It is a race. A `requestAnimationFrame` registered in a layout effect ran before the effect in 10 of 10 headless Firefox 159 runs (both builds), but in only 2 of 10 headless Chrome 156 runs (development build; 0 of 10 in production)."
  question: react/effects/effect-timing
- id: efftime-alert
  front: "Why can an `alert()` in an effect from a discrete event block the screen?"
  back: "Such effects may run before paint, so the alert can appear before the update shows. Defer it with `setTimeout`."
  question: react/effects/effect-timing
- id: efftime-render-to-string
  front: "Do effects run in `renderToString`?"
  back: "No effect of any kind ran and no warning printed (Node 24, React 19.3.1)."
  question: react/effects/effect-timing
- id: efftime-title-vs-buy
  front: "Which is an effect: setting `document.title` or sending an order on \"Buy\"?"
  back: "`document.title` and page-view reporting synchronize the outside world with what is on screen. Sending the order belongs to the click; in an effect it would rerun on remount and be sent twice in development."
  question: react/effects/effect-timing
- id: efftime-tradeoff
  front: "What does deferring effects trade?"
  back: "A short commit, so the browser can show the new screen sooner, against a possible frame without the effect applied, which for visual corrections is a flicker (use `useLayoutEffect`). Synchronous effects after discrete events trade paint latency for predictability."
  question: react/effects/effect-timing

- id: effdeps-reactive-values
  front: "What does the dependency array list?"
  back: "Every reactive value the effect reads: props, state and anything declared in the component body, functions included. It is not a \"when to run\" switch; it describes the code."
  question: react/effects/effect-dependencies
- id: effdeps-three-forms
  front: "What do no array, `[]` and `[a, b]` mean for dependencies?"
  back: "No array: runs after every commit. `[]`: reads nothing reactive, runs after mount only. `[a, b]`: React compares each item with the previous render's using `Object.is` and re-runs if any differs."
  question: react/effects/effect-dependencies
- id: effdeps-new-each-render
  front: "Why do objects and functions created during render always trigger the effect?"
  back: "They are new every render, so `Object.is` always sees a difference."
  question: react/effects/effect-dependencies
- id: effdeps-stale-closure
  front: "What is a stale closure in an effect?"
  back: "Every render creates a new effect function closed over that render's values. When dependencies are unchanged React does not run the new effect, so what the old one set up keeps running with the values it saw: omit `count` from an interval effect and it reads the first render's `count` forever."
  question: react/effects/effect-dependencies
- id: effdeps-dont-silence-lint
  front: "How should you respond to a `react-hooks/exhaustive-deps` warning?"
  back: "Do not silence it; change the code so it no longer needs the value."
  question: react/effects/effect-dependencies
- id: effdeps-fix-list-it
  front: "What is the usual fix for a missing dependency?"
  back: "List it, when the effect should re-sync when the value changes."
  question: react/effects/effect-dependencies
- id: effdeps-fix-updater
  front: "What do you do if a value is only used to compute the next state?"
  back: "Use an updater, `setCount(c => c + 1)`. The effect no longer reads `count`."
  question: react/effects/effect-dependencies
- id: effdeps-fix-object
  front: "How do you handle an object or function made during render as a dependency?"
  back: "Create it inside the effect, depend on its primitive parts, or move static ones out of the component. `useMemo`/`useCallback` work but move the problem to their own dependencies."
  question: react/effects/effect-dependencies
- id: effdeps-fix-effect-event
  front: "What if the effect needs the latest value without re-syncing on it?"
  back: "Read it in an Effect Event, `useEffectEvent` (for example a theme in a \"connected\" notification)."
  question: react/effects/effect-dependencies
- id: effdeps-stable-identities
  front: "Which values can be omitted from dependencies, and when?"
  back: "`useRef` objects and `useState` setters have stable identities, so they can be omitted; the linter knows that when it can see where they come from. A ref passed as a prop must be listed."
  question: react/effects/effect-dependencies
- id: effdeps-ref-current
  front: "Should `ref.current` be a dependency?"
  back: "No. Mutating it does not re-render, so React never compares a new value. The linter warns that mutable values like `ref.current` are not valid dependencies."
  question: react/effects/effect-dependencies
- id: effdeps-ticker-example
  front: "A `StaleTicker` calls `setCount(count + 1)` every 100ms with `[]`, and a `Ticker` uses `setCount(c => c + 1)`. What do they show after 550ms?"
  back: "Stale: `1`; fresh: `5`. The stale interval sets `0 + 1` every tick, and after the first React bails out because the state is already `1`. 10 of 10 runs each in Chrome 156 and Firefox 159, development and production builds of React 19.3.1."
  question: react/effects/effect-dependencies
- id: effdeps-suppress-comment
  front: "Why is `// eslint-disable-next-line` on the dependency rule risky?"
  back: "The bug may not exist yet, but the next edit to the effect will not be checked."
  question: react/effects/effect-dependencies
- id: effdeps-object-loop
  front: "What happens when an object or function created in render is a dependency?"
  back: "The effect re-runs every render, and loops forever if it also sets state."
  question: react/effects/effect-dependencies
- id: effdeps-no-deep-compare
  front: "Does the dependency comparison go deep?"
  back: "No. `{ id: 1 }` and `{ id: 1 }` differ under `Object.is`; `NaN` and `NaN` do not. Also `0` to `-0` does re-run the effect (confirmed in the test)."
  question: react/effects/effect-dependencies
- id: effdeps-updater-two-values
  front: "Does an updater work when the effect needs two state values?"
  back: "Only for computing one state from its own previous value. When the next state depends on several values, move the logic into a reducer with `useReducer` and dispatch an action; `dispatch` is stable too."
  question: react/effects/effect-dependencies
- id: effdeps-impl-compare
  front: "How does React 19.3.1 compare dependencies (implementation detail)?"
  back: "`updateEffectImpl` compares the arrays in `areHookInputsEqual`, a loop of `Object.is`. If all match, the new effect is stored without the `HasEffect` flag, so the commit skips it and the last run's cleanup stays. If any differs, the commit runs the old cleanup, then the new setup. Without an array, `deps` is `null` and nothing is compared."
  question: react/effects/effect-dependencies
- id: effdeps-size-change-warning
  front: "What does a development build log if the dependency array length changes between renders?"
  back: "\"The final argument passed to useEffect changed size between renders\"."
  question: react/effects/effect-dependencies
- id: effdeps-stale-not-cache
  front: "Is \"stale\" a React cache?"
  back: "No. The interval callback is still the function created by the first render's effect, and closures keep the bindings they were created with. React has a newer effect function each render; it just never runs it."
  question: react/effects/effect-dependencies
- id: effdeps-chatroom-options
  front: "In ChatRoom, `options` is built in render and listed as a dependency. What happens over three renders with the same `roomId`?"
  back: "Connect, disconnect, connect, disconnect, connect: it reconnects every render (production build, Chrome 156 and Firefox 159). Creating the object inside the effect with `[roomId]` connected once. The linter says to move the object inside the effect callback."
  question: react/effects/effect-dependencies
- id: effdeps-filters-scenario
  front: "A dashboard fetches with `[filters]` where the parent builds `filters` as an object literal. What is the fix?"
  back: "Depend on the primitives, `[filters.status, filters.page]`, and build the request inside the effect, or have the parent memoize the object. Removing `filters` from the array stops the refetching and also stops refetching when filters really change."
  question: react/effects/effect-dependencies
- id: effdeps-tradeoff-lint-rules
  front: "What does the `recommended` preset of eslint-plugin-react-hooks 7.1.1 add besides `exhaustive-deps`?"
  back: "Compiler-based rules such as `react-hooks/set-state-in-effect`, which flags calling a setter synchronously in an effect body."
  question: react/effects/effect-dependencies

- id: effclean-why-twice
  front: "Why does Strict Mode run an effect's setup, cleanup, setup in development?"
  back: "React may unmount and remount a component without the user noticing (navigating away and back, `<Activity>` hiding a tree, saving the file in development), and an effect with no teardown leaks a connection, listener or timer each time. State is kept, so only effects (and, since React 19, ref callbacks) repeat. Production builds run setup once."
  question: react/effects/effect-cleanup
- id: effclean-right-question
  front: "What is the right question about the Strict Mode double run?"
  back: "Not \"how do I run it once?\" but \"does my effect survive a remount?\" A user should not be able to tell one setup from setup, cleanup, setup."
  question: react/effects/effect-cleanup
- id: effclean-what-it-does
  front: "What should a cleanup function do, and when does React call it?"
  back: "Stop or undo the setup: disconnect, remove the listener, clear the interval, destroy the widget, ignore or abort the request. React calls it before re-running the effect because a dependency changed (the closure from the previous render, so it sees the previous values) and once on unmount."
  question: react/effects/effect-cleanup
- id: effclean-cleanups-before-setups
  front: "Within one commit, how do pending cleanups and new setups order?"
  back: "React runs every pending cleanup in the tree before any new setup."
  question: react/effects/effect-cleanup
- id: effclean-fetch-race
  front: "What is the data-fetching race in an effect?"
  back: "When `query` changes from `r` to `re`, two requests are in flight and the older may answer last; without cleanup its `setResults` overwrites the newer result. Set an `ignore` flag in cleanup, or abort with an `AbortController`, so only the latest effect's response is applied."
  question: react/effects/effect-cleanup
- id: effclean-no-hasrun-ref
  front: "Why is a `hasRun` ref or module flag the wrong way to stop the double run?"
  back: "It hides the missing cleanup in development, and the leak still happens on real remounts. Work that must happen once per page load belongs outside components, at module level."
  question: react/effects/effect-cleanup
- id: effclean-search-example
  front: "In the SearchResults example under Strict Mode (query `r` answers in 300ms, `re` in 100ms), what ends on screen, and what without the ignore check?"
  back: "`results for \"re\"`: Strict Mode fetched `r` twice and the first effect was cleaned up immediately; both `r` responses were ignored. Without `if (!ignore)` the screen ended on `results for \"r\"`. Development build of React 19.3.1, Chrome 156 and Firefox 159; the production build logs one `r` line."
  question: react/effects/effect-cleanup
- id: effclean-mirror-setup
  front: "What is a common mistake in cleanup that does not mirror setup?"
  back: "Removing a listener with a different function than the one added, or clearing a different timer."
  question: react/effects/effect-cleanup
- id: effclean-previous-closure
  front: "Does cleanup read the new props?"
  back: "No. It is the previous render's closure, which lets it disconnect from the old room."
  question: react/effects/effect-cleanup
- id: effclean-dev-fetch-twice
  front: "Is \"fetched twice in development\" a production problem?"
  back: "No. It is one extra request in development; fix it with cleanup or a caching layer."
  question: react/effects/effect-cleanup
- id: effclean-ignore-vs-abort
  front: "How do an ignore flag and `AbortController` differ?"
  back: "An ignore flag lets the request finish and drops its result. `controller.abort()` in cleanup cancels the request; `fetch` then rejects with an `AbortError`, which you must catch. Abort also frees the network."
  question: react/effects/effect-cleanup
- id: effclean-partial-strictmode
  front: "Does wrapping only part of the app in `<StrictMode>` double its effects on the initial mount?"
  back: "Not on the initial mount: React only does what can happen in production, and a child cannot remount without its parent. Components mounted inside it later do get the extra cycle."
  question: react/effects/effect-cleanup
- id: effclean-layout-insertion-doubled
  front: "Are layout effects and insertion effects doubled by Strict Mode?"
  back: "Layout effects yes, in the same cycle. `useInsertionEffect` did not repeat in the test (React 19.3.1)."
  question: react/effects/effect-cleanup
- id: effclean-impl-double-invoke
  front: "How does React 19.3.1's development build double-invoke effects (implementation detail)?"
  back: "After the first commit of a tree inside `<StrictMode>` it walks the newly mounted fibers and, for each, disconnects its layout effects, refs and passive effects, then reconnects them (`doubleInvokeEffectsOnFiber`). Nothing re-renders, so state and DOM survive."
  question: react/effects/effect-cleanup
- id: effclean-strict-sequence
  front: "For a component with a layout effect, an effect and a ref callback, what is the development Strict Mode order?"
  back: "First mount: ref callback, layout effect, effect. Simulated unmount: layout cleanup, ref cleanup, effect cleanup. Simulated mount: ref callback, layout effect, effect. Chrome 156 and Firefox 159."
  question: react/effects/effect-cleanup
- id: effclean-update-two-passes
  front: "On a normal update, in which order do passive cleanups and setups run for Parent with children A and B?"
  back: "Two passes over the whole tree: every cleanup (A, B, Parent, carrying the old `v=1`), then every setup (A, B, Parent, `v=2`). The cleanups are the functions the previous render's effects returned. Same in both browsers and builds."
  question: react/effects/effect-cleanup
- id: effclean-unmount-order
  front: "In what order do cleanups run when the whole tree unmounts, and can you depend on it?"
  back: "Observed: `cleanup Parent` before `cleanup A`, also in Strict Mode's simulated unmount; updates ran children's cleanups first. These orders are observations, not documented guarantees, so do not let cleanups depend on each other."
  question: react/effects/effect-cleanup
- id: effclean-abort-strict
  front: "What happens with `AbortController` in Strict Mode when the query then changes?"
  back: "The first `r` request was aborted by the simulated unmount and the second by the query change: two `AbortError` rejections, and the server saw both requests closed early."
  question: react/effects/effect-cleanup
- id: effclean-analytics-twice
  front: "Should you disable Strict Mode because an analytics page view is sent twice in development?"
  back: "No. It is development only and acceptable."
  question: react/effects/effect-cleanup
- id: effclean-chat-scenario
  front: "A chat effect has no disconnect cleanup. How does the bug show in development versus production?"
  back: "Development shows two \"Connecting…\" logs. In production it appears only after the user goes to Settings and back, and two connections receive every message. `() => connection.disconnect()` fixes both."
  question: react/effects/effect-cleanup
- id: effclean-tradeoff
  front: "What does the double cycle cost and buy, and what avoids fetch-in-effect problems?"
  back: "It costs development time (duplicate requests, louder logs) but makes missing cleanup fail on the first mount instead of after an untested navigation pattern. Fetching in effects leaves caching, deduplication and races to you; a framework's data layer, or a cached promise read with `use`, avoids most of it."
  question: react/effects/effect-cleanup

- id: efflayout-same-api
  front: "How do `useLayoutEffect` and `useEffect` differ?"
  back: "Only in timing; they take the same arguments and follow the same dependency and cleanup rules."
  question: react/effects/layout-effects
- id: efflayout-timing
  front: "When does `useLayoutEffect` run, and what happens to state updates it schedules?"
  back: "Inside the commit: after React has changed the DOM and attached refs, before the browser can paint. Updates it schedules are rendered and committed synchronously, still before paint, and React runs pending `useEffect` callbacks first. The user only sees the final result."
  question: react/effects/layout-effects
- id: efflayout-useeffect-flicker
  front: "Why can `useEffect` cause a flicker?"
  back: "It usually runs in a later task and the browser may paint in between; if the effect corrects something visible, that painted frame is the flicker."
  question: react/effects/layout-effects
- id: efflayout-use-cases
  front: "When should you use `useLayoutEffect`?"
  back: "When you must read layout and render based on it before the user sees anything: measure a tooltip or popover and place it above or below its anchor; restore or adjust a scroll position after new content renders; synchronise DOM state that must never be shown half-done."
  question: react/effects/layout-effects
- id: efflayout-cost
  front: "What is the cost of `useLayoutEffect`?"
  back: "The browser cannot paint until the layout effect and its updates finish, so slow work delays every frame of that update. Measuring also forces the browser to compute style and layout synchronously. Prefer `useEffect`; switch only for a visible flicker."
  question: react/effects/layout-effects
- id: efflayout-server
  front: "What happens with `useLayoutEffect` on the server in React 19?"
  back: "Neither hook runs on the server, and React 19 removed the old server warning. The problem remains: server HTML cannot contain the measured result, so it jumps after hydration. Render such components only on the client, or accept `useEffect`."
  question: react/effects/layout-effects
- id: efflayout-insertion-effect
  front: "What is `useInsertionEffect` for and what are its limits?"
  back: "It runs before any layout effect, for CSS-in-JS libraries that inject `<style>` tags at runtime so styles are in place before layout effects read layout. Refs are not attached yet, it cannot schedule updates, and it may run before or after the DOM is updated. Application code should not need it."
  question: react/effects/layout-effects
- id: efflayout-tooltip-example
  front: "In the Tooltip example, what is logged and what does the next frame show, with `useLayoutEffect` and with `useEffect`?"
  back: "Render `top = 100`, render `top = 60`, next frame shows `60px`, in 10 of 10 headless runs each in Chrome 156 and Firefox 159, development and production builds of React 19.3.1. With `useEffect` the next frame showed `top = 100px` first in 3 of 10 Chrome runs (both builds) and 0 of 10 Firefox runs: a race."
  question: react/effects/layout-effects
- id: efflayout-not-default
  front: "Why not make `useLayoutEffect` the default \"to be safe\"?"
  back: "It delays paint for every update that triggers it."
  question: react/effects/layout-effects
- id: efflayout-test-fast-machine
  front: "Why is testing a measuring `useEffect` on a fast machine misleading?"
  back: "Whether the wrong frame shows depends on frame timing."
  question: react/effects/layout-effects
- id: efflayout-read-then-write
  front: "How should you order reads and writes in a layout effect?"
  back: "Read first, then write. Alternating style writes and geometry reads forces another synchronous layout on each read."
  question: react/effects/layout-effects
- id: efflayout-ssr-fix
  front: "Does a layout effect fix content before display in a server-rendered component?"
  back: "No. The server HTML shows the unmeasured state until the client runs it."
  question: react/effects/layout-effects
- id: efflayout-ref-current
  front: "Is `ref.current` set inside `useLayoutEffect` and `useInsertionEffect`?"
  back: "Inside `useLayoutEffect` yes: React attaches refs in the same commit phase before layout effects run. In `useInsertionEffect`, `ref.current` was still `null` on mount."
  question: react/effects/layout-effects
- id: efflayout-insertion-sets-state
  front: "What happens if `useInsertionEffect` sets state?"
  back: "It is unsupported. React 19.3.1's development build logged \"useInsertionEffect must not schedule updates.\" Do not rely on what happens next."
  question: react/effects/layout-effects
- id: efflayout-server-warning-removed
  front: "Does `renderToString` still warn about `useLayoutEffect`?"
  back: "No. React 19.0's changelog lists \"Remove layout effect warning on server\". In Node 24 with React 19.3.1, rendering a component with all three effect hooks printed nothing and ran none of them."
  question: react/effects/layout-effects
- id: efflayout-insertion-cleanup
  front: "How do insertion effects clean up compared with other effects?"
  back: "One component at a time: cleanup then setup per component, interleaved. Other effect types run every cleanup in the tree before any setup."
  question: react/effects/layout-effects

- id: noeffect-purpose
  front: "What are effects for, and when is an effect usually in the wrong place?"
  back: "Synchronizing with an external system: the network, a browser API, a non-React widget. When an effect only reads React state and sets other React state, it is usually in the wrong place."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-derived
  front: "What goes wrong when a derived value is computed in an effect and stored in state?"
  back: "It renders once with the stale value, commits, then renders again. Compute it during render; wrap an expensive calculation in `useMemo`."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-reset-key
  front: "How do you reset state when a prop changes, instead of `useEffect(() => setComment(''), [userId])`?"
  back: "Render the component with `key={userId}` so React gives it fresh state. To adjust only part of the state, store an id and derive the rest."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-event-logic
  front: "Where does event-specific logic, such as a POST on submit or a toast after \"Buy\", belong?"
  back: "In the handler, because a click is its cause. In an effect it also fires on remount, and twice in development."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-chains
  front: "What is wrong with chains of effects that set state to trigger other effects?"
  back: "They re-render the tree once per link. Compute all the next state in the handler and derive what you can."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-notify-parent
  front: "Why is calling a parent's `onChange` from an effect worse than calling it in the handler?"
  back: "The effect runs after the child already committed, so the parent renders in a second pass. Call it in the same handler as the child's own `setState`; React batches both. Or lift the state up."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-init-once
  front: "Where does initialization once per app load belong?"
  back: "At module level, not in an effect."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-external-store
  front: "What replaces an effect that copies an external store's values into state?"
  back: "`useSyncExternalStore`."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-fetch-fine
  front: "Can data fetching be an effect?"
  back: "Yes, it is synchronization, with cleanup for races. Frameworks and caching libraries, or `use` with a cached promise, do it better."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-lint-rule
  front: "Which rule flags the most common wrong effect in eslint-plugin-react-hooks 7?"
  back: "The recommended `react-hooks/set-state-in-effect`, which flags a setter called synchronously in an effect body."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-todos-example
  front: "In the Todos example, what is logged when an effect-derived list and a render-derived list mount?"
  back: "`with effect: 0 open`, `derived: 2 open`, then `with effect: 2 open`: the effect version committed \"0 open\" to the DOM first, then rendered again. Chrome 156 and Firefox 159, development and production builds of React 19.3.1, no Strict Mode."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-copy-prop
  front: "Why is copying a prop into state with an effect a mistake?"
  back: "It is always one render behind. Read the prop."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-submitted-flag
  front: "What goes wrong sending a request from an effect that watches a `submitted` flag?"
  back: "Strict Mode sends it twice in development, and a remount re-sends it."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-key-vs-effect-reset
  front: "Why is resetting state with an effect worse than a `key`?"
  back: "The subtree renders with stale state first, and nested state is not reset."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-setstate-ok
  front: "When is `setState` in an effect fine?"
  back: "When the value comes from outside React: a DOM measurement in a layout effect, a subscription callback, a fetch response. The `set-state-in-effect` docs accept a value read from a ref; only synchronous calls in the effect body are flagged."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-event-vs-effect
  front: "How do you tell an event from an effect?"
  back: "Say why the code should run. \"The user clicked Buy\" names an interaction: handler. \"The chat is visible, so stay connected\" names a state of the screen: effect. A notification shown after connecting is an event fired from an effect: an Effect Event."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-compute-slower
  front: "Is computing during render slower than caching in state?"
  back: "Usually not: the effect version computes it too, then renders twice. If the calculation is expensive, `useMemo` caches it between renders without an extra pass."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-second-render-steps
  front: "What are the steps of the extra render caused by an effect that sets state, and when can the browser paint?"
  back: "Render with the stale value and commit; run the effect, whose `setState` schedules another update; render the component and its whole subtree again and commit again. After a timer or initial render the browser can paint the stale commit; after a click React flushes the effect before paint, so the cost is the extra render and commit."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-toggle-passes
  front: "In the Toggle example, how many render passes does a click take with `onChange` called from an effect versus from the handler?"
  back: "From an effect: `render Toggle true`, `render Settings true`, `render Toggle true` (three). From the handler next to `setIsOn`: `render Settings true`, `render Toggle true`, one pass, because React batched both updates. Chrome 156 and Firefox 159, development and production builds, trusted clicks."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-adjust-during-render
  front: "How can you adjust state during render when it must change with a prop?"
  back: "Store the previous prop and call the setter during render: `if (items !== prevItems) { setPrevItems(items); setSelection(null); }`. React re-renders that component immediately, before its children or the DOM see the stale value. Prefer deriving: store `selectedId` and compute the selection."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-key-remount-cost
  front: "What does resetting with `key` cost?"
  back: "A changed key remounts the subtree: state, DOM and effects start over. That is a feature for \"different entity\" and a cost for large trees."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-once-per-app
  front: "How do you run something once per app, not per component lifecycle?"
  back: "Module-level code runs once per page load, and so does a top-level `didInit` flag checked in an effect. Both are outside the component's lifecycle on purpose."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-toast-scenario
  front: "A toast \"Added to cart\" is shown from an effect watching `product.isInCart`. What goes wrong, and what stays an effect?"
  back: "Reloading the page with the item already in the cart shows the toast again, and so does navigating back. The toast belongs in the \"Add to cart\" handler. A \"page viewed\" analytics call stays an effect: it is caused by the page being displayed."
  question: react/effects/you-might-not-need-an-effect
- id: noeffect-tradeoff
  front: "What does removing unneeded effects give, and what does it cost?"
  back: "One render per update, data that cannot drift out of sync, and code that reads top to bottom. The cost is restructuring: lifting state up, splitting a component to put a `key` on it, writing handlers that compute several values at once. Real synchronization still needs effects."
  question: react/effects/you-might-not-need-an-effect

- id: effev-reactive-vs-event
  front: "How do code in an effect and code in an event handler differ in reactivity?"
  back: "Effect code is reactive: every prop, state or render-scope value it reads is a dependency, and a change re-runs the effect. Handler code is not: it runs when the user acts and reads the latest values."
  question: react/effects/effect-events
- id: effev-theme-problem
  front: "A chat effect keyed on `roomId` shows a notification in the current `theme` on connect. What goes wrong if `theme` is listed, and if it is omitted?"
  back: "Listed: every theme switch disconnects and reconnects. Omitted: `react-hooks/exhaustive-deps` warns, and the notification uses the theme from when the effect ran, a stale closure."
  question: react/effects/effect-events
- id: effev-what-it-does
  front: "What does `useEffectEvent` do, and since which React version is it stable?"
  back: "It wraps event-like logic so that, when called from the effect, it runs the callback from the latest committed render and sees current values without being a dependency. It is stable since React 19.2."
  question: react/effects/effect-events
- id: effev-where-callable
  front: "Where may an Effect Event be called?"
  back: "Only inside `useEffect`, `useLayoutEffect`, `useInsertionEffect`, or another Effect Event in the same component. Not from handlers, not during render (that throws), not passed to children or other hooks. Enforced by eslint-plugin-react-hooks."
  question: react/effects/effect-events
- id: effev-not-dependency
  front: "Should an Effect Event be listed as a dependency, and why is its identity unstable?"
  back: "Never. Its identity changes on every render, deliberately, so misuse shows up as an effect re-running each render. The linter warns that functions returned from `useEffectEvent` must not be in the dependency array."
  question: react/effects/effect-events
- id: effev-only-for-events
  front: "When is `useEffectEvent` the wrong tool?"
  back: "When used only to drop a dependency the effect should react to. It hides bugs: a visit logged without `url` in its dependencies misses page changes. Use it only for logic that really is an event fired by the effect."
  question: react/effects/effect-events
- id: effev-before-it-existed
  front: "What did most code do before `useEffectEvent` existed?"
  back: "Disabled the lint rule and left the value out, as the React 19.2 announcement notes; the linter then stopped checking that effect."
  question: react/effects/effect-events
- id: effev-chatroom-example
  front: "In the ChatRoom example, `theme` changes from light to dark before the connection opens. What is logged with `useEffectEvent`, with `theme` listed, and with `theme` read directly but not listed?"
  back: "Effect Event: `connect general`, `connected, notify in dark`. Listed: connect, disconnect, connect, then `dark`. Not listed: `light`. Chrome 156 and Firefox 159, development and production builds of React 19.3.1, no Strict Mode; ESLint 7.1.1 recommended preset reported nothing for the Effect Event version."
  question: react/effects/effect-events
- id: effev-silence-lint
  front: "Why is using `useEffectEvent` to silence `exhaustive-deps` for a value that should re-sync the effect a mistake?"
  back: "The linter goes quiet and the bug stays."
  question: react/effects/effect-events
- id: effev-pass-to-child
  front: "What does the linter do when an Effect Event is passed to a child or a custom hook?"
  back: "It reports an error. Declare the Effect Event next to the effect that uses it."
  question: react/effects/effect-events
- id: effev-call-in-render
  front: "What happens when an Effect Event is called during render?"
  back: "React throws \"A function wrapped in useEffectEvent can't be called during rendering.\""
  question: react/effects/effect-events
- id: effev-unstable-identity-impl
  front: "How does React 19.3.1 implement the unstable identity of the returned function (implementation detail)?"
  back: "Each render returns a new wrapper that calls a shared, internal ref, updated during the commit; identity checks between renders were `false`. A stable identity would let misuse go unnoticed."
  question: react/effects/effect-events
- id: effev-call-from-handler
  front: "What happens if you call an Effect Event from a click handler?"
  back: "The linter reports it can only be called from Effects and Effect Events in the same component. At runtime in React 19.3.1 a call outside render did not throw, but that is unsupported; use a normal function."
  question: react/effects/effect-events
- id: effev-layout-effect-values
  front: "Which values does an Effect Event see inside a layout effect?"
  back: "The latest committed render's. In the test, a layout effect and an effect both saw the current render's props through it."
  question: react/effects/effect-events
# 04 Refs
- id: ref-vs-state-rule
  front: "What is the rule for choosing between a ref and state?"
  back: "If the value affects the rendered output, it is state. If only event handlers and effects need it, it is a ref."
  question: react/refs/refs-vs-state
- id: ref-vs-state-survive-rerenders
  front: "What do refs and state have in common across re-renders?"
  back: "Both survive re-renders, and each mounted component instance has its own. They differ in what happens when the value changes."
  question: react/refs/refs-vs-state
- id: state-is-snapshot-after-set
  front: "After calling `setCount`, does the `count` your handler can see change?"
  back: "No. State is a snapshot. `setCount` queues a render, and the next call of the component receives the new value."
  question: react/refs/refs-vs-state
- id: use-ref-returns-same-object
  front: "What does `useRef(initial)` return on the first render and on later renders?"
  back: "`{ current: initial }` on the first render, and the same object on every render after."
  question: react/refs/refs-vs-state
- id: ref-assignment-no-rerender
  front: "What happens when you assign `ref.current`?"
  back: "It takes effect immediately. React is not told, and nothing re-renders."
  question: react/refs/refs-vs-state
- id: typical-ref-uses
  front: "Name the typical things to keep in a ref."
  back: "Timeout and interval ids, DOM nodes, instances React does not manage (a map widget, a `WebSocket`, an `AbortController`), and flags a callback checks later without needing a re-render."
  question: react/refs/refs-vs-state
- id: ref-read-render-impure
  front: "Why is reading `ref.current` during render a bug?"
  back: "A component must be a pure function of props, state and context, and `ref.current` is none of those. React does not re-render when it changes, so JSX built from it shows whatever it held the last time something else caused a render."
  question: react/refs/refs-vs-state
- id: ref-write-render-strict-mode
  front: "Why is writing a ref during render worse than reading it?"
  back: "Strict Mode runs the body twice in development, and a render React discards still leaves its write behind."
  question: react/refs/refs-vs-state
- id: react-hooks-refs-lint
  front: "Which lint reports reading or writing refs during render, and what is it built on?"
  back: "`react-hooks/refs`, built on the React Compiler. `eslint-plugin-react-hooks` 7.1.1 reports it as \"Cannot access refs during render\"."
  question: react/refs/refs-vs-state
- id: ref-lazy-init-exception
  front: "What is the one documented exception to not touching a ref during render?"
  back: "Lazy initialisation: `if (ref.current === null) ref.current = new Player()`. It runs once per instance and always gives the same result, so render stays predictable."
  question: react/refs/refs-vs-state
- id: use-ref-arg-ignored-after-mount
  front: "Why does `useRef(new Player())` waste work even though only the first value is kept?"
  back: "The argument is ignored after mount, but `new Player()` is still evaluated on every render and thrown away. Lazy initialisation avoids that."
  question: react/refs/refs-vs-state
- id: ref-escape-hatch
  front: "What does it suggest if much of a component's logic flows through refs?"
  back: "Refs are an escape hatch. That data probably belongs in state."
  question: react/refs/refs-vs-state
- id: ref-let-variable-timer-bug
  front: "Why does keeping a timer id in a plain `let` inside the component break `clearTimeout`?"
  back: "Every render creates a fresh variable, so a later render's `clearTimeout` gets `null`. In the debounce exercise nothing was cleared and every keystroke logged its search."
  question: react/refs/refs-vs-state
- id: ref-has-run-flag-strict-mode
  front: "Why is a \"has run\" ref to stop Strict Mode's second effect run a pitfall?"
  back: "It hides a missing cleanup instead of fixing it."
  question: react/refs/refs-vs-state
- id: ref-latest-value-use-effect-event
  front: "What replaces writing `latestRef.current = value` in the body to read the latest value in an effect?"
  back: "`useEffectEvent`. Writing the ref in the body is a render-time write; `useEffectEvent` covers the latest-props case without the ref."
  question: react/refs/refs-vs-state
- id: use-ref-as-use-state-docs
  front: "How do the React docs describe `useRef` conceptually, and how does React 19.3.1 actually implement it?"
  back: "Docs: `useState({ current: initialValue })` with the setter unused. React 19.3.1 implements it as its own hook that stores the object on mount and returns that stored object on every update."
  question: react/refs/refs-vs-state
- id: dom-ref-null-first-render
  front: "What does a DOM ref hold during the first render, and when does React set it?"
  back: "`null`, because the node does not exist until the commit. React sets `current` in the commit, before layout effects run, and back to `null` when the node is removed. Read it in handlers and effects."
  question: react/refs/refs-vs-state
- id: ref-per-instance-not-shared
  front: "Is a ref shared between instances of a component?"
  back: "No. Each mounted instance gets its own object, and a remount (for example a new `key`) creates a new one. A module-level variable is the shared one, and it survives unmounts too."
  question: react/refs/refs-vs-state
- id: ref-closures-see-latest
  front: "Why can every closure from every render see the latest `current`?"
  back: "On update `useRef` returns the stored object and ignores its argument, so every closure holds the same object. There is no per-render snapshot, which suits a timeout callback but makes a ref unreliable as render input. This is an implementation detail of `ReactFiberHooks.js`."
  question: react/refs/refs-vs-state
- id: ref-render-counter-strict-mode
  front: "In React 19.3.1, what did a render counter kept in a ref (`renders.current += 1`) show under Strict Mode versus production?"
  back: "Development in `<StrictMode>` showed `2` after mount and added 2 per update; production showed `1` and added 1 (Chrome 156 and Firefox 159). Both Strict Mode calls received the same ref object, and the write ran twice."
  question: react/refs/refs-vs-state
- id: ref-strict-mode-docs-vs-observed
  front: "What do the `useRef` docs say about Strict Mode's double render, and what did React 19.3.1 do?"
  back: "The `useRef` reference says each ref is created twice and one discarded. In 19.3.1 both calls received the same ref object. Either way the render-time write ran twice."
  question: react/refs/refs-vs-state
- id: ref-write-discarded-render
  front: "Besides Strict Mode, how can a render-time ref write persist from a render nobody saw?"
  back: "Production can call a component without committing: a transition interrupted by a more urgent update, or a render that suspends. The write stays in the ref even though no user saw that render."
  question: react/refs/refs-vs-state
- id: ref-holds-render-data-mutation
  front: "If a ref holds an object that state or props also use for rendering, is mutating it fine?"
  back: "No. You may mutate `current` freely, but mutating an object that also feeds rendering is still mutating render data. Copy it, or keep it in state."
  question: react/refs/refs-vs-state
- id: ref-reset-on-remount
  front: "When does a ref reset?"
  back: "The object belongs to the mounted instance. Changing the component's `key` or moving it to another place in the tree creates a new instance and a new ref."
  question: react/refs/refs-vs-state
- id: use-previous-ref-problems
  front: "What are the two problems with a `usePrevious` hook built on a ref?"
  back: "It reads the ref during render, and it returns the value from the previous render, not the previous different value. An unrelated re-render (a theme change) makes \"previous\" equal the current price."
  question: react/refs/refs-vs-state
- id: previous-value-state-pattern
  front: "What pattern from the `useState` reference replaces a ref-based `usePrevious`?"
  back: "Store the previous value in state and compare during render: `if (price !== prevPrice)` then `setPrevPrice` and set the trend. It updates only when the price actually changes, so the trend stays \"up\" after a theme re-render."
  question: react/refs/refs-vs-state
- id: ref-module-variable-tradeoff
  front: "When is a module-level variable the right choice instead of a ref?"
  back: "For a true singleton. It is shared by every instance and outlives them, which is wrong for per-component data."
  question: react/refs/refs-vs-state
- id: ref-derived-values-neither
  front: "Do derived values need a ref or state?"
  back: "Neither. Compute them during render from props and state."
  question: react/refs/refs-vs-state
- id: ref-render-text-stale
  front: "What goes wrong when you render `{ref.current}` and expect the screen to follow?"
  back: "It changes only when something else re-renders, and then shows whatever the ref holds at that moment."
  question: react/refs/refs-vs-state
- id: callback-ref-what-and-when
  front: "What is a ref callback and when does React call it with the node?"
  back: "A function passed as `ref`, such as `<input ref={(node) => …} />`. React calls it during the commit, after the node is in the DOM and before layout effects run."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-detach-cleanup
  front: "What does React do on detach if the ref callback returned a function (React 19+)?"
  back: "It calls that cleanup instead of calling the callback again with `null`."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-detach-null
  front: "What does React do on detach if the ref callback returned no function, and what do the docs say about it?"
  back: "It calls the callback again with `null`. The docs say this fallback \"will be removed in a future version\"."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-detach-triggers
  front: "When does a ref callback detach?"
  back: "When the node is removed, or when the callback changes."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-inline-identity
  front: "Why does an inline arrow ref callback detach and reattach on every commit?"
  back: "React compares the `ref` value between renders, and an inline arrow is a new function each render. It detaches the old one and attaches the new one even for the same node."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-cleanup-no-prevent
  front: "Does returning a cleanup stop an inline ref callback from reattaching every render?"
  back: "No. It only replaces the `null` call. A stable function (outside the component, or wrapped in `useCallback`) runs only on mount and unmount."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-detach-before-attach
  front: "In a commit with several ref callbacks changing, what order do detaches and attaches run in (React 19.3.1)?"
  back: "Every detach ran before any attach: React detaches while it mutates the DOM and attaches afterwards (production, and development without Strict Mode)."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-list-map
  front: "How do you hold refs to a list of items with ref callbacks?"
  back: "Hooks cannot run per item, so give each item a callback that stores its node in a `Map` keyed by id and deletes it in the cleanup."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-index-array-bug
  front: "Why is storing nodes by index in a ref array (`nodesByIndex.current[i] = node`) fragile?"
  back: "After removing `a` from `[c, a, b]` to `[c, b]` it held `c`, `b`, `null` with length 3: all three old callbacks were called with `null`, then only two new ones wrote. A `Map` keyed by item with a `delete` cleanup held exactly `c` and `b`."
  question: react/refs/ref-callbacks-and-ref-prop
- id: ref-as-prop-react-19
  front: "What changed in React 19 about `ref` on function components?"
  back: "A function component receives `ref` in its props like any other prop and passes it to the element it exposes: `function MyInput({ ref }) { return <input ref={ref} />; }`. `forwardRef` is not needed."
  question: react/refs/ref-callbacks-and-ref-prop
- id: forward-ref-deprecation
  front: "What do the React 19 post and React 19.3.1 say about `forwardRef`?"
  back: "The post says new components \"will no longer need `forwardRef`\" and that \"In future versions we will deprecate and remove `forwardRef`.\" It still works in 19.3.1 without a warning."
  question: react/refs/ref-callbacks-and-ref-prop
- id: ref-prop-ignored-null
  front: "What happens to a parent's ref if the child component ignores its `ref` prop?"
  back: "`ref.current` stays `null`. The component must pass `ref` on to the element."
  question: react/refs/ref-callbacks-and-ref-prop
- id: class-component-ref-unchanged
  front: "How do refs on class components differ from the React 19 function-component behaviour?"
  back: "Class components are unchanged: `ref` points to the instance and is not in `this.props`. Reading `this.props.ref` gives `undefined`."
  question: react/refs/ref-callbacks-and-ref-prop
- id: element-ref-warns
  front: "What happens when you read `element.ref` on a React 19 element?"
  back: "It warns in development, since `ref` lives in `element.props`."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-strict-mode-extra
  front: "What does Strict Mode add for ref callbacks in development?"
  back: "One extra setup and cleanup on mount."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-typescript-implicit-return
  front: "What does TypeScript do with implicit returns from ref callbacks in React 19?"
  back: "They are type errors, which catches accidents like `ref={(el) => (saved = el)}`."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-side-effect-inline
  front: "What goes wrong with `ref={(node) => node?.focus()}` inline?"
  back: "It runs on every re-render. In the test, focus jumped back to that input after the user had moved to another one."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-null-teardown-with-cleanup
  front: "Why is keeping `if (node === null)` teardown code and also returning a cleanup a mistake?"
  back: "Once a function is returned, React never calls the callback with `null`, so the null branch is dead code."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-vs-effect
  front: "Why use a ref callback instead of a ref object plus `useEffect`?"
  back: "The callback runs exactly when that node attaches and detaches, including a conditionally rendered child the effect knows nothing about. An effect runs when its dependencies change, possibly before the node exists or long after it was replaced."
  question: react/refs/ref-callbacks-and-ref-prop
- id: ref-object-not-reattached
  front: "Is a ref object detached and reattached on every render?"
  back: "No. `useRef` returns the same object each render, so React sees no change. Only a different `ref` value, such as a new callback, triggers detach and attach."
  question: react/refs/ref-callbacks-and-ref-prop
- id: callback-ref-non-function-return
  front: "What does React 19.3.1 do when a ref callback returns something that is not a function?"
  back: "It ignores it as a cleanup and falls back to calling the callback with `null` on detach."
  question: react/refs/ref-callbacks-and-ref-prop
- id: imperative-handle-why
  front: "Why not pass a parent's `ref` straight to your `<input>`?"
  back: "The parent gets the whole DOM node. It can restyle it, read its value, or move it, and every caller now depends on your markup."
  question: react/refs/imperative-handle
- id: imperative-handle-signature
  front: "What are the parameters of `useImperativeHandle`?"
  back: "`useImperativeHandle(ref, createHandle, dependencies?)`: the parent's `ref`, a no-argument function returning the handle, and an optional dependency array."
  question: react/refs/imperative-handle
- id: imperative-handle-private-node
  front: "Where does the child keep the DOM node when using `useImperativeHandle`?"
  back: "In its own private `useRef` attached to the `<input>`. The parent never sees it; it receives the handle object instead."
  question: react/refs/imperative-handle
- id: imperative-handle-ref-prop
  front: "How does the child receive `ref` for `useImperativeHandle` in React 19 versus earlier?"
  back: "Since React 19 it is an ordinary prop. Earlier versions needed `forwardRef`."
  question: react/refs/imperative-handle
- id: imperative-handle-dependencies
  front: "When does React call `createHandle` again?"
  back: "When a dependency changes (by `Object.is`), or on every render if you omit the array. Methods close over the render that created them, so list every value they read."
  question: react/refs/imperative-handle
- id: imperative-handle-timing
  front: "When does React set the imperative handle on `ref.current`?"
  back: "It treats the handle like a layout effect: during the commit, after the child's own DOM refs are attached and before the parent's layout effects run."
  question: react/refs/imperative-handle
- id: imperative-handle-unmount
  front: "What happens to the handle on unmount?"
  back: "React sets the ref back to `null`, or runs the cleanup a ref callback returned."
  question: react/refs/imperative-handle
- id: imperative-handle-when-to-use
  front: "When should you use `useImperativeHandle`?"
  back: "Only for imperative actions that props cannot express: focusing, scrolling, selecting text, starting an animation, calling a third-party widget's method."
  question: react/refs/imperative-handle
- id: imperative-handle-modal-misuse
  front: "What is the React docs' example of misusing `useImperativeHandle`?"
  back: "A `Modal` exposing `{ open, close }`. Take an `isOpen` prop instead."
  question: react/refs/imperative-handle
- id: imperative-handle-expose-minimal
  front: "Why expose only `focus` if the parent only needs to focus a field?"
  back: "It keeps the component free to change its markup later."
  question: react/refs/imperative-handle
- id: imperative-handle-parent-sees-handle
  front: "In the `SearchField` example, what could the parent do with the handle?"
  back: "Call `focus()` and `clear()`. `searchRef.current` was not an `HTMLElement` and `value` was `undefined`, so it could not read `value` or touch the node (React 19.3.1, Chrome 156 and Firefox 159)."
  question: react/refs/imperative-handle
- id: imperative-handle-stale-empty-deps
  front: "What goes wrong with `useImperativeHandle(ref, () => ({ read: () => count }), [])`?"
  back: "The handle is created once, so `read` closes over the first render's `count`. It kept returning `0` after the count became `1`. `react-hooks/exhaustive-deps` warns about the missing `count`; `[count]` rebuilds the handle."
  question: react/refs/imperative-handle
- id: imperative-handle-updater-fine
  front: "Why does `increment: () => setCount((c) => c + 1)` still work with `[]` dependencies?"
  back: "The updater function does not read `count` from the closure."
  question: react/refs/imperative-handle
- id: imperative-handle-omit-deps
  front: "What happens with a parent ref callback when you omit the dependency array?"
  back: "A new handle is created on every render, and the parent ref callback runs with `null`, then the new handle, on each commit."
  question: react/refs/imperative-handle
- id: imperative-handle-state-as-methods
  front: "Why is exposing `open()`, `close()` or `setValue()` as handle methods a pitfall?"
  back: "Those are state transitions, which is data flow. Pass props and let the child render from them."
  question: react/refs/imperative-handle
- id: imperative-handle-call-in-render
  front: "Why can you not call a handle method during the parent's render?"
  back: "On the first render `ref.current` is still `null`. Call it from handlers and effects."
  question: react/refs/imperative-handle
- id: imperative-handle-return-node
  front: "How can the parent get the DOM node while the child keeps its own ref?"
  back: "`useImperativeHandle(ref, () => inputRef.current, [])`. The child's `<input>` ref is attached before the handle is created, so no manual ref merging is needed."
  question: react/refs/imperative-handle
- id: imperative-handle-inline-callback-rerun
  front: "Why did `createHandle` run on every render even with `[]` when the parent passed an inline ref callback?"
  back: "In React 19.3.1 the hook appends `ref` to your dependencies (an implementation detail), so a new callback identity re-runs it. Use a ref object or a stable callback."
  question: react/refs/imperative-handle
- id: imperative-handle-ref-callback-cleanup
  front: "Does a ref callback cleanup work with an imperative handle?"
  back: "Yes. The React 19 post lists `useImperativeHandle` among the places ref cleanups work: React calls the callback with the handle and, on detach, runs the returned cleanup instead of calling it with `null`."
  question: react/refs/imperative-handle
- id: fragment-ref-problem
  front: "What two cases make a single DOM ref awkward, which Fragment refs solve?"
  back: "A component rendering siblings with no common parent, and a child component (often from a library) that does not pass `ref` on. A wrapper `<div>` can break flex, grid or table layout."
  question: react/refs/fragment-refs
- id: fragment-ref-syntax
  front: "How do you put a ref on a Fragment, and why not use `<>`?"
  back: "Pass it to an explicit `<Fragment ref={ref}>`. The `<>` shorthand takes no props."
  question: react/refs/fragment-refs
- id: fragment-ref-stable-version
  front: "Since which React version are Fragment refs stable?"
  back: "React 19.3, announced in the React 19.3 post."
  question: react/refs/fragment-refs
- id: fragment-instance-what
  front: "What does a Fragment ref hold, and which nodes does it work on?"
  back: "A `FragmentInstance`, attached in the commit like any ref. It works on the Fragment's first-level DOM children: the nearest host nodes, found by looking through components."
  question: react/refs/fragment-refs
- id: fragment-instance-not-node
  front: "Is a `FragmentInstance` a DOM node?"
  back: "No. It is neither a `Node` nor an `EventTarget` (`instance instanceof Node` is `false`). There is no `style`, `classList`, `querySelector` or `contains`, and it cannot be passed where a node is expected."
  question: react/refs/fragment-refs
- id: fragment-instance-events
  front: "What do `addEventListener` and `removeEventListener` do on a `FragmentInstance`?"
  back: "They act on every first-level child. Children rendered later get the stored listeners, and removed children lose them."
  question: react/refs/fragment-refs
- id: fragment-instance-dispatch-event
  front: "What does `dispatchEvent` on a `FragmentInstance` do?"
  back: "It dispatches \"on the Fragment\", running the Fragment's listeners, and the event can bubble to its DOM parent."
  question: react/refs/fragment-refs
- id: fragment-instance-dispatch-internals
  front: "How does React 19.3.1 implement `FragmentInstance.dispatchEvent` without a node?"
  back: "It temporarily appends an empty text node to the parent, adds the Fragment's listeners to it, dispatches there, then removes it. This is an implementation detail; the documented behaviour is that the listeners run and the event may bubble."
  question: react/refs/fragment-refs
- id: fragment-instance-focus
  front: "How do `focus()`, `focusLast()` and `blur()` work on a `FragmentInstance`?"
  back: "`focus()` and `focusLast()` search nested descendants depth-first for something focusable; `blur()` only acts if focus is inside."
  question: react/refs/fragment-refs
- id: fragment-instance-observers
  front: "What do `observeUsing` and `unobserveUsing` do?"
  back: "They attach or detach an `IntersectionObserver` or `ResizeObserver` for each first-level child, following children added later."
  question: react/refs/fragment-refs
- id: fragment-instance-geometry
  front: "Which geometry and position methods does a `FragmentInstance` have?"
  back: "`getClientRects()` (one flat array), `getRootNode()`, `compareDocumentPosition()`, and `scrollIntoView(alignToTop)`."
  question: react/refs/fragment-refs
- id: fragment-reactfragments-set
  front: "What is `reactFragments` on a first-level child?"
  back: "A set naming the Fragment instances that own it, so one shared observer can route entries."
  question: react/refs/fragment-refs
- id: fragment-listeners-first-level-only
  front: "Why did listening for `focus` on a Fragment ref not catch a nested `<input>`?"
  back: "Listeners sit on first-level children only and `focus` does not bubble. In the test `focus` on a nested input never reached them; `focusin` did."
  question: react/refs/fragment-refs
- id: fragment-scroll-into-view-options
  front: "What happens if you pass an options object to `FragmentInstance.scrollIntoView`?"
  back: "React 19.3.1 throws \"FragmentInstance.scrollIntoView() does not support scrollIntoViewOptions\". Pass `true` or `false`."
  question: react/refs/fragment-refs
- id: fragment-observe-text-only
  front: "What happens when `observeUsing` is called on a Fragment holding only text?"
  back: "Observers cannot watch text nodes; development builds log an error saying so."
  question: react/refs/fragment-refs
- id: fragment-children-targets
  front: "With `<A />` rendering `<div id=\"B\"><button id=\"C\" /></div>`, then `<D />`, which nodes are targets?"
  back: "A, B and D: the first host nodes under the Fragment, looking through components. C is not a target."
  question: react/refs/fragment-refs
- id: fragment-get-client-rects-text
  front: "What did `getClientRects()` include for a bare text child in 19.3.1?"
  back: "A rectangle for the text child too."
  question: react/refs/fragment-refs
- id: fragment-compare-position-empty
  front: "What does `compareDocumentPosition` return for an empty Fragment?"
  back: "The usual flags plus `DOCUMENT_POSITION_IMPLEMENTATION_SPECIFIC` (32). An empty Fragment before a `<span>` returned `36` (following 4 plus 32). A Fragment with children returned `2` for a node before it and `4` for one after."
  question: react/refs/fragment-refs
- id: fragment-once-listener
  front: "Does `{ once: true }` on a Fragment ref listener fire once per child?"
  back: "No. In 19.3.1 the first event on any child removed the listener from the whole group; clicking two buttons in turn called it once."
  question: react/refs/fragment-refs
- id: fragment-listener-later-child
  front: "In the `ClickGroup` example, did a card rendered after the effect ran get the click listener?"
  back: "Yes. Card `c` did not exist when the effect ran, yet it got the listener, and no wrapper element was added (React 19.3.1, development and production, Chrome 156 and Firefox 159)."
  question: react/refs/fragment-refs
# 05 Reconciliation
- id: reconciliation-what
  front: "What does reconciliation do?"
  back: "It compares a render's new elements with the tree React committed last time to find the DOM changes. The commit then applies only those changes."
  question: react/reconciliation/diffing-heuristics
- id: reconciliation-on3-vs-on
  front: "What does an exact minimal tree diff cost, and what does React run instead?"
  back: "An exact diff costs O(n³); the older React docs note 1,000 elements would need about a billion comparisons. React runs an O(n) heuristic."
  question: react/reconciliation/diffing-heuristics
- id: reconciliation-two-assumptions
  front: "Which two assumptions does React's O(n) diffing heuristic rest on?"
  back: "Elements of different types produce different trees, and keys mark which children stay the same between renders."
  question: react/reconciliation/diffing-heuristics
- id: reconciliation-different-type
  front: "What does React do when the element type at a position changes (`<div>` to `<section>`, `<Article>` to `<Comment>`)?"
  back: "It does not look inside. It unmounts the whole old subtree (effect cleanups run, DOM nodes removed, state gone) and mounts the new one from scratch."
  question: react/reconciliation/diffing-heuristics
- id: reconciliation-same-dom-type
  front: "What does React do for the same DOM element type at a position?"
  back: "It keeps the DOM node, updates only the changed attributes (only the changed `style` properties too), then recurses into the children."
  question: react/reconciliation/diffing-heuristics
- id: reconciliation-same-component-type
  front: "What happens for the same component type at a position?"
  back: "The instance and its state stay. React renders it with the new props and recurses into its output."
  question: react/reconciliation/diffing-heuristics
- id: reconciliation-type-by-reference
  front: "How is a \"type\" compared, and is `memo(Field)` the same type as `Field`?"
  back: "By reference: the string `'div'`, or the component function itself. `memo(Field)` is a different type from `Field`. `forwardRef` wrappers also return new types."
  question: react/reconciliation/diffing-heuristics
- id: virtual-dom-faster-myth
  front: "Does the virtual DOM make React faster than direct DOM updates?"
  back: "No, that is a myth. The diff is extra work on top of the DOM calls you would write by hand. It buys a declarative model; React's speed comes from touching only changed nodes and skipping renders."
  question: react/reconciliation/diffing-heuristics
- id: virtual-dom-meaning
  front: "What does the older docs' \"virtual DOM\" refer to?"
  back: "The in-memory description (elements, plus fibers) that React keeps and syncs with the real DOM. The current docs call this render and commit."
  question: react/reconciliation/diffing-heuristics
- id: wrapper-flip-remounts
  front: "Why does `{hint ? <Tooltip><Field /></Tooltip> : <Field />}` lose the input every time?"
  back: "The slot's type flips between `Tooltip` and `Field`, so `Field` remounts."
  question: react/reconciliation/diffing-heuristics
- id: moved-subtree-different-parent
  front: "What happens when a subtree moves to a different parent?"
  back: "React does not notice the move. Keys match only among siblings; anywhere else it is an unmount plus a mount."
  question: react/reconciliation/diffing-heuristics
- id: component-defined-inside-component
  front: "Why does defining a component inside another component cause remounts?"
  back: "Each render creates a new function, which is a new type, so React remounts it."
  question: react/reconciliation/diffing-heuristics
- id: reconciliation-vs-rerender
  front: "Is reconciliation the same as re-rendering?"
  back: "No. Rendering calls components to get elements; reconciliation compares them with the previous tree during the render phase; the commit applies the result. A component can re-render and reconcile to zero DOM changes."
  question: react/reconciliation/diffing-heuristics
- id: fragment-wrap-state-depth
  front: "Does wrapping a child in a Fragment reset it?"
  back: "Not one level deep: `<Child />` to `<><Child /></>` kept state in React 19.3.1. Two levels, `<><><Child /></></>`, remounted it, as the Fragment docs' caveat says."
  question: react/reconciliation/diffing-heuristics
- id: heuristic-never-incorrect
  front: "Can the diffing heuristic be wrong?"
  back: "It is never incorrect, only sometimes wasteful. Two component types with nearly identical output are rebuilt rather than patched, and a moved subtree is recreated. The legacy docs suggest one type if you alternate between similar ones."
  question: react/reconciliation/diffing-heuristics
- id: reconcile-single-element
  front: "How does React 19.3.1's `reconcileSingleElement` decide to reuse a fiber?"
  back: "It finds an old child with the same `key` (both `null` when unkeyed), then checks `child.elementType === element.type`. A match reuses the fiber with new props; a mismatch deletes the old fiber and everything below it and creates a new one. Implementation detail from `ReactChildFiber.js`."
  question: react/reconciliation/diffing-heuristics
- id: render-records-flags-commit-applies
  front: "What does the render phase record, and who performs it?"
  back: "Flags: placement, update, deletion. The commit performs them, which a `MutationObserver` makes visible."
  question: react/reconciliation/diffing-heuristics
- id: mutation-observer-type-change
  front: "In the `MutationObserver` demo, what happened when `<div>` became `<section>` with an identical `<b>` inside?"
  back: "It logged remove DIV, insert SECTION. The `<b>` and its text were identical but sat under a new type, so they were rebuilt too. Same-type steps only set `class` or text."
  question: react/reconciliation/diffing-heuristics
- id: attribute-change-same-input-type
  front: "Does changing `<input type=\"text\">` to `<input type=\"number\">` remount the input?"
  back: "No, it is the same type. React updated `type` on the existing node."
  question: react/reconciliation/diffing-heuristics
- id: hot-reload-same-family
  front: "How do development builds treat a hot-reloaded component?"
  back: "They accept a hot-reloaded version of the same component as a match (`isCompatibleFamilyForHotReloading` in the source), so state can survive an edit."
  question: react/reconciliation/diffing-heuristics
- id: null-false-hold-positions
  front: "Do `null` and `false` hold a position among siblings?"
  back: "Yes. `{a && <X />}<Y />` keeps `Y` in the second slot whether or not `X` renders."
  question: react/reconciliation/diffing-heuristics
- id: responsive-layout-remount-fix
  front: "A form empties when `isMobile ? <MobileLayout>{form}</MobileLayout> : <DesktopLayout>{form}</DesktopLayout>` flips. Why, and what are the fixes?"
  back: "The layout types differ at the same position, so the form below was unmounted. Fixes, best first: one layout component that adapts with CSS or props; lift the form's state above the switch; or render the form outside the layout-specific wrapper."
  question: react/reconciliation/diffing-heuristics
- id: diff-too-slow-fix
  front: "When the diff itself is too slow, what are the fixes?"
  back: "Render less: `memo`, the React Compiler, moving state down. Not avoiding React's DOM updates."
  question: react/reconciliation/diffing-heuristics
- id: key-is-identity
  front: "What is a key?"
  back: "A child's identity among its siblings. React matches old and new children by key, or by index when there is none, and the match decides which instance, state and DOM node each item gets."
  question: react/reconciliation/list-keys
- id: stable-keys-benefit
  front: "What happens with stable keys from the data when a list is reordered, filtered or inserted into?"
  back: "React keeps the instance for every key still present, moves its DOM node if the order changed, creates nodes only for new keys and removes them only for missing ones."
  question: react/reconciliation/list-keys
- id: key-unique-among-siblings
  front: "Must keys be globally unique?"
  back: "No, only among siblings; the same id in two different lists is fine. Duplicates among siblings warn `Encountered two children with the same key` and may duplicate or drop children."
  question: react/reconciliation/list-keys
- id: key-stable-not-in-render
  front: "When should a key be generated?"
  back: "When the data is created, never during render. `key={crypto.randomUUID()}` in render remounts every item every time."
  question: react/reconciliation/list-keys
- id: key-not-a-prop
  front: "Can a component read its own `key` from props?"
  back: "No. Reading `props.key` gives `undefined` and a development warning. Pass the id as another prop: `<Profile key={id} userId={id} />`."
  question: react/reconciliation/list-keys
- id: missing-key-warning
  front: "What happens when list children have no keys?"
  back: "Development warns `Each child in a list should have a unique \"key\" prop.` and React falls back to the index."
  question: react/reconciliation/list-keys
- id: index-key-bug
  front: "What goes wrong with index keys after inserting an item at the top?"
  back: "Every item shifts to the next key. Each instance re-renders with its new neighbour's props, so text looks right, but state, uncontrolled input values, checked boxes and focus stay in the old position, now next to a different item."
  question: react/reconciliation/list-keys
- id: index-key-acceptable
  front: "When are index keys acceptable?"
  back: "Only for lists that never reorder, filter or insert anywhere but the end, and whose items hold no state or uncontrolled inputs, such as a fixed list of labels."
  question: react/reconciliation/list-keys
- id: random-key-remount
  front: "What does `key={Math.random()}` do?"
  back: "It never matches the previous render, so every item remounts on every render: slow, and typed input is lost."
  question: react/reconciliation/list-keys
- id: fragment-key-shorthand
  front: "How do you key a group of several elements per item?"
  back: "`<Fragment key={id}>`. The `<>` shorthand cannot take a key. It keys a group without adding a DOM wrapper."
  question: react/reconciliation/list-keys
- id: index-key-silence-warning
  front: "Why is using `index` just to silence the key warning a pitfall?"
  back: "The warning is about identity. Silencing it with the index keeps the bug."
  question: react/reconciliation/list-keys
- id: key-no-id-data
  front: "What do you do when list data has no id?"
  back: "Add one when the data enters the app (a counter, or `crypto.randomUUID()` when the item is created), or use a stable natural key such as a unique slug. Hashing content works only if the content never changes."
  question: react/reconciliation/list-keys
- id: key-change-resets-instance
  front: "What does changing a component's `key` outside a list do?"
  back: "React treats it as a different instance: it unmounts the old one and mounts a fresh one. That is the standard way to reset state on purpose."
  question: react/reconciliation/list-keys
- id: reconcile-children-array-passes
  front: "What are the passes of React 19.3.1's `reconcileChildrenArray`?"
  back: "Walk old and new children together while keys match at the same index; delete the rest of the old or create the rest of the new when one list runs out; otherwise put remaining old children in a `Map` by key (index when unkeyed), reuse matches and delete leftovers. Implementation detail."
  question: react/reconciliation/list-keys
- id: last-placed-index
  front: "What is `lastPlacedIndex` in `placeChild`?"
  back: "The highest old index kept in place so far. A reused child with a lower old index is flagged to move; otherwise it stays and raises the mark. The scan is forward only. Implementation detail."
  question: react/reconciliation/list-keys
- id: move-to-front-cost
  front: "Moving item `A` from the front to the end of `[A, B, C, D]` versus the end to the front: how many DOM moves?"
  back: "One move to the end; three to the front (`BCD`), because `A`'s old index was the highest. The forward-only algorithm sometimes moves more nodes than necessary."
  question: react/reconciliation/list-keys
- id: item-to-index-keys-remount
  front: "What happened when keys switched from item keys to index keys on the same list?"
  back: "All four items were created anew, since no key matched. Reordering with index keys afterwards produced four text edits on the same nodes, which is how state ends up on the wrong item."
  question: react/reconciliation/list-keys
- id: key-in-props-dev-vs-prod
  front: "What did `'key' in props` return in development versus production?"
  back: "`true` in development (React defines a warning getter) and `false` in production; the value is `undefined` in both."
  question: react/reconciliation/list-keys
- id: key-same-type-check-order
  front: "In reconciliation, is the key or the type checked first, and what if the key matches but the type differs?"
  back: "The key match is checked first, then the type. Same key, different type at the same spot still remounts."
  question: react/reconciliation/list-keys
- id: key-sortable-table-edit
  front: "Why does `key={index}` break a sortable table with a per-row edit toggle?"
  back: "Sorting leaves the editor open on whatever row is now at that position. With `key={row.id}` the open editor travels with its row, and a focused input stays focused after a sort."
  question: react/reconciliation/list-keys
- id: key-virtualization
  front: "For very long lists, what matters more than the extra node moves keys can cause?"
  back: "Rendering fewer items in the first place, with virtualization."
  question: react/reconciliation/list-keys
- id: groceries-index-key-checked
  front: "With `key={index}`, you check \"milk\" and remove it from `milk, eggs, bread`. Which row is checked?"
  back: "`eggs`. Removal deleted the last `<li>` (key `2`), and the first `<li>`, still key `0` with its checked box, now renders `eggs`. With `key={item}` the checked row is the one removed."
  question: react/reconciliation/list-keys
- id: state-tied-to-position
  front: "Where does React store a component's state?"
  back: "In its own tree, at the position where the component renders, not in the function or the JSX tag. Each render matches the new element at that position with the old one."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-kept-conditions
  front: "When is state kept?"
  back: "When the same type renders at the same position with the same key, even if props change."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-reset-conditions
  front: "When is state reset?"
  back: "When the component is removed, when a different type takes its position (or an ancestor's), or when its key changes."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-ternary-vs-and
  front: "Does `{isA ? <Counter name=\"A\" /> : <Counter name=\"B\" />}` keep state, and what about `{isA && <Counter name=\"A\" />}{!isA && <Counter name=\"B\" />}`?"
  back: "The ternary keeps it: one slot, one counter whose props changed. The `&&` pair resets it: two slots, where `false` holds the empty one, so each counter mounts and unmounts."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-keyed-ternary-resets
  front: "In the counter demo, what did the keyed ternary do when toggled?"
  back: "It reset, like the `&&` pair: keys `A` and `B` are two identities, so the hidden counter unmounted and `A` came back at `0`. Only the plain ternary kept its count."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-position-is-returned-tree
  front: "Does position mean where JSX sits in code?"
  back: "No, it means the returned tree. Two `return` statements that each put `<Counter />` first in a `<div>` are the same position."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-reset-with-key
  front: "How do you reset a chat component's state when the contact changes?"
  back: "Give it a key from that identity: `<Chat key={contact.id} contact={contact} />`. A new key unmounts the old subtree and mounts a fresh one: state, DOM and effects start over, all the way down."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-prop-change-no-reset
  front: "Does a changed prop reset state?"
  back: "No. `<Chat contact={bob} />` after `<Chat contact={alice} />` keeps Alice's draft. Re-rendering never resets state; only unmounting does, and `useState(initial)` reads `initial` on mount only."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-reset-effect-pitfall
  front: "Why is resetting with `useEffect(() => setDraft(''), [contactId])` worse than a key?"
  back: "It renders the stale draft first, and it does not reset nested children's state."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-nested-component-definition
  front: "What happens to a component defined inside another component?"
  back: "It is a new function, so a new type, on every parent render. Its state and DOM are thrown away each time and its effects re-run on mount. Define components at the top level."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-conditional-wrapper
  front: "Why does conditionally wrapping a component in a new element or provider reset it?"
  back: "The ancestor's type changes at that position, so everything below remounts."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-preserve-hidden
  front: "How do you keep state for hidden UI?"
  back: "Lift the state up, or hide the UI with `<Activity>`."
  question: react/reconciliation/preserving-and-resetting-state
- id: key-change-reruns-effects
  front: "Does a key change re-run effects?"
  back: "Yes. The old instance unmounts so its cleanups run, and the new one mounts and runs its setups. Refs, DOM nodes and focus are new as well."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-hooks-analogy
  front: "How is state-by-position like the Rules of Hooks?"
  back: "Same idea one level up: hooks are matched to their state by call order inside a component, and components by position (and key) in the tree. Change the order or position and the state goes to someone else, or is dropped."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-lives-on-fiber
  front: "Where does state live internally, and what does a type match do to it?"
  back: "On the component's fiber for that position. A match clones the fiber, hook state included. A mismatch deletes the old fiber and subtree and creates a new fiber with fresh hooks (React 19.3.1, implementation detail)."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-conditional-empty-slot
  front: "Does a conditional that renders nothing still occupy a slot?"
  back: "Yes. `{isA && <Counter />}` leaves `false` in its slot, so the `&&` pair always occupies two slots."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-early-return-structure
  front: "Do two early-return branches that each render `<div><Inner />…</div>` remount `Inner` on switch?"
  back: "No. `Inner` stayed mounted across the switch because the structure matches."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-key-resets-whole-subtree
  front: "What does putting a `key` on a form reset?"
  back: "Every input inside it, not only the top component's state."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-key-different-type
  front: "Does a matching key keep state if the type differs?"
  back: "No. Same key, different type still resets: the key matches but the type does not."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-keys-not-cross-parents
  front: "What happens to a keyed component moved to a different parent element?"
  back: "It remounts. Keys do not cross parents."
  question: react/reconciliation/preserving-and-resetting-state
- id: drafts-keep-in-parent
  front: "If chat drafts should survive switching contacts, what do you do?"
  back: "Keep them in the parent as `drafts[contactId]`. The key stays, since a chat with Alice is still a different thing from a chat with Bob."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-key-vs-derive-tradeoff
  front: "What is the cost of resetting with a key, and what is the alternative for one field?"
  back: "It is explicit and complete but remounts the whole subtree. When only one field should change, derive it or adjust it during render instead."
  question: react/reconciliation/preserving-and-resetting-state
- id: state-structure-is-behaviour
  front: "What is the downside of tying state to position?"
  back: "Structure becomes behaviour. Changing a ternary to two `&&`s, adding a wrapper, or inlining a component definition can silently reset state."
  question: react/reconciliation/preserving-and-resetting-state
- id: create-portal-signature
  front: "What does `createPortal(children, domNode, key?)` do?"
  back: "It returns a React node that renders `children` and places their DOM nodes inside `domNode` instead of inside the component's parent DOM element. The target must already exist; switching to a different node later recreates the content."
  question: react/reconciliation/portals
- id: portal-only-dom-placement
  front: "What does a portal change, and what stays the same?"
  back: "Only the physical DOM placement. Context, React event bubbling, state and lifecycle still follow the React tree: the portal mounts and unmounts with its owning component."
  question: react/reconciliation/portals
- id: portal-context
  front: "Does context reach components inside a portal?"
  back: "Yes. A `ThemeContext` provider above the component reaches components in the portal."
  question: react/reconciliation/portals
- id: portal-react-events-bubble
  front: "How do React events bubble from inside a portal?"
  back: "Through the React tree. A click in a portal rendered into `document.body` reaches an `onClick` on the portal's React parent, although that element is nowhere near it in the DOM."
  question: react/reconciliation/portals
- id: portal-native-follows-dom
  front: "What follows the DOM tree rather than the React tree for portal content?"
  back: "Native listeners (`addEventListener`, `contains()` checks), CSS inheritance and selectors, and layout."
  question: react/reconciliation/portals
- id: portal-purpose
  front: "Why use a portal for a tooltip, menu or modal?"
  back: "Its content escapes an ancestor's `overflow: hidden` or a stacking context that would clip or bury it."
  question: react/reconciliation/portals
- id: portal-event-delegation
  front: "Since React 17, where does React attach its listeners, and what happens for portals in 19.3.1?"
  back: "On the root container instead of `document`. Mounting a portal in React 19.3.1 also attaches React's listeners to its container (`listenToAllSupportedEvents` in `preparePortalMount`). React then walks the fiber tree, not the DOM, to find handlers."
  question: react/reconciliation/portals
- id: portal-listeners-capture-bubble
  front: "Which listeners did `#root` and `<body>` get in the portal test?"
  back: "Each got a capture and a bubble `click` listener (React 19.3.1)."
  question: react/reconciliation/portals
- id: portal-native-root-listener-skipped
  front: "In the tooltip example, why did a native click listener on `#root` not run for a portaled button?"
  back: "In the DOM, the button is a child of `<body>`, outside `#root`. The React `onClick` on the card did run, since in the React tree the button is inside the card."
  question: react/reconciliation/portals
- id: portal-dialog-popover-alternative
  front: "What may replace a portal for modals?"
  back: "`<dialog>` opened with `showModal()`, and the `popover` attribute. They put an element in the browser's top layer, above every stacking context, from wherever it sits in the DOM. The modal still needs focus and keyboard handling."
  question: react/reconciliation/portals
- id: portal-still-useful
  front: "When are portals still useful despite `<dialog>` and popover?"
  back: "When rendering into a specific node, including one owned by non-React code."
  question: react/reconciliation/portals
- id: portal-click-outside-pitfall
  front: "Why does a native `document` click-outside handler with `contains(event.target)` close a menu on clicks in a portaled submenu?"
  back: "Portaled nodes are not DOM descendants of the menu. Handle it through React events, or check the portal's node too."
  question: react/reconciliation/portals
- id: portal-bubbling-stop
  front: "Does a portal stop event bubbling to its React ancestors?"
  back: "No. A click in a modal also triggers `onClick` handlers on its React ancestors. Call `e.stopPropagation()` at the portal's root, or render the portal higher up."
  question: react/reconciliation/portals
- id: portal-descendant-selectors
  front: "Why do descendant selectors like `.card button` fail for portal content?"
  back: "It is no longer inside `.card` in the DOM, and it inherits fonts and colours from its new parent."
  question: react/reconciliation/portals
- id: portal-target-existence-ssr
  front: "What are the target-node pitfalls of `createPortal`?"
  back: "Do not create the target during render or read `document` during server rendering. The node must exist before the portal mounts, and there is no `document` on the server."
  question: react/reconciliation/portals
- id: portal-body-native-listener
  front: "Do native listeners on `document.body` see portal clicks?"
  back: "Yes, by normal DOM bubbling, since the portal's DOM is inside `<body>`. A native listener on the same node as React's runs in registration order relative to React's."
  question: react/reconciliation/portals
- id: portal-non-react-node
  front: "Can a portal target a node rendered by non-React code?"
  back: "Yes, any existing DOM node, such as a map widget's popup element. React manages only the children it puts there."
  question: react/reconciliation/portals
- id: portal-stop-propagation-exercise
  front: "A portal's `<div onClick={e => e.stopPropagation()}>` wraps a close button, with a `<section onClick>` above `Modal`. What logs on click?"
  back: "Only `close`. The click bubbles through the React tree from the button to the portal's `<div>`, whose `stopPropagation()` stops it before `<section>`. Without it, `section` would log too."
  question: react/reconciliation/portals
- id: activity-hidden-keeps
  front: "What does `<Activity mode=\"hidden\">` keep and what does it do?"
  back: "It keeps the subtree's fibers (state preserved) and DOM nodes (typed text, scroll position, a `<video>`'s timecode), hides the top-level DOM nodes with `display: none`, and cleans up the children's effects as if they had unmounted."
  question: react/reconciliation/activity
- id: activity-hide-style
  front: "How does React 19.3.1 hide Activity content?"
  back: "`display: none` set as `!important` inline, in the test `<button style=\"display: none !important;\">`."
  question: react/reconciliation/activity
- id: activity-stable-modes
  front: "Since which version is Activity stable, and what modes exist?"
  back: "React 19.2. It has two modes, `visible` (the default) and `hidden`."
  question: react/reconciliation/activity
- id: activity-hidden-rerenders-low-priority
  front: "Do hidden Activity children re-render when props change?"
  back: "Yes, but at a lower priority, after the visible content has committed. In the test: `render shown 1`, `commit 1`, `render hidden 1`."
  question: react/reconciliation/activity
- id: activity-visible-mode
  front: "What happens when Activity switches back to `visible`?"
  back: "The nodes are shown again with their previous state, and the effects are re-created."
  question: react/reconciliation/activity
- id: activity-vs-conditional
  front: "How does Activity differ from conditional rendering `{isOpen && <Sidebar />}`?"
  back: "Conditional rendering unmounts, so state and DOM are gone and come back from scratch. Activity preserves state and DOM."
  question: react/reconciliation/activity
- id: activity-vs-css-hiding
  front: "How does Activity differ from CSS-only hiding?"
  back: "CSS hiding keeps everything mounted, including effects, so subscriptions, timers and connections keep running in invisible UI, and every update renders at full priority. Activity is preserved like CSS hiding but quiet like unmounting."
  question: react/reconciliation/activity
- id: activity-prerender
  front: "What happens when a boundary is `hidden` on its first render?"
  back: "It still renders its children, after the visible content and without running their effects. A likely-next tab can load its code and Suspense-based data in advance; data fetched in an effect is not, since the effect does not run."
  question: react/reconciliation/activity
- id: activity-hidden-first-render-order
  front: "In the test, where did the hidden first render show up in the log?"
  back: "`render hidden 0` came after the visible effects, the children's DOM was inserted already hidden, and no effects ran."
  question: react/reconciliation/activity
- id: activity-dom-side-effects
  front: "What DOM side effects continue while Activity is hidden, and how do you stop them?"
  back: "A `<video>` keeps playing and iframes stay loaded. Pause them in an effect cleanup, preferably `useLayoutEffect` since the cleanup is tied to the UI being hidden."
  question: react/reconciliation/activity
- id: activity-effects-with-cleanup
  front: "Which effects already work correctly under Activity?"
  back: "Effects with proper cleanup, the same ones that survive Strict Mode."
  question: react/reconciliation/activity
- id: activity-effect-cleanup-order
  front: "In the Activity versus conditional demo, what order did hiding and showing run effects?"
  back: "Hiding: conditional cleanup, then activity cleanup. Showing: activity setup, then conditional setup. The activity button kept its count (2); the conditional one restarted at 0."
  question: react/reconciliation/activity
- id: activity-which-effects-cleaned
  front: "Which effects does hiding clean up?"
  back: "All of them. Hiding ran the layout effect cleanup during the commit and the `useEffect` cleanup after it; showing re-ran both setups. State, refs and DOM nodes were kept."
  question: react/reconciliation/activity
- id: activity-effects-not-running-pitfall
  front: "What happens to a chat connection or polling interval inside a hidden Activity?"
  back: "It is disconnected, because hidden effects do not run. Keep work that must continue above the boundary."
  question: react/reconciliation/activity
- id: activity-text-only
  front: "What does a hidden Activity render around a component returning only text?"
  back: "Nothing. There is no element to put `display: none` on, so `'just text'` left no text in the DOM."
  question: react/reconciliation/activity
- id: activity-memory-cost
  front: "Why not wrap every hidden screen in Activity?"
  back: "Each keeps its whole DOM and state in memory and still re-renders on prop changes, just later. Unmount what the user is not likely to return to."
  question: react/reconciliation/activity
- id: activity-vs-lifting-state
  front: "Why prefer Activity over lifting state up?"
  back: "Lifting up keeps data but not DOM: scroll position, uncontrolled inputs, media playback and focus are lost on remount. Activity keeps both, at the cost of memory."
  question: react/reconciliation/activity
# 06 Context and composition
- id: create-context-key
  front: "What does `createContext(defaultValue)` return?"
  back: "A context object that holds no value of its own. It is a key that ties providers to readers."
  question: react/context-and-composition/context-propagation
- id: context-provide-read-syntax
  front: "How do you provide and read a context in React 19?"
  back: "Provide with `<ThemeContext value={theme}>` (the older `<ThemeContext.Provider>` still works); read with `useContext(ThemeContext)` or `use(ThemeContext)`."
  question: react/context-and-composition/context-propagation
- id: use-vs-use-context-conditional
  front: "How does `use(Context)` differ from `useContext`, and when do you need it?"
  back: "`use` can be called inside a condition or loop, such as after an early return. Both find the nearest provider the same way. `use` also reads Promises, which is a separate question."
  question: react/context-and-composition/context-propagation
- id: context-lookup-nearest-above
  front: "Which provider does a reader get, and does its own provider count?"
  back: "The nearest provider above it; nested providers override outer ones for their subtree, like CSS inheritance. A provider rendered by the reading component itself does not count."
  question: react/context-and-composition/context-propagation
- id: context-default-only-no-provider
  front: "When is the `createContext` default value used?"
  back: "Only when there is no provider at all. `<ThemeContext value={undefined}>` gives readers `undefined`, not the default."
  question: react/context-and-composition/context-propagation
- id: context-skips-intermediate
  front: "What does context do to the components between provider and reader?"
  back: "Nothing. Context skips the intermediate layers, which is the point compared with prop drilling. They render only for their own reasons, like a parent render."
  question: react/context-and-composition/context-propagation
- id: context-object-is-rerender
  front: "How does React decide whether context readers must re-render?"
  back: "It compares the provider's new `value` with the previous one using `Object.is`. If it changed, React schedules a render for every component below that read this context."
  question: react/context-and-composition/context-propagation
- id: context-bypasses-memo
  front: "Does `memo` stop a context change from re-rendering a reader?"
  back: "No. The reader gets its own pending update and renders even inside a `memo` parent that skipped rendering. In the example `memo` skipped `Panel`, yet the `Label` inside it re-rendered."
  question: react/context-and-composition/context-propagation
- id: context-no-partial-subscription
  front: "Can a reader subscribe to just one field of an object context value?"
  back: "No. It re-renders as a whole even if it uses one field; there is no built-in way to subscribe to part of the value."
  question: react/context-and-composition/context-propagation
- id: context-is-channel-not-state
  front: "Is context state?"
  back: "No, it is a channel. Keep state in the provider's component and pass it as `value`."
  question: react/context-and-composition/context-propagation
- id: context-when-to-use
  front: "What do the React docs suggest trying before context?"
  back: "Passing props or JSX as `children` first. Use context when distant parts of the tree need the same data: theme, current user, router."
  question: react/context-and-composition/context-propagation
- id: context-undefined-provider-pitfall
  front: "Why does a provider passing not-yet-loaded state `undefined` surprise people?"
  back: "Readers get `undefined`, not the default. The default applies only with no provider above."
  question: react/context-and-composition/context-propagation
- id: context-own-provider-pitfall
  front: "What does `useContext` see in the component that renders the provider?"
  back: "The provider above it, not the one it returns."
  question: react/context-and-composition/context-propagation
- id: context-duplicate-module
  front: "What happens with two copies of the module that calls `createContext`?"
  back: "Provider and reader must use the same object by `===`; otherwise readers silently get the default (duplicated packages, symlinks)."
  question: react/context-and-composition/context-propagation
- id: context-provider-deprecated
  front: "Is `<Context.Provider>` deprecated?"
  back: "Not yet. The React 19 post says a codemod will convert providers and \"In future versions we will deprecate `<Context.Provider>`.\" In React 19.3.1 it works without a warning and `Theme.Provider === Theme` is `true`."
  question: react/context-and-composition/context-propagation
- id: context-server-component
  front: "Can a Server Component provide context?"
  back: "It cannot create or read context. Since React 19.3 it can render a `<Context value>` imported from a `'use client'` module, without a client wrapper component."
  question: react/context-and-composition/context-propagation
- id: context-value-stack
  front: "How does React 19.3.1 track the current context value during the tree walk?"
  back: "`pushProvider` saves the context's current value on a stack and sets `context._currentValue` to the provider's `value`; `popProvider` restores it. With no provider, `_currentValue` is the `createContext` default. Implementation detail."
  question: react/context-and-composition/context-propagation
- id: context-dependency-list
  front: "What does `useContext` record on the reading fiber?"
  back: "It reads `_currentValue` and appends `{ context, memoizedValue }` to the fiber's dependency list (React 19.3.1, implementation detail)."
  question: react/context-and-composition/context-propagation
- id: context-lazy-propagation
  front: "How does React 19.3.1 propagate a changed provider value to readers?"
  back: "Lazily. When about to skip a subtree, it collects ancestor providers whose `value` changed by `Object.is`, searches the subtree for fibers with a matching dependency, and gives each match an update lane plus `childLanes` markers on its ancestors. Implementation detail."
  question: react/context-and-composition/context-propagation
- id: context-missing-value-prop
  front: "What happens with `<Theme>` and no `value` prop?"
  back: "It provides `undefined`; development builds log \"The `value` prop is required for the `<Context.Provider>`…\", even for the new syntax."
  question: react/context-and-composition/context-propagation
- id: context-consumer-legacy
  front: "What is `<Context.Consumer>`?"
  back: "A render-prop way to read context: `<Theme.Consumer>{(theme) => …}</Theme.Consumer>`. The docs call it the legacy way."
  question: react/context-and-composition/context-propagation
- id: context-portal-unchanged
  front: "Does a portal change which context a reader sees?"
  back: "No. A reader inside a portal still sees providers above the portal in the React tree."
  question: react/context-and-composition/context-propagation
- id: context-equal-value-no-rerender
  front: "What happens when a provider re-renders with an `Object.is`-equal value?"
  back: "Nothing through context: a `memo` reader below it did not log when the provider's component re-rendered."
  question: react/context-and-composition/context-propagation
- id: context-nested-provider-rerender
  front: "In 19.3.1, toggling the outer theme: do buttons under an inner `<Theme value=\"dark\">` re-render?"
  back: "Yes, though they still read `dark`: the subtree search matches any reader of the context and does not stop at the inner provider. The output is correct; only the render count is higher."
  question: react/context-and-composition/context-propagation
- id: context-implicit-dependency
  front: "What is the cost of context compared with props?"
  back: "An implicit dependency: a component's output depends on where it is rendered, so tests and stories need the provider (a sensible default helps). Updates are coarse, at the granularity of the whole value."
  question: react/context-and-composition/context-propagation
- id: context-level-exercise
  front: "A `Section` reads `Level` then renders `<Level value={level + 1}>`. What does a nested `Section` see, and does its own provider affect its own read?"
  back: "Outer sees the default `0`, inner `1`, headings `1` and `2`. Its own provider does not affect its own `useContext` call."
  question: react/context-and-composition/context-propagation
- id: context-three-causes
  front: "What are the three causes of excess context re-renders?"
  back: "A new value every render, no selectors (readers subscribe to the whole value), and a provider re-rendering too much of the tree."
  question: react/context-and-composition/context-performance
- id: context-inline-object-value
  front: "Why does `<Auth value={{ user, setUser }}>` re-render all readers on unrelated state?"
  back: "It builds a new object every time the provider's component renders, so `Object.is` fails. Wrap the object in `useMemo` with the data as dependencies, and functions in `useCallback`."
  question: react/context-and-composition/context-performance
- id: context-stable-setters
  front: "Which values need no memoizing in a context value?"
  back: "State setters and `dispatch` are already stable, and a primitive value needs nothing."
  question: react/context-and-composition/context-performance
- id: context-split-state-dispatch
  front: "What is the standard context split, and why does it help?"
  back: "A reducer's state in one context and its `dispatch` in another. Components that only dispatch never re-render on state changes, because `dispatch` never changes."
  question: react/context-and-composition/context-performance
- id: context-split-by-change
  front: "How should contexts be split to avoid theme readers re-rendering on `lang` changes?"
  back: "By what changes together. A reader of `theme` from `{ theme, lang }` re-renders when `lang` changes, so give them separate contexts."
  question: react/context-and-composition/context-performance
- id: context-provider-children
  front: "How do you stop a provider with state from re-rendering the whole page?"
  back: "Move the state into a small provider component that takes `children`. An update re-renders the provider and the readers; the `children` elements, created by its parent, are skipped. Keep providers as low as the readers allow."
  question: react/context-and-composition/context-performance
- id: context-memo-no-help
  front: "Does `memo` on components between provider and readers reduce context re-renders?"
  back: "No. Readers get their own update and render anyway; `memo` only stops renders that come from a parent rendering."
  question: react/context-and-composition/context-performance
- id: context-compiler-limits
  front: "What can the React Compiler fix for context, and what can it not?"
  back: "It memoizes values like the inline object automatically; with `babel-plugin-react-compiler` 1.0.0 it cached `{ user, setUser }` keyed on `user` and readers stopped re-rendering. It cannot split a coarse context: a `theme` reader still re-rendered on `lang`."
  question: react/context-and-composition/context-performance
- id: context-external-store
  front: "When is an external store better than context?"
  back: "When many components each need a slice of data that changes often. A store read through `useSyncExternalStore`, typically via a state library with selectors, re-renders each component only when its own slice changes."
  question: react/context-and-composition/context-performance
- id: context-measure-first
  front: "What do React's docs say about re-rendering context readers in smaller apps?"
  back: "It is not a problem there. Measure first."
  question: react/context-and-composition/context-performance
- id: context-memo-rebuilt-dep
  front: "Why does `useMemo` on a context value fail with an `options` object literal as a dependency?"
  back: "The dependency is rebuilt every render, so the memo recomputes every time and fixes nothing."
  question: react/context-and-composition/context-performance
- id: context-split-single-hook-pitfall
  front: "Why does reading both split contexts in one `useTodos()` hook defeat the split?"
  back: "A component subscribes to every context it reads, so it re-renders on both."
  question: react/context-and-composition/context-performance
- id: context-fast-changing-value
  front: "What should you do with a value that changes on every keystroke or pointer move?"
  back: "Do not put it in a context read across the app. Keep it local, or use a store with selectors."
  question: react/context-and-composition/context-performance
- id: dispatch-stable-identity
  front: "Why does the `dispatch` context need no `useMemo`?"
  back: "`dispatch` from `useReducer` has a stable identity, documented in its reference. The provider passes the same function each render, so `Object.is` always matches and the context never notifies readers."
  question: react/context-and-composition/context-performance
- id: reducer-context-vs-library
  front: "Is reducer plus context a replacement for a state library?"
  back: "For app-level state read in a few places, often yes; the docs scale it with many context-reducer pairs. It still re-renders every reader of a context on each change, which is where libraries with selectors differ."
  question: react/context-and-composition/context-performance
- id: context-no-field-tracking
  front: "Why can React not skip a reader that destructured an unchanged field?"
  back: "React stores what each reader saw as the whole context value and compares by `Object.is`. It has no record of which fields a component used. Fixes change when the value changes (memoize) or which components read it (split)."
  question: react/context-and-composition/context-performance
- id: context-split-add-todo
  front: "In the split-context todo demo, what logged on clicking \"add\" with one combined context versus split contexts?"
  back: "One context: `AddTodo`, then `Count 1`. Split: only `Count 1`, since `AddTodo` reads only the stable `dispatch` context."
  question: react/context-and-composition/context-performance
- id: context-fix-tradeoffs
  front: "What does each context-performance fix leave unsolved?"
  back: "`useMemo` fixes identity but every field still notifies every reader. Splitting is the nearest thing to selectors, at the cost of more providers and hooks. Moving state down or composing with `children` reduces what re-renders around the provider, not who reads it. An external store lives outside React's state model and needs a server snapshot for SSR."
  question: react/context-and-composition/context-performance
- id: composition-four-ways
  front: "What are the four ways a caller customizes what a component renders?"
  back: "`children` and slot props, render props, compound components, and higher-order components."
  question: react/context-and-composition/composition-patterns
- id: composition-children-slots
  front: "What are `children` and slot props, and what is their limit?"
  back: "The caller passes elements (`<Card>{content}</Card>` or `<Layout header={<Header />} sidebar={<Nav />}>`) and the component decides where they go. The wrapper cannot pass its data into them."
  question: react/context-and-composition/composition-patterns
- id: composition-children-skip-rerender
  front: "Why are `children` elements cheap to re-render?"
  back: "The caller created them, so a re-render from the wrapper's own state skips them."
  question: react/context-and-composition/composition-patterns
- id: composition-render-props
  front: "What is a render prop and when do you use it?"
  back: "A function prop the component calls with its data, such as `renderItem={(item, isActive) => <Row … />}`, or `children` as a function. Use it when the component owns data the caller's markup needs. Costs: a new function each render, and nesting."
  question: react/context-and-composition/composition-patterns
- id: composition-compound
  front: "What are compound components?"
  back: "A set of parts used together, like `<Tabs>`, `<Tab>` and `<Panel>`. The parent provides shared state through context and each part reads it, so the caller controls structure and order."
  question: react/context-and-composition/composition-patterns
- id: composition-children-map-fragile
  front: "Why does react.dev call `Children.map` plus `cloneElement` fragile?"
  back: "They see only the elements passed directly, not what a wrapper component renders. Wrapping a `<Tab>` in a fragment or another component hides it from the parent; context does not care how deep a part sits."
  question: react/context-and-composition/composition-patterns
- id: composition-hoc
  front: "What is a higher-order component?"
  back: "`withX(Component)` returns a new component that renders the original with extra props."
  question: react/context-and-composition/composition-patterns
- id: hoc-problems
  front: "What are the problems with HOCs?"
  back: "Extra wrapper layers, prop-name collisions resolved silently, static methods not copied, and a HOC applied during render creating a new component type every time, which remounts and resets state."
  question: react/context-and-composition/composition-patterns
- id: hoc-status-docs
  front: "Are HOCs deprecated?"
  back: "No, but the legacy React docs say they \"are not commonly used in modern React code\". Hooks took over sharing logic; the Hooks FAQ says hooks are a simpler way to serve the single-child render prop and HOC use case."
  question: react/context-and-composition/composition-patterns
- id: hoc-inside-render
  front: "What happens when you call `withTheme(Counter)` inside a component body?"
  back: "It makes a new component type each render, so React remounts it and its state resets. Call it once at module level. In the exercise, `count 1` went back to `count 0` after the parent re-rendered."
  question: react/context-and-composition/composition-patterns
- id: hoc-prop-collision
  front: "Two HOCs inject the same prop name. Which wins?"
  back: "The one closest to the component (the inner wrapper), without a warning. In the example `withTheme`'s `dark` overwrote `withUser`'s `user-pref`."
  question: react/context-and-composition/composition-patterns
- id: hoc-statics-not-copied
  front: "What happens to static properties like `Input.validate` through a HOC?"
  back: "They stay on the original component unless the HOC copies them; `typeof Enhanced.validate` was `'undefined'`."
  question: react/context-and-composition/composition-patterns
- id: hoc-forward-ref-19
  front: "Does a HOC still need `forwardRef` in React 19?"
  back: "Not for function components. `ref` arrives as an ordinary prop, so spreading props forwards it; a ref on the enhanced component reached the inner `<input>` in Chrome 156 and Firefox 159."
  question: react/context-and-composition/composition-patterns
- id: render-prop-memo-pitfall
  front: "Why does an inline render prop defeat a `memo` component?"
  back: "The new function each render fails the props comparison."
  question: react/context-and-composition/composition-patterns
- id: render-prop-vs-hook
  front: "When does a render prop still beat a custom hook?"
  back: "When the component owns the markup around the caller's piece: a virtualized list renders the scroll container and calls `renderItem` only for visible rows. A hook returns data; it cannot place the caller's JSX inside its structure."
  question: react/context-and-composition/composition-patterns
- id: compound-context-provider
  front: "Why do compound components usually make the parent a context provider?"
  back: "The parts can sit anywhere below it, wrapped in layout or other components, and still read the shared state. React's `cloneElement` page lists context as the alternative to injecting props into children."
  question: react/context-and-composition/composition-patterns
- id: compound-rerender-through-context
  front: "In the Tabs example, why did `Profile` and `Billing` log only when mounted?"
  back: "The root created those elements, so only `Tab` and `Panel` re-render through context."
  question: react/context-and-composition/composition-patterns
- id: compound-implicit-contract
  front: "What is the trade-off of compound components?"
  back: "Callers control layout, with an implicit contract: parts only work inside their parent, so throw a clear error when the context is missing."
  question: react/context-and-composition/composition-patterns
- id: composition-data-flow-tradeoffs
  front: "How do `children`/slots and render props differ in data flow?"
  back: "Slots are simplest and cheapest to re-render but data flows only from the caller into the slot. Render props let the component give data back to the caller's markup, at the cost of callbacks in JSX and nesting."
  question: react/context-and-composition/composition-patterns
- id: custom-hook-definition
  front: "What is a custom hook?"
  back: "A function whose name starts with `use` and that calls other hooks. It shares logic between components, such as an online-status subscription or a form field's state and handler."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-shares-logic-not-state
  front: "What does a custom hook share between components?"
  back: "Stateful logic, not state. Its body runs inside each caller's render, so its `useState` and `useEffect` calls become that component's own hooks; two components, or two calls in one component, get independent state."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-docs-independent-quote
  front: "What do the docs say about separate calls to the same hook?"
  back: "\"Each call to a Hook is completely independent from every other call to the same Hook.\""
  question: react/context-and-composition/custom-hooks
- id: custom-hook-share-state-how
  front: "How do callers of a hook see the same data?"
  back: "Only when the hook reads something outside them: a context (the provider's state), an external store, or the browser. `useOnlineStatus()` callers agree because both subscribe to the same browser events, but each holds its own state. To share state itself, lift it up or use context."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-part-of-component
  front: "What follows from a custom hook's body running on every render?"
  back: "It must be pure during render, it always receives the latest props and state, and the functions it returns are new each render unless memoized."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-name-rule
  front: "What do the docs say about hook names, and which tools rely on it?"
  back: "\"Hook names must start with `use` followed by a capital letter.\" The `rules-of-hooks` lint rule allows hook calls only in components and `use` functions and checks they are called unconditionally; the React Compiler by default compiles functions named like components or hooks."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-no-use-without-hooks
  front: "Should a function that calls no hooks be named `use…`?"
  back: "No. The docs: \"If your function doesn't call any Hooks, avoid the `use` prefix.\" Callers could then no longer call it conditionally, and the name misleads. A `useSorted(items)` with no hooks gets no lint error."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-get-name-lint
  front: "What does `eslint-plugin-react-hooks` 7.1.1 report for `useState` inside `getCounter`?"
  back: "React Hook \"useState\" is called in function \"getCounter\" that is neither a React function component nor a custom React Hook function. A conditional call to a `get`-named hook goes unchecked."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-compiler-get-name
  front: "What did `babel-plugin-react-compiler` 1.0.0 do with a `getCounter()` that calls hooks?"
  back: "It compiled without a diagnostic, treated it as an ordinary function and cached the result on the first render, so the button kept showing `0` (Chrome 156 and Firefox 159). Renamed `useCounter`, the call is not cached. Listed as perishable."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-conditional-lint
  front: "What is reported for `if (show) { useCounter(); }`?"
  back: "React Hook \"useCounter\" is called conditionally. Under a `get` name nothing would be reported."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-store-pitfall
  front: "Why is a custom hook not a shared store?"
  back: "Each caller gets its own state. Sharing needs lifted state, context or an external store."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-component-inside
  front: "What goes wrong with declaring a component inside a hook and returning `<Inner />`?"
  back: "Each render creates a new component type, so its state resets. The `static-components` lint rule reports \"Cannot create components during render\"."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-use-mount
  front: "Why are \"lifecycle\" hooks like `useMount(fn)` discouraged?"
  back: "The docs warn they hide dependencies from the `exhaustive-deps` rule, which checks only direct `useEffect` calls."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-shared-value
  front: "How do you write a hook whose callers do share a value?"
  back: "Read it from somewhere shared: `function useTheme() { return useContext(ThemeContext); }`, or wrap `useSyncExternalStore` for data outside React. The hook shares access while the state lives in one place."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-return-jsx
  front: "Can a custom hook return JSX?"
  back: "Yes, an element is a value. Return elements of components defined at module level: `<Field />` kept its typed text across re-renders. A component defined inside the hook lost it each re-render."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-callback-effect-event
  front: "A hook uses an `onMessage` callback in an effect. What goes wrong and what is the fix?"
  back: "A new callback every render is a changing dependency, so the effect re-subscribes each render. Wrap it in an Effect Event (`useEffectEvent`) inside the hook, as the docs show for `useChatRoom`."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-no-runtime-concept
  front: "How does React 19.3.1 treat a custom hook at runtime?"
  back: "It has no concept of one. Each built-in hook call appends a node to a list on the currently rendering component's fiber (`memoizedState`), and the next render matches calls by position. A custom hook just makes some of those calls. Implementation detail."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-rules-transitive
  front: "Why do the Rules of Hooks apply transitively to custom hooks?"
  back: "Calling a custom hook conditionally shifts the positions of every hook inside it. Its closures capture that render's props and state, like code written directly in the component."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-use-online-status
  front: "What are the flaws of the docs' `useOnlineStatus` built on `useState` plus an effect, and the fix?"
  back: "It assumes the user starts online, and reading `navigator.onLine` would not work during server rendering. Rewriting the body with `useSyncExternalStore` fixes both without touching any caller."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-extraction-advice
  front: "What does the docs advise about extracting custom hooks?"
  back: "Do not extract a hook for a single `useState`, or write generic wrappers that do not constrain the caller. Name the hook after the use case; if no clear name comes, it is not ready to be extracted."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-vs-hoc-render-prop
  front: "Why did hooks replace most HOCs and render props for sharing logic?"
  back: "No wrapper components, no prop-name collisions, and the data flow is visible at the call site. The costs are the Rules of Hooks for every caller, and over-abstraction."
  question: react/context-and-composition/custom-hooks
- id: custom-hook-score-exercise
  front: "A `Score` component calls `useCounter('home')` and `useCounter('away')`. Clicking home twice logs what?"
  back: "`home 0`, `away 0`, then `home 1`, `away 0`, then `home 2`, `away 0` (no Strict Mode). Updating `home` re-renders `Score`, which re-runs both calls; `away` is unchanged."
  question: react/context-and-composition/custom-hooks
# 07 Performance
- id: memo-skip-condition
  front: "When does `memo(Component)` skip a re-render?"
  back: "When the parent re-renders and every prop is the same as last time: same keys, each value `Object.is`-equal."
  question: react/performance/memoization
- id: memo-are-props-equal
  front: "What does the second argument of `memo`, `arePropsEqual(oldProps, newProps)`, do?"
  back: "It replaces the default prop comparison."
  question: react/performance/memoization
- id: memo-blocks-only-parent-renders
  front: "Which re-renders can `memo` not block?"
  back: "Anything not caused by the parent. The component's own state updates and changes to contexts it reads still re-render it, because `memo` compares props only."
  question: react/performance/memoization
- id: use-memo-semantics
  front: "What does `useMemo(calculate, deps)` return?"
  back: "The cached result until one of `deps` changes, then it calls `calculate` again."
  question: react/performance/memoization
- id: use-callback-semantics
  front: "What does `useCallback(fn, deps)` do, and does it ever call `fn`?"
  back: "It returns the cached function until a dependency changes. It never calls `fn`. It is `useMemo(() => fn, deps)` with less typing."
  question: react/performance/memoization
- id: memo-three-helpful-cases
  front: "Which three cases do the docs say justify `memo`, `useMemo` or `useCallback`?"
  back: "A slow-to-render component re-rendering with the same props (`memo`); a value passed to a `memo` component or used as a hook dependency (stable identity); a noticeably slow calculation with rarely changing inputs (`useMemo`)."
  question: react/performance/memoization
- id: use-memo-slow-threshold
  front: "What threshold do the docs suggest for a calculation worth `useMemo`, and in which build should you measure?"
  back: "Around 1 ms, measured in a production build. Development builds and Strict Mode are slower, and Strict Mode renders twice."
  question: react/performance/memoization
- id: memo-fresh-props-defeat
  front: "Why does `memo` fail when the parent passes an inline `{}`, `() => {}` or JSX `children`?"
  back: "Each is a new object every render, so the `Object.is` comparison fails and the child re-renders anyway. The comparison cost is wasted."
  question: react/performance/memoization
- id: memo-children-is-a-prop
  front: "Why does a `memo` component with `<b>!</b>` as `children` still re-render with its parent?"
  back: "`children` is a prop, and the element is created anew on every parent render. Memoize the element with `useMemo`, or restructure so the parent of the component doesn't re-render."
  question: react/performance/memoization
- id: memo-restructure-before-memoizing
  front: "What two restructurings should you try before reaching for `memo`?"
  back: "Move state down into the component that uses it, so its updates skip the slow sibling. Or have the wrapper take the slow part as `children`: those elements come from its parent and are skipped."
  question: react/performance/memoization
- id: memo-optimization-not-correctness
  front: "May correctness depend on `memo`, `useMemo` or `useCallback`?"
  back: "No. They are optimizations, and React may drop a cache. If correctness depends on keeping a value, use state or a ref."
  question: react/performance/memoization
- id: use-memo-cache-discarded
  front: "In which situations does React throw away a `useMemo` cache, per the docs?"
  back: "In development and in production, if the component suspends during the initial mount. In development it also drops caches when you edit the file."
  question: react/performance/memoization
- id: memo-stale-custom-comparator
  front: "What goes wrong with a custom `arePropsEqual` that skips function props, or one that always returns `true`?"
  back: "The component never re-renders, so its handlers keep the first render's closure and log stale values. A custom comparison must compare every prop, functions included."
  question: react/performance/memoization
- id: memo-deep-compare-cost
  front: "What is the risk of a custom `arePropsEqual` that deep-compares unbounded data?"
  back: "The comparison can cost more than the render it avoids."
  question: react/performance/memoization
- id: memo-unstable-dependency
  front: "What happens if a `useMemo` or `useCallback` dependency is itself rebuilt every render, such as an `options` object literal?"
  back: "The cache misses every render, so the memoization does nothing."
  question: react/performance/memoization
- id: memo-mutation-silent
  front: "What happens when a memoized child receives an array the parent mutated in place?"
  back: "The reference is unchanged, so the child skips rendering and shows old data. Mutation defeats memoization silently."
  question: react/performance/memoization
- id: use-memo-missing-dependency
  front: "What happens with `useMemo(() => filter(items, query), [items])` when `query` changes?"
  back: "It keeps returning the result for the first `query`. Dependencies are compared, not read. The `exhaustive-deps` lint rule reports the missing dependency."
  question: react/performance/memoization
- id: memo-impl-shallow-equal
  front: "In React 19.3.1, how does `shallowEqual` compare props, and does it look inside values?"
  back: "Returns `true` if the objects are `Object.is`-equal. Otherwise it needs the same number of own keys and `Object.is` on every value. It never looks inside a value."
  question: react/performance/memoization
- id: memo-impl-bailout
  front: "In 19.3.1, what does `updateMemoComponent` check before bailing out of a `memo` component?"
  back: "That the component has no pending update of its own and no changed context. Then it compares props with `arePropsEqual` or `shallowEqual`, and checks the `ref` is unchanged. Equal means React reuses the previous output."
  question: react/performance/memoization
- id: memo-impl-hook-slot
  front: "In React 19.3.1, what do `useMemo` and `useCallback` store in the hook slot?"
  back: "Both store `[value, deps]`. Next render, `areHookInputsEqual` compares dependencies pairwise with `Object.is`. With no dependency array the deps are `null`, so the value is recomputed every render."
  question: react/performance/memoization
- id: use-memo-strict-mode-twice
  front: "In Strict Mode, how often does a `useMemo` calculation run on mount, and in production?"
  back: "Twice in Strict Mode (development): both calls happen during the first component call, and the second component call reuses the result. Production ran it once."
  question: react/performance/memoization
- id: memo-demo-log-result
  front: "Four `Chart` components under `memo`: one with stable props, one with an inline `style`, one with an inline handler, one with `children`. Which re-render when the parent's state changes?"
  back: "All but the stable one. Same logs in Chrome 156 and Firefox 159, development and production, React 19.3.1, no Strict Mode."
  question: react/performance/memoization
- id: memo-list-3000-rows
  front: "Re-rendering 3,000 `Row` components per update, unmemoized versus wrapped in `memo`, in a production build?"
  back: "Chrome 156: 0.59–0.60 ms versus 0.010–0.012 ms. Firefox 159: 1.28–1.29 ms versus 0.01–0.03 ms. Measured with `flushSync`, 5 page loads, 100 updates each."
  question: react/performance/memoization
- id: memo-fix-order
  front: "For a keystroke re-rendering a large unrelated list, in what order should you try fixes?"
  back: "Move the state down into its own component, then lift the content up as `children`, then `memo` the list with stable props. The first two need no comparison and can't be broken by a later new prop."
  question: react/performance/memoization
- id: memo-compiler-relationship
  front: "How does the React Compiler change manual memoization?"
  back: "It inserts memoization for you, caching values and JSX inside each component, so unchanged children receive the same elements and are skipped. It removes the manual dependency arrays."
  question: react/performance/memoization
- id: memo-tradeoff
  front: "What does memoization cost, and when is it pure cost?"
  back: "A comparison per render, memory for cached values, and dependency arrays that can go stale. It is pure cost for cheap subtrees or for props that change every time."
  question: react/performance/memoization
- id: compiler-package-and-release
  front: "What is the React Compiler's package, and since when is it stable?"
  back: "`babel-plugin-react-compiler`, stable since 1.0 in October 2025. It runs at build time."
  question: react/performance/react-compiler
- id: compiler-what-it-does
  front: "What does the React Compiler do to each component and hook?"
  back: "It works out which values depend on which props, state and context, and rewrites the function so each value, callback and JSX element is cached and recomputed only when its inputs change."
  question: react/performance/react-compiler
- id: compiler-skips-children
  front: "How does the compiler make React skip an unchanged child, without adding `memo`?"
  back: "The parent returns the same element object for the child, the same bailout `children` gets. It targets updates, not the first render, and can memoize where hooks can't, such as after an early return."
  question: react/performance/react-compiler
- id: compiler-requires-rules-of-react
  front: "Why does the compiler require the Rules of React?"
  back: "Caching is only safe for code that gives the same result anyway: pure render (no `Date.now()`, `Math.random()`, `ref.current`, outside reassignment) and no mutation of props, state, hook arguments or JSX values."
  question: react/performance/react-compiler
- id: compiler-default-infer
  front: "In the default mode, which functions does the compiler compile?"
  back: "Functions named like components (PascalCase, returning JSX or calling hooks) or hooks (`use…`, calling hooks). A lowercase `renderRow` returning JSX is not compiled by default."
  question: react/performance/react-compiler
- id: compiler-bailout-silent
  front: "What does the compiler do on a violation it detects, and does the build say so?"
  back: "It bails out of that one function and leaves it as written; the rest of the file is still compiled. By default the bail-out is silent: the build passes and prints nothing."
  question: react/performance/react-compiler
- id: compiler-undetected-violation
  front: "What happens with a Rules of React violation the compiler can't detect?"
  back: "It is compiled, and behaviour can change. For example, `items.push('x')` on a prop was compiled with no lint rule firing."
  question: react/performance/react-compiler
- id: compiler-lint-plugin
  front: "Where do you see the problems the compiler's analysis finds, and does that need the compiler enabled?"
  back: "In the lint rules of `eslint-plugin-react-hooks` 7 (`refs`, `purity`, `globals`, `set-state-in-render`, and more). The 1.0 post notes they don't need the compiler."
  question: react/performance/react-compiler
- id: compiler-escape-hatches
  front: "What are the compiler's escape hatches?"
  back: "`\"use no memo\"` opts one function out; `compilationMode: 'annotation'` compiles only functions marked `\"use memo\"`. `useMemo` and `useCallback` stay for precise control, such as a stable effect dependency."
  question: react/performance/react-compiler
- id: compiler-date-now-compiled
  front: "In `babel-plugin-react-compiler` 1.0.0, what happened to `<p>{Date.now()}</p>` in render?"
  back: "It was compiled, and the timestamp froze behind a sentinel check; uncompiled it changed. This disagrees with the installation guide's claim that a lint error means the compiler skips the component. The `purity` lint rule warns."
  question: react/performance/react-compiler
- id: compiler-compiled-not-correct
  front: "Does \"compiled without errors\" mean the compiled component is correct?"
  back: "No. The compiler skips only what it detects; `Date.now()` in JSX was compiled and frozen."
  question: react/performance/react-compiler
- id: compiler-memoization-for-correctness
  front: "Why can code that relies on memoization for correctness break under the compiler?"
  back: "The docs list it as the main way the compiler breaks apps, and a compiler upgrade can change what is memoized. Pin an exact version."
  question: react/performance/react-compiler
- id: compiler-keep-existing-memo
  front: "Should you delete existing `useMemo` and `useCallback` when adopting the compiler?"
  back: "Leave them, or test carefully, since removing them can change the output. For new code the docs recommend relying on the compiler, using `useMemo`/`useCallback` where needed for precise control."
  question: react/performance/react-compiler
- id: compiler-does-not-do
  front: "What does the compiler not do?"
  back: "It doesn't optimize helpers outside components and hooks, share cached results between components, or split a coarse context."
  question: react/performance/react-compiler
- id: compiler-memo-needed
  front: "What do the docs say about `React.memo` once the compiler is enabled?"
  back: "\"When you enable React Compiler, you typically don't need React.memo anymore.\""
  question: react/performance/react-compiler
- id: compiler-verify-compiled
  front: "How do you check that a component was compiled?"
  back: "Its build output calls `_c(n)` and has cache checks. A `logger` reports a `CompileSuccess` or `CompileError` event per function. The docs mention a \"Memo ✨\" badge in React DevTools (not checked there)."
  question: react/performance/react-compiler
- id: compiler-older-react-target
  front: "How do you use the compiler with React 17 or 18?"
  back: "Set `target: '18'` (or `'17'`) and add `react-compiler-runtime` as a runtime dependency. With that target the output imports `c` from `react-compiler-runtime` instead of React 19's `react/compiler-runtime`."
  question: react/performance/react-compiler
- id: compiler-panic-threshold
  front: "What does `panicThreshold` change, and what do the docs say about production?"
  back: "What a detected violation does. Default `'none'` skips the function and continues; `'critical_errors'` and `'all_errors'` fail the build. Production builds should always use `'none'`."
  question: react/performance/react-compiler
- id: compiler-memo-cache-hook
  front: "What is `_c(n)` in compiled output, in React 19.3.1?"
  back: "React 19's `useMemoCache(n)`, an implementation detail: an array of `n` slots kept on the component's fiber, filled with `Symbol.for(\"react.memo_cache_sentinel\")` on mount."
  question: react/performance/react-compiler
- id: compiler-scope-blocks
  front: "How does the compiled output recompute a cached value?"
  back: "Each scope becomes one `if` block that recomputes when any reactive input differs by `!==`, otherwise reads the cache. Values with no reactive inputs are checked against a sentinel, so they are created once."
  question: react/performance/react-compiler
- id: compiler-plugin-order-hoisting
  front: "Where must the plugin run in the Babel pipeline, and what happens to functions that capture nothing?"
  back: "It must run first. Functions that capture nothing are hoisted out of the component as `_temp`."
  question: react/performance/react-compiler
- id: compiler-existing-use-memo
  front: "What does the compiler do with existing `useMemo` calls?"
  back: "Compiles them into ordinary cache slots after checking that the dependencies it infers match those written. If they don't, it skips the function: \"Existing memoization could not be preserved\"."
  question: react/performance/react-compiler
- id: compiler-modes
  front: "With `compilationMode`, which functions compile in `'infer'`, `'annotation'` and `'all'`: a plain component, a lowercase `renderRow` returning JSX, and `total()` marked `\"use memo\"`?"
  back: "Component: `'infer'` and `'all'` yes, `'annotation'` no. `renderRow`: only `'all'`. `total()` with `\"use memo\"`: all three. A component with `\"use no memo\"` is never compiled."
  question: react/performance/react-compiler
- id: compiler-violations-skipped
  front: "In compiler 1.0.0, which render violations were skipped, with the matching lint rule?"
  back: "`ref.current++` (`refs`), reassigning a module variable (`globals`), `setN(n + 1)` (`set-state-in-render`), `useState` inside `if` (`rules-of-hooks`), and a `useMemo` it can't preserve (`exhaustive-deps`)."
  question: react/performance/react-compiler
- id: compiler-seeing-skips
  front: "How can you see which functions the compiler skipped under `panicThreshold: 'none'`?"
  back: "Use a `logger`: it receives `CompileError` events with a `reason`, category and location, and `CompileSkip` for `\"use no memo\"`."
  question: react/performance/react-compiler
- id: compiler-adoption-steps
  front: "How should you adopt the compiler in an existing app?"
  back: "Install `eslint-plugin-react-hooks` 7 first and fix what it reports; enable the compiler in stages (`'annotation'`, `\"use memo\"`, or `\"use no memo\"`); keep existing memoization; pin an exact version if test coverage is thin."
  question: react/performance/react-compiler
- id: compiler-debug-misbehaving
  front: "A compiled component misbehaves. How do you find out whether the compiler is the cause?"
  back: "Add `\"use no memo\"`. If the bug disappears, look for a Rules of React violation, often code that relied on memoization; then remove the directive."
  question: react/performance/react-compiler
- id: compiler-tradeoffs
  front: "What does the compiler cost?"
  back: "A Babel step in the build, larger output, a cache per component, and compiled code that's harder to step through. It makes the Rules of React load-bearing: breaking them can now freeze a value."
  question: react/performance/react-compiler
- id: compiler-hook-not-cached-exercise
  front: "`useTotal(items)` calls no hooks and does a `reduce`. Does it run again when the parent re-renders with the same `items`, under the compiler?"
  back: "Yes, every render: with no hook calls it isn't compiled in `'infer'` mode, and the compiler didn't cache the call in the component. Renamed `getTotal`, the call was cached on `items` (Chrome 156 and Firefox 159, both builds)."
  question: react/performance/react-compiler
- id: profiling-three-tools
  front: "What are the three tools for finding slow React renders?"
  back: "The React DevTools Profiler extension, React Performance Tracks (React 19.2) in the browser's Performance panel, and `<Profiler id onRender>` for collecting timings in code."
  question: react/performance/profiling
- id: profiling-devtools-profiler
  front: "What does the React DevTools Profiler show for each commit?"
  back: "A flame chart and ranked chart of the components that rendered and their durations. A setting records why each rendered (which props, state or hooks changed); another highlights components on screen as they render."
  question: react/performance/profiling
- id: profiling-performance-tracks
  front: "What do React 19.2 Performance Tracks add to the browser's Performance panel?"
  back: "A Scheduler ⚛ track (each update's priority, with Render, Commit and effects phases) and a Components ⚛ flame graph, next to the browser's main-thread data."
  question: react/performance/profiling
- id: profiling-tracks-dev-details
  front: "What extra does a Performance Tracks entry show in development?"
  back: "Clicking a render shows its changed props, and an update shows which component's `setState` scheduled it."
  question: react/performance/profiling
- id: profiling-on-render-signature
  front: "What arguments does `<Profiler onRender>` receive?"
  back: "`onRender(id, phase, actualDuration, baseDuration, startTime, commitTime)`, called after each commit. Use it for tests, dashboards and before/after comparisons."
  question: react/performance/profiling
- id: profiling-three-render-causes
  front: "What are the three causes of a component rendering, and what does a new object each render look like in the profiler?"
  back: "Its own state, its parent rendering, or a context it reads. A new object each render shows up as a changed prop. \"Parent rendered, props deeply equal\" is what `memo` or the compiler fixes."
  question: react/performance/profiling
- id: profiling-builds
  front: "In which builds do the Profiler tools work, and which build should supply durations?"
  back: "Development and the profiling build (`react-dom/profiling`), not plain production. Development is slower and Strict Mode renders twice, so use it for which and why; use the profiling build for how long."
  question: react/performance/profiling
- id: profiling-on-render-in-production
  front: "What happens to `<Profiler onRender>` in a normal production build?"
  back: "It is never called, silently. Confirmed on React 19.3.1."
  question: react/performance/profiling
- id: profiling-ask-why-first
  front: "Why ask why a component rendered before speeding it up?"
  back: "Often the fix is to stop the render, not to make it cheaper."
  question: react/performance/profiling
- id: profiling-wrapper-overhead
  front: "What do the docs note about many `<Profiler>` wrappers?"
  back: "Each one adds CPU and memory overhead, so don't leave many in the tree."
  question: react/performance/profiling
- id: profiling-production-build
  front: "How do you profile a production build?"
  back: "Import `createRoot` from `react-dom/profiling` instead of `react-dom/client`, or alias it in the bundler. Then `onRender` fires and the Scheduler track appears; the Components track lists only components inside a `<Profiler>`."
  question: react/performance/profiling
- id: profiling-nested-update
  front: "What does the `\"nested-update\"` phase of `onRender` mean?"
  back: "The commit was for an update scheduled synchronously during the previous commit. `setWidth` in `useLayoutEffect` produced it; the same call in `useEffect` reported `\"update\"`."
  question: react/performance/profiling
- id: profiling-actual-vs-base
  front: "What are `actualDuration` and `baseDuration`?"
  back: "`actualDuration` is the time spent rendering the subtree in this commit. `baseDuration` estimates re-rendering all of it, from each component's most recent render time. A gap between them is memoization working."
  question: react/performance/profiling
- id: profiling-headless
  front: "Which profiling tools worked in headless tests?"
  back: "`<Profiler>` and Performance Tracks: the example ran in headless browsers and the tracks were read from a recorded Chrome trace. The DevTools extension's Profiler and render highlighting are interactive and weren't run."
  question: react/performance/profiling
- id: profiling-demo-durations
  front: "In the `Slow` / `MemoSlow` demo (5 ms of work), what durations did a click report on the profiling and development builds?"
  back: "Chrome 156: `actualDuration` 5.0–5.3 ms, `baseDuration` 10.2–11.0 ms. Firefox 159 reported whole milliseconds, 5–6 and 10–11. Only `Slow` rendered; `MemoSlow` was skipped. 6 page loads each, React 19.3.1."
  question: react/performance/profiling
- id: profiling-phase-logs
  front: "A `<Profiler>` around `App` and a `Measure` component calling `setWidth(1)` in `useLayoutEffect`: what phases are logged on mount and on a click?"
  back: "Mount: `mount`, then `nested-update`. Click: `update`."
  question: react/performance/profiling
- id: profiling-impl-timing
  front: "In React 19.3.1, how is `onRender`'s phase decided and how are the durations computed?"
  back: "After commit: `\"mount\"` if the `<Profiler>` is new, `\"update\"` otherwise, `\"nested-update\"` if the previous commit left a synchronous update pending. `actualDuration` sums fibers that rendered; skipped fibers keep their previous self-duration for `baseDuration`. Implementation detail."
  question: react/performance/profiling
- id: profiling-tracks-api
  front: "How does React write Performance Tracks, in 19.3.1?"
  back: "Through Chrome DevTools' extensibility API: `console.timeStamp` with a track name, or `performance.measure` with a `detail.devtools` object when an entry carries properties. The trace here was recorded in Chrome."
  question: react/performance/profiling
- id: profiling-tracks-by-build
  front: "Which tracks appeared in the Chrome trace for development, profiling with and without `<Profiler>`, and production builds?"
  back: "Development: Scheduler and Components. Profiling with `<Profiler>`: both. Profiling without `<Profiler>`: Scheduler only. Production: neither."
  question: react/performance/profiling
- id: profiling-scheduler-subtracks
  front: "What subtracks did the Scheduler ⚛ track have in the trace?"
  back: "Blocking, Transition, Suspense and Idle, with entries such as Event: click, Update, Render and Commit."
  question: react/performance/profiling
- id: profiling-changed-props-real
  front: "In the trace of a click with a changed `text` prop, what does the entry for `Label` list?"
  back: "Changed Props: `- text 0`, `+ text 1`. A real change. The `Update` entry names `App` with method `setState()` as the cause."
  question: react/performance/profiling
- id: profiling-changed-props-deep-equal
  front: "What does the trace say for a component given a new `style={{ color: 'teal' }}` object each render?"
  back: "Changed Props: `style`, \"Referentially unequal but deeply equal objects. Consider memoization.\" (development build, Chrome 156). Hoist it, `useMemo` it, or let the compiler cache it."
  question: react/performance/profiling
- id: profiling-no-changed-props
  front: "What does a component with no props that rendered only because its parent did show in the trace?"
  back: "It renders with no changed props listed."
  question: react/performance/profiling
- id: profiling-deep-equal-warning
  front: "What does the 19.3.1 source flag about deeply equal props?"
  back: "Once per page load, a component without an update of its own whose props were all deeply equal and whose render took over 100 ms: \"This component received deeply equal props. It might benefit from useMemo or the React Compiler in its owner.\""
  question: react/performance/profiling
- id: profiling-tool-tradeoffs
  front: "What are the trade-offs of the DevTools Profiler, Performance Tracks and `<Profiler>`?"
  back: "DevTools Profiler: quickest why per commit, interactive only. Tracks: React's work next to the main thread; changed props in development only; Chrome-recorded here. `<Profiler>`: programmatic and aggregable, but durations, not reasons."
  question: react/performance/profiling
# 08 Concurrent rendering
- id: fiber-what-it-is
  front: "What is Fiber, and what does each fiber represent?"
  back: "React's reconciler since React 16. Every component instance and host element (`<li>`, a text node) gets a fiber: a plain object that is one unit of work."
  question: react/concurrent-rendering/fiber
- id: fiber-tree-links
  front: "Which three fiber fields link it to the rest of the tree?"
  back: "`return` (parent), `child` (first child) and `sibling` (next sibling)."
  question: react/concurrent-rendering/fiber
- id: fiber-identity-fields
  front: "Which fiber fields say what it is?"
  back: "`tag`, `type`, `key` and `stateNode` (the DOM node or class instance)."
  question: react/concurrent-rendering/fiber
- id: fiber-work-fields
  front: "Which fiber fields hold inputs and results, and pending work?"
  back: "Inputs and results: `pendingProps`, `memoizedProps`, `memoizedState`, `updateQueue`. Pending work: `lanes` and `childLanes` (priorities of queued updates) and `flags` (what the commit must do)."
  question: react/concurrent-rendering/fiber
- id: fiber-stack-reconciler-problem
  front: "Why couldn't the React 15 stack reconciler pause?"
  back: "It rendered by recursion, so the work lived on the JavaScript call stack and ran until the stack unwound. A large update blocked input and animation frames, and couldn't be paused, prioritized or abandoned."
  question: react/concurrent-rendering/fiber
- id: fiber-virtual-stack-frames
  front: "How does Fiber replace the call stack?"
  back: "It reimplements the stack as linked heap objects, \"virtual stack frames\" in Andrew Clark's 2016 notes. A loop walks one fiber per step, so React can check the clock, yield, resume, restart with newer state or drop the work."
  question: react/concurrent-rendering/fiber
- id: fiber-two-trees
  front: "What are the current and work-in-progress trees?"
  back: "Current matches the screen. Work-in-progress is built for the next render by reusing each fiber's `alternate`. The commit makes the finished tree current by swapping one pointer, so an abandoned render leaves the screen untouched."
  question: react/concurrent-rendering/fiber
- id: fiber-not-the-feature
  front: "Is Fiber the same as concurrent rendering?"
  back: "No. Every React since 16 uses Fiber, but React 16 shipped with asynchronous rendering off; React 18's concurrent features were the first stable APIs to use pausing. Most updates still render without pausing."
  question: react/concurrent-rendering/fiber
- id: fiber-not-multithreaded
  front: "Did Fiber make React multithreaded?"
  back: "No. Rendering still runs on the main thread; Fiber only lets that thread stop between components and resume."
  question: react/concurrent-rendering/fiber
- id: fiber-unit-is-component
  front: "Can React pause inside a component's render?"
  back: "No. The unit of work is a whole fiber. One component computing for 100 ms under a transition was still one 100 ms long task in Chrome 156."
  question: react/concurrent-rendering/fiber
- id: fiber-internals-unstable
  front: "Why not build on fiber internals?"
  back: "Field names change between versions. The 2016 notes describe `pendingWorkPriority` and `output` fields that React 19.3.1 no longer has. `__reactFiber$` is fine in a debugging console only."
  question: react/concurrent-rendering/fiber
- id: fiber-demo-alternate
  front: "In the `<ul>` demo, what do a `<li>`'s fiber and its `alternate` show after mount, the first click and the second click?"
  back: "After mount `alternate` is `null`. The first update builds `a1` in a new object; the second reuses the original object for `a2`. Two copies alternate between current and work-in-progress (Chrome 156, Firefox 159, React 19.3.1)."
  question: react/concurrent-rendering/fiber
- id: fiber-why-links-not-array
  front: "Why does Fiber use child, sibling and parent links instead of an array of children?"
  back: "So the walk can stop and resume from one pointer. The loop keeps the next fiber in `workInProgress`, and the links let it go down, across and back up without recursion or a separate stack."
  question: react/concurrent-rendering/fiber
- id: fiber-lanes
  front: "What replaced the priority field from the 2016 design notes?"
  back: "Lanes: each update gets one bit of a 31-bit mask (sync, continuous input, default, 14 transition lanes, retry, idle, offscreen and more). Fibers store pending lanes as masks, so one render can process several priorities and tests are bitwise `&`."
  question: react/concurrent-rendering/fiber
- id: fiber-enabled-besides-scheduling
  front: "What did Fiber enable besides scheduling?"
  back: "React 16's release notes credit it with error boundaries and fragments, and it is the base for Suspense and `<Activity>`. Frames kept as objects let React unwind to a boundary or keep a hidden subtree's fibers."
  question: react/concurrent-rendering/fiber
- id: fiber-work-loop
  front: "What does the concurrent work loop look like in React 19.3.1?"
  back: "`while (workInProgress !== null && !shouldYield()) performUnitOfWork(workInProgress)`. `workLoopSync` is the same loop without `shouldYield()`; the update's lanes decide which is used."
  question: react/concurrent-rendering/fiber
- id: fiber-begin-work
  front: "What does `beginWork` do, and when does it skip a subtree?"
  back: "It calls the component, reconciles the returned elements against current children and returns the first child fiber. If neither the fiber nor any descendant has work in this render's lanes (`lanes`, `childLanes`, bitwise test), it skips the subtree."
  question: react/concurrent-rendering/fiber
- id: fiber-complete-work
  front: "What does `completeUnitOfWork` do?"
  back: "It runs when a fiber has no children left: creates or prepares the DOM node off screen, merges children's `flags` into `subtreeFlags`, then moves to `sibling`, or to `return` when there is none."
  question: react/concurrent-rendering/fiber
- id: fiber-yield-is-leaving-loop
  front: "Why is yielding cheap in Fiber?"
  back: "The state of the walk is one variable, `workInProgress`. Yielding is leaving the loop; resuming is entering it again."
  question: react/concurrent-rendering/fiber
- id: fiber-create-work-in-progress
  front: "What does `createWorkInProgress` do, and when does `root.current` swap?"
  back: "It returns a current fiber's `alternate`, creating it only the first time, because at most two versions of the tree are needed. `root.current = finishedWork` swaps after the mutation phase and before the layout phase."
  question: react/concurrent-rendering/fiber
- id: fiber-commit-swap-timing
  front: "Why does the tree swap fall between the mutation and layout phases?"
  back: "So `componentWillUnmount` still sees the old tree and `componentDidMount` the new one."
  question: react/concurrent-rendering/fiber
- id: fiber-text-child
  front: "Does `<li>{label}</li>` with a string have a child fiber for the text?"
  back: "No. In the test `fiber.child` was `null`: React sets a lone string as the element's text directly."
  question: react/concurrent-rendering/fiber
- id: fiber-hook-list
  front: "Where does a function component's hook list live, and why can't hooks be conditional?"
  back: "In `memoizedState` on the fiber: the first hook, each linking to the next. It is matched by call order, which is why hooks can't be called conditionally."
  question: react/concurrent-rendering/fiber
- id: fiber-tradeoff
  front: "What does Fiber cost, and what is the contract for application code?"
  back: "Two objects per element instead of a stack frame, about two dozen fields each, and a harder-to-follow loop. Because a render may be paused, repeated or discarded, components must be pure; Strict Mode checks by rendering twice in development."
  question: react/concurrent-rendering/fiber
- id: concurrent-definition
  front: "What does concurrent rendering mean?"
  back: "Rendering is interruptible. It isn't parallelism: React still runs on the main thread, one piece at a time, but a render no longer has to finish once started."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-pause-resume-abandon
  front: "What can React do with an in-progress render?"
  back: "Pause it every few milliseconds so the browser can handle events and paint, resume where it left off, or abandon it and start over when a more urgent update arrives."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-why-safe
  front: "Why is interrupting a render safe, and what is the price?"
  back: "Rendering has no visible effects: React touches the DOM only in the commit, which is synchronous and uninterruptible. The price is that components must be pure, since a render may run several times or never commit."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-commit-uninterruptible
  front: "Why can't the commit be interrupted?"
  back: "It mutates the DOM and runs layout effects. Stopping halfway would show a half-updated page, so React applies the whole finished tree in one synchronous pass."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-priority-order
  front: "In what order of urgency does React rank discrete input, continuous input and default updates?"
  back: "Discrete input (click, keydown, input) first, then continuous input (mousemove, scroll), then default updates (timers, network callbacks). These render without yielding."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-non-urgent-updates
  front: "Which updates does React render in interruptible slices?"
  back: "Transitions, `useDeferredValue` re-renders, Suspense retries and hidden `<Activity>` content. A click or keystroke arriving meanwhile is handled first, then the stale work restarts."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-opt-in
  front: "Does `createRoot` alone make rendering interruptible?"
  back: "No. By default updates behave like React 17; a click or `setTimeout` update rendered 200 slow items in one task (100 ms in Chrome 156). Concurrency is used only where you use a concurrent feature."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-mode-dropped
  front: "What did React 18 change about \"concurrent mode\"?"
  back: "It was replaced by concurrent features. The working group found most value came from APIs like `startTransition`, so default updates stayed synchronous and apps adopt concurrency per update, not per root."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-not-faster
  front: "Does concurrent rendering make updates faster?"
  back: "No. The same render took about 100 ms either way; time slicing spreads it across tasks so input and frames get through. Interrupted work is redone, so total work can increase."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-demo-result
  front: "Click Slow (a transition), then Fast 30 ms later. How many items had the transition rendered, and what committed?"
  back: "59–69 items in Chrome, 30–35 in Firefox (1 ms per item on its coarser clock). React discarded them, committed `count=1 value=0`, then rendered all 200 items for `count=1 value=1`. React 19.3.1, both builds."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-lane-from-event
  front: "How does React DOM pick an update's lane from the browser event?"
  back: "`click`, `keydown`, `input` map to the sync lane; `mousemove`, `scroll`, `wheel` to the continuous lane; anything outside an event (a timer, a resolved promise) to the default lane. `startTransition` assigns a transition lane."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-sync-flush
  front: "When is sync-lane work flushed, and what happens to everything else?"
  back: "Sync work is flushed in a microtask after the event. Everything else becomes a task in React's scheduler."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-should-time-slice
  front: "In 19.3.1, when does `performWorkOnRoot` time-slice?"
  back: "When not forced sync, the lanes include no blocking lane (sync, continuous input, default), and none is expired; or when the root is prerendering. Otherwise it renders synchronously."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-task-counts
  front: "For 200 items of 0.5 ms (production), how many tasks and frames occurred for a click `setState`, a `setTimeout` `setState`, and a click `startTransition`?"
  back: "Click and timeout: 1 task, 0 frames. Transition: 21 tasks and 6 frames in Chrome; 40–41 tasks and 9–11 frames in Firefox."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-slice-length
  front: "How long were transition slices, and why did Firefox renders take twice as long?"
  back: "About 5 ms each. Firefox's coarser clock made each item take 1 ms instead of 0.5 ms."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-interrupt-rebase
  front: "What happens to a transition's update when an urgent update interrupts its render?"
  back: "React drops the work-in-progress tree and renders the urgent update first. The transition's update stays queued and is rebased onto the new state in the next render."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-default-no-interrupt
  front: "Does a `setTimeout` update arriving mid-transition interrupt the transition?"
  back: "No. It is in the default lane, and `getNextLanes` keeps the in-progress transition render; the transition committed first (Chrome 156, Firefox 159, both builds). Only input-priority updates interrupt."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-starvation
  front: "When does a transition lane expire, and what changes then?"
  back: "5 s after it was scheduled; from then on the rest renders without yielding. With a 7 s transition in Chrome 156, slicing stopped at 5,004 ms and the remaining 2 s ran as one task."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-prerendering
  front: "Why does prerendering a suspended tree's siblings never block?"
  back: "It uses the concurrent loop even for sync lanes."
  question: react/concurrent-rendering/interruptible-rendering
- id: concurrent-25ms-flag
  front: "What does the 19.3.1 flag that is off in its builds change about transition slices?"
  back: "It would yield every 25 ms for transitions instead of every 5 ms, capping animations near 30 fps to favour finishing the render. The slice size is a tuning choice."
  question: react/concurrent-rendering/interruptible-rendering
- id: transition-use-transition-api
  front: "What does `useTransition()` return, and what does it mark?"
  back: "`[isPending, startTransition]`. Every setter called while the `startTransition` callback runs becomes a Transition, saying \"this update can wait\"."
  question: react/concurrent-rendering/transitions
- id: transition-stays-responsive
  front: "What happens to a Transition render when the user clicks or types during it?"
  back: "React handles the input first, discards the half-built tree and starts again with the newest state. An abandoned screen is never shown."
  question: react/concurrent-rendering/transitions
- id: transition-is-pending
  front: "When does `isPending` turn `true` and `false`?"
  back: "It turns `true` immediately and stays `true` until the Transition commits, so you can dim old content or show a spinner while it remains on screen."
  question: react/concurrent-rendering/transitions
- id: transition-suspense-keeps-content
  front: "What does a Transition do to an already-revealed Suspense boundary?"
  back: "It keeps the already-revealed content instead of falling back to a loading state."
  question: react/concurrent-rendering/transitions
- id: transition-no-delay
  front: "Does `startTransition` delay the callback or speed up rendering?"
  back: "Neither. The callback runs immediately and synchronously; only updates scheduled while it runs are marked. A setter in a `setTimeout` inside the callback is not a Transition."
  question: react/concurrent-rendering/transitions
- id: transition-need-setter
  front: "What do you use when you don't own the state setter, such as a prop?"
  back: "`useDeferredValue`. A Transition needs the state's setter."
  question: react/concurrent-rendering/transitions
- id: transition-text-input-rule
  front: "Why must a text input's state stay out of a Transition?"
  back: "Transition updates can't control a text input. React resets the controlled input to the old state right after the event; six keystrokes sent back to back left just `f` in Chrome 156."
  question: react/concurrent-rendering/transitions
- id: transition-standalone-import
  front: "What is the standalone `startTransition` import for, and what does it lack?"
  back: "Use outside components, such as routers and data libraries. It marks updates the same way but has no `isPending`; the Hook also routes an Action's error to the component's error boundary."
  question: react/concurrent-rendering/transitions
- id: transition-async-actions
  front: "How do async Transition callbacks work in React 19?"
  back: "The callback may be async; such a function is called an Action. `isPending` stays `true` until it finishes, and its Transition updates commit together at the end."
  question: react/concurrent-rendering/transitions
- id: transition-after-await
  front: "What happens to a setter called after an `await` in an async Transition?"
  back: "It is no longer a Transition and must be wrapped in another `startTransition`. Unwrapped, it was urgent: it committed 100 ms in while `isPending` was still `true`, showing a half-finished result."
  question: react/concurrent-rendering/transitions
- id: transition-after-await-why
  front: "Why does a setter after `await` lose the Transition, and what will change it?"
  back: "By then `startTransition` has returned and `ReactSharedInternals.T` is cleared, so React can't follow async context. The docs say this will change once JavaScript has `AsyncContext`."
  question: react/concurrent-rendering/transitions
- id: transition-wrapped-after-await
  front: "A second `startTransition` after `await` sets `page`; when does it commit?"
  back: "At the end of the whole Action (200 ms in the example), together with `isPending` becoming `false`, so the user never sees the new page without the finished state."
  question: react/concurrent-rendering/transitions
- id: transition-overlap
  front: "What happens when two Transitions overlap?"
  back: "The docs say React currently batches ongoing Transitions together. In the example the Posts and Contact updates rendered as one, and only `contact` committed."
  question: react/concurrent-rendering/transitions
- id: transition-demo-numbers
  front: "Click Posts then Contact 30 ms later: how long did the Contact click wait with and without a Transition?"
  back: "With a Transition: Posts abandoned after 64–68 posts (Chrome) or 29–35 (Firefox). With plain `setTab`: Contact was handled only after 108–109 ms (Chrome) or 206–217 ms (Firefox). React 19.3.1, three runs each."
  question: react/concurrent-rendering/transitions
- id: transition-one-slow-component
  front: "Does a Transition split one slow component?"
  back: "No. React yields between components, never inside one; a single 100 ms component is still a 100 ms task."
  question: react/concurrent-rendering/transitions
- id: transition-impl-flag
  front: "How is `startTransition` implemented in React 19.3.1?"
  back: "A flag, not a scheduler call: it calls `setIsPending(true)`, sets `ReactSharedInternals.T`, runs your callback, then `setIsPending(false)`. `requestUpdateLane` sees `T !== null` and returns a transition lane. Implementation details."
  question: react/concurrent-rendering/transitions
- id: transition-is-pending-two-updates
  front: "Why does `isPending=true` commit immediately while `setTab` waits?"
  back: "`isPending` is ordinary state updated twice. The `true` update has input priority and commits right away; the `false` update gets the Transition's lane and commits in the same render as your setter."
  question: react/concurrent-rendering/transitions
- id: transition-entangled-lane
  front: "Why do updates inside an Action wait for the whole Action?"
  back: "For an async callback the `false` value is a thenable that suspends the render until the Action ends. React reuses the same lane for every Transition started inside it (the entangled action lane)."
  question: react/concurrent-rendering/transitions
- id: transition-controlled-input-restore
  front: "How did the test show React restoring a controlled input's value?"
  back: "A listener on `document` already saw `\"\"` after typing `a`; the value came back only with the commit."
  question: react/concurrent-rendering/transitions
- id: transition-errors
  front: "How are errors from a `useTransition` callback surfaced?"
  back: "An error thrown, or a rejected promise from an async callback, is rethrown when the component renders, so the nearest error boundary shows it."
  question: react/concurrent-rendering/transitions
- id: transition-out-of-order
  front: "Do Actions in a Transition run in order?"
  back: "No guarantee: a slow earlier response can overwrite a newer one. The docs point to `useActionState` and `<form>` actions, which handle ordering."
  question: react/concurrent-rendering/transitions
- id: transition-search-split
  front: "In a search box, how do you split state with a Transition?"
  back: "Set the input's `text` urgently, and wrap `setQuery` in `startTransition`. In Chrome 156 (production) the input committed on every keystroke and results once, for the final query; Firefox 159's slower typing let every query commit."
  question: react/concurrent-rendering/transitions
- id: transition-tradeoff
  front: "What does a Transition cost?"
  back: "Extra renders: one for `isPending`, possibly several abandoned, and the final one, so total CPU goes up. The user sees stale content longer, and the slow part must be split into components React can yield between."
  question: react/concurrent-rendering/transitions
- id: deferred-what-it-does
  front: "What does `useDeferredValue(query)` return when `query` changes?"
  back: "The old value during the urgent render; then React re-renders in the background with the new value at Transition priority. A newer keystroke abandons that render and restarts with the newest value."
  question: react/concurrent-rendering/deferred-value
- id: deferred-vs-debounce-delay
  front: "How does the delay of `useDeferredValue` differ from a debounce?"
  back: "No fixed delay. The deferred render starts as soon as the urgent one commits, so on a fast machine the lag is barely visible and on a slow one it grows with the work."
  question: react/concurrent-rendering/deferred-value
- id: deferred-vs-debounce-interrupt
  front: "Why is a deferred render better than a debounced one for responsiveness?"
  back: "A debounced update still renders in one block when it fires, and input during that render waits. The deferred render yields between components and gives way to input."
  question: react/concurrent-rendering/deferred-value
- id: deferred-not-requests
  front: "Does `useDeferredValue` reduce network requests?"
  back: "No, it defers rendering only. A fetch per keystroke still happens; debounce or throttle requests. Combine them: defer the rendering of results, debounce the request."
  question: react/concurrent-rendering/deferred-value
- id: deferred-needs-memo
  front: "Why must the slow child be memoized with `useDeferredValue`?"
  back: "The urgent render passes the old deferred value, so a `memo` child sees unchanged props and is skipped. Without `memo` it renders twice per change: 1,163–1,410 item renders instead of 800, with no gain."
  question: react/concurrent-rendering/deferred-value
- id: deferred-fresh-object
  front: "What goes wrong with `useDeferredValue({ query })`?"
  back: "A new object every render never equals the last (`Object.is`), so every render schedules another background render. Use a primitive or an object created outside rendering."
  question: react/concurrent-rendering/deferred-value
- id: deferred-vs-start-transition
  front: "When use `useDeferredValue` instead of `startTransition`?"
  back: "When you don't own the setter, such as a prop. With the setter, `startTransition` does the same job. Mechanically the background render gets a Transition lane either way."
  question: react/concurrent-rendering/deferred-value
- id: deferred-show-stale
  front: "How do you show that the deferred value is stale?"
  back: "Compare `query !== deferredQuery`, for example to dim the list."
  question: react/concurrent-rendering/deferred-value
- id: deferred-initial-value
  front: "What does the React 19 `initialValue` argument do?"
  back: "On mount the component first renders with `initialValue`, then re-renders in the background with the real value. Without it there's no older value, so the first render isn't deferred."
  question: react/concurrent-rendering/deferred-value
- id: deferred-inside-transition
  front: "What does `useDeferredValue` do when the update is already a Transition?"
  back: "It returns the new value straight away: one render, `query=b deferred=b`."
  question: react/concurrent-rendering/deferred-value
- id: deferred-suspends
  front: "What happens if the deferred background render suspends?"
  back: "Per the docs the user keeps seeing the old deferred value rather than a Suspense fallback until the data loads. Effects of that render run only once it commits."
  question: react/concurrent-rendering/deferred-value
- id: deferred-demo-logs
  front: "In the `Search` demo with `useDeferredValue(query, '')`, what renders on mount and after typing `!`?"
  back: "Mount: `query=react deferred=` with `SlowList \"\"`, then `deferred=react` with `SlowList \"react\"`. Typing `!`: `query=react! deferred=react` skipping `SlowList`, then `deferred=react!` rendering it. Chrome 156, Firefox 159, React 19.3.1."
  question: react/concurrent-rendering/deferred-value
- id: deferred-typing-burst
  front: "Typing `XYZ` back to back in Chrome with the deferred demo: how many renders?"
  back: "Three urgent renders and a single `SlowList \"reactXYZ\"`."
  question: react/concurrent-rendering/deferred-value
- id: deferred-impl-lane
  front: "In 19.3.1, how does the Hook request the background render?"
  back: "It returns the old value and asks for a deferred lane: one of four Transition lanes reserved for deferred work, shared by every `useDeferredValue` in the render, or the offscreen lane in hidden content. Implementation detail."
  question: react/concurrent-rendering/deferred-value
- id: deferred-measure-plain
  front: "Eight keystrokes 30 ms apart over 100 items of 0.5 ms with plain state (production): key-to-frame, list commits, item renders?"
  back: "Chrome 51 ms, Firefox 100–101 ms median key-to-frame; 8 commits; 800 item renders. Settled in 50 ms and 100 ms. Firefox's coarser clock made each item take 1 ms."
  question: react/concurrent-rendering/deferred-value
- id: deferred-measure-deferred-memo
  front: "Same benchmark with `useDeferredValue` plus `memo`: key-to-frame, commits, item renders?"
  back: "Key-to-frame 5–7 ms (Chrome) and 6–15 ms (Firefox); 1 list commit; 469–519 item renders (Chrome), 369–373 (Firefox); settled in 66–67 ms and 106 ms."
  question: react/concurrent-rendering/deferred-value
- id: deferred-measure-no-memo
  front: "Same benchmark with `useDeferredValue` but no `memo`: what happened?"
  back: "No responsiveness gain: key-to-frame 50 ms and 100 ms, 9 list commits, 1,390–1,410 item renders (Chrome) and 1,163–1,165 (Firefox), settled in 102–110 and 200–208 ms."
  question: react/concurrent-rendering/deferred-value
- id: deferred-measure-debounce
  front: "Same benchmark with a 300 ms debounce plus `memo`: what were the trade-offs?"
  back: "Fewest item renders (100) and one commit, but settled in 353 ms (Chrome) and 403 ms (Firefox), then rendered in one block, freezing a frame: longest gap 33 / 100 ms."
  question: react/concurrent-rendering/deferred-value
- id: deferred-tradeoff
  front: "What are the trade-offs of `useDeferredValue` versus a debounce?"
  back: "`useDeferredValue` adapts to the device and keeps input responsive, but wastes CPU on abandoned renders, needs memoization, and can't reduce I/O. A debounce is predictable and cheap for requests, but adds a fixed delay and isn't interruptible."
  question: react/concurrent-rendering/deferred-value
- id: scheduler-what-it-is
  front: "What is React's `scheduler`, and how does it relate to the browser's `scheduler.postTask()`?"
  back: "React's own cooperative scheduler npm package: internal, with no finalized public API, and unrelated to the browser's `scheduler.postTask()`. A spy on `postTask` counted zero calls during a Transition."
  question: react/concurrent-rendering/scheduler
- id: scheduler-priorities
  front: "Which scheduler priorities does React use, and what timeouts?"
  back: "User-blocking for input lanes, normal for default updates, Transitions and retries, idle for the idle lane. The timeouts are 250 ms, 5 s and never. Tasks wait in a min-heap ordered by expiration time."
  question: react/concurrent-rendering/scheduler
- id: scheduler-message-channel
  front: "How does the scheduler get the browser to run its tasks?"
  back: "It posts a message on a `MessageChannel` and runs queued callbacks in the message handler. Not `setTimeout(fn, 0)`, because of the 4 ms clamp on nested timers; not `requestAnimationFrame`, since work needn't line up with frames."
  question: react/concurrent-rendering/scheduler
- id: scheduler-should-yield
  front: "When does `shouldYield()` return `true`?"
  back: "Once 5 ms (`frameYieldMs`) have passed since the browser task started, or straight after a commit so the browser can paint. React calls it before every fiber."
  question: react/concurrent-rendering/scheduler
- id: scheduler-continuation
  front: "What happens when React yields mid-render?"
  back: "It stops, keeping its place in `workInProgress`, and returns a continuation. The scheduler keeps the same task, posts another message and returns, ending the browser task; input and rendering run, then work resumes."
  question: react/concurrent-rendering/scheduler
- id: scheduler-sync-no-path
  front: "Which work skips the scheduler slicing path?"
  back: "Sync-lane updates (click, keydown, input) render in the event's own task. Blocking lanes that become scheduler tasks, like a `setTimeout` update, render without calling `shouldYield()`. Only Transitions, deferred values, retries and hidden work are sliced."
  question: react/concurrent-rendering/scheduler
- id: scheduler-expired
  front: "What happens to a scheduler task past its timeout?"
  back: "It runs without yielding, so starved updates finish. `performWorkOnRootViaSchedulerTask` receives `didTimeout`; when `true`, React renders synchronously."
  question: react/concurrent-rendering/scheduler
- id: scheduler-cooperative
  front: "Why is the scheduler called cooperative?"
  back: "It stops only between components, never inside one."
  question: react/concurrent-rendering/scheduler
- id: scheduler-demo-counts
  front: "In the 200-item demo (Chrome 156, production), how many slices and messages for a transition versus an urgent update?"
  back: "Transition: 21 slices, 22 messages, longest 5 ms. Urgent `setValue`: 1 slice, 0 messages, longest 100 ms. Firefox 159: 40 slices, 42 messages (once 41), longest 200 ms for the urgent update."
  question: react/concurrent-rendering/scheduler
- id: scheduler-trace
  front: "What did the Chrome trace show for the transition, and why the spare message?"
  back: "21 `performWorkUntilDeadline` calls of 4.9–5.1 ms, the last 2.0 ms. The spare messages started scheduler work queued after the commit; development builds posted one more."
  question: react/concurrent-rendering/scheduler
- id: scheduler-frames-between
  front: "Do scheduler slices match animation frames?"
  back: "No. It yields every 5 ms regardless of frame timing; during the 100 ms Transition, Chrome still ran 6 animation frames, in the gaps between slices."
  question: react/concurrent-rendering/scheduler
- id: scheduler-unstable-apis
  front: "Should app code import the `unstable_` scheduler APIs?"
  back: "No. They exist for React; use `startTransition` or the browser's `scheduler.yield()` instead."
  question: react/concurrent-rendering/scheduler
- id: scheduler-timeout-fallback-cost
  front: "What happened when `MessageChannel` was deleted so the scheduler fell back to `setTimeout`?"
  back: "The 100 ms Transition took 175 ms in Chrome and 334 ms in Firefox, instead of 101 and 202. Slices stayed 5 ms but gaps grew to 3–5 ms: the timer clamp at work."
  question: react/concurrent-rendering/scheduler
- id: scheduler-post-task-build
  front: "Does React use `scheduler.postTask()` where it exists?"
  back: "Not by default. The package ships a `scheduler/unstable_post_task` build mapping priorities to `user-blocking`, `user-visible` and `background`, but `react-dom` 19.3.1 requires plain `scheduler`, the `MessageChannel` build."
  question: react/concurrent-rendering/scheduler
- id: scheduler-yield-after-commit
  front: "Why yield right after a commit?"
  back: "React calls `requestPaint()` during the commit, which sets `needsPaint`. The next `shouldYield()` returns `true` regardless of time left, so the browser can paint before more work runs."
  question: react/concurrent-rendering/scheduler
- id: scheduler-work-loop
  front: "In the scheduler's `workLoop`, when does it break out, and what does a function return from `task.callback` mean?"
  back: "It breaks when the task hasn't expired and `shouldYieldToHost()` is true. A function returned is React's continuation: the task keeps it and the loop returns `true` to yield. Simplified from 19.3.1; implementation detail."
  question: react/concurrent-rendering/scheduler
- id: scheduler-lane-to-priority
  front: "How does React map a root's lanes to a scheduler priority?"
  back: "`lanesToEventPriority` maps the highest lane to an event priority, then to a scheduler priority. Transition lanes count as default, so they get `NormalPriority` and its 5 s timeout."
  question: react/concurrent-rendering/scheduler
- id: scheduler-immediate-unused
  front: "Is the scheduler's `ImmediatePriority` used for rendering?"
  back: "No. A source comment explains that sync work now goes through microtasks."
  question: react/concurrent-rendering/scheduler
- id: scheduler-host-fallbacks
  front: "In what order does the browser build pick its host mechanism?"
  back: "`setImmediate` if it exists (Node.js, old IE), then `MessageChannel`, then `setTimeout`."
  question: react/concurrent-rendering/scheduler
- id: scheduler-back-to-back
  front: "With nothing else queued, how soon does the next slice run in Chrome?"
  back: "Within 0.3 ms: yielding costs little when the browser has nothing to do."
  question: react/concurrent-rendering/scheduler
- id: scheduler-force-frame-rate
  front: "What does `unstable_forceFrameRate(fps)` do?"
  back: "Changes the 5 ms interval to `1000 / fps`. It is an unstable export, not something React calls."
  question: react/concurrent-rendering/scheduler
- id: scheduler-tradeoff
  front: "What is the trade-off of a fixed 5 ms slice and a `MessageChannel` message?"
  back: "Input waits at most one slice plus one component, but each yield has overhead and total time grows if the browser has other work. A message has no priority, so React's priorities exist only in its own queue."
  question: react/concurrent-rendering/scheduler
- id: viewtransition-what
  front: "What does `<ViewTransition>` do, and since which React version is it stable?"
  back: "Stable since React 19.3. It marks part of the tree for React to animate with the browser's View Transitions API: React decides when and which elements; the browser captures and animates."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-which-updates
  front: "Which updates animate a `<ViewTransition>`?"
  back: "Only non-urgent ones: updates inside `startTransition`, `useDeferredValue` updates and Suspense boundaries revealing content. A plain `setState` from a click commits with no animation."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-mechanism
  front: "What does React do when a qualifying commit touches a boundary?"
  back: "It calls `document.startViewTransition()` and applies the DOM mutations inside its update callback."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-enter-exit
  front: "When does a boundary activate `enter` and `exit`, and what placement rule applies?"
  back: "`enter` when the boundary is inserted, `exit` when removed. It must come before any DOM node in the inserted subtree; one nested inside a new `<div>` doesn't count."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-update
  front: "When does a boundary get `update`?"
  back: "When React mutates DOM inside it, or it moves or resizes because of a sibling. A nested boundary takes the update instead of its parent."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-share
  front: "How does a `share` transition work?"
  back: "A boundary with a `name` is removed and another with the same `name` inserted in the same Transition; the browser morphs one into the other."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-names
  front: "How does React handle `view-transition-name`, and what should you do with `name`?"
  back: "React sets generated unique names inline on the boundary's nearest DOM nodes only while setting up, then removes them. Give `name` only for shared elements, unique among mounted boundaries; a duplicate is an error."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-classes
  front: "What can the `enter`, `exit`, `update`, `share` and `default` props take?"
  back: "`\"auto\"`, `\"none\"` or a class name, which React sets as `view-transition-class` so CSS can target `::view-transition-new(.slide-in)`. Or an object keyed by Transition type."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-transition-type
  front: "What does `addTransitionType` do?"
  back: "Called inside `startTransition`, it records the cause. React picks the matching class from an object-valued prop and passes the types to the browser."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-event-props
  front: "What are `onEnter`, `onExit`, `onUpdate` and `onShare` for?"
  back: "They hand you the pseudo-elements so you can animate with Web Animations instead of CSS."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-no-support
  front: "What happens in a browser without the View Transitions API?"
  back: "React commits normally, without animating. It calls `startViewTransition({ update, types })` in a `try` and treats a throw as no support; the options form needs Chrome 125, Firefox 147 or Safari 18.2."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-demo
  front: "In the toggle demo, what did Plain clicks versus Transition clicks do?"
  back: "Plain clicks never reached `startViewTransition`. Transition clicks called it with types `[\"toggle\"]`, animating `::view-transition-new(_t_0_)` then `::view-transition-old(_t_0_)`. `_t_0_` is a generated name. Chrome 156, Firefox 159, React 19.3.1."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-nested-in-inserted
  front: "What happened with `<div><ViewTransition>…` mounted in a Transition?"
  back: "React didn't call `startViewTransition` at all; the boundary was inside the inserted element."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-own-transitions
  front: "What happens if you start your own view transitions alongside React's?"
  back: "The docs say React interrupts any other running view transition; let React coordinate them."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-overlapping-updates
  front: "What if another update arrives during an animation?"
  back: "Per the docs React waits for the running transition, then batches everything that arrived into one: going A→B, then C and D, animates B→D next."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-effects-timing
  front: "When do effects run around a view transition?"
  back: "Per the docs, layout effects and refs run inside the update callback, before React measures layout; `useEffect` waits until the animation's `finished` promise, unless another update needs it sooner."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-activity
  front: "How does `<ViewTransition>` behave inside `<Activity>`?"
  back: "The boundary gets `enter` when the Activity becomes visible and `exit` when hidden, while its state is kept."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-commit-sequence
  front: "What commit sequence do the docs describe for a view transition?"
  back: "Call `getSnapshotBeforeUpdate`, set names, call `startViewTransition`; in its update callback apply mutations, wait for fonts, run layout effects, wait for a pending navigation, measure which boundaries moved. After `ready`, remove names and call event props. A mid-way `flushSync` skips the animation."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-observed-bookkeeping
  front: "What did spying on `startViewTransition` show about options and siblings?"
  back: "React always passed `{ update, types }`. Inserting an item above a named `<ViewTransition name=\"photo\">` also named `photo`, because the sibling moved it. `useDeferredValue` and a Suspense reveal each made one call; showing a fallback from a plain update made none."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-shared-morph
  front: "What produced a single `::view-transition-group(photo)` in the test?"
  back: "Swapping `<ViewTransition name=\"photo\"><h2>` for `<ViewTransition name=\"photo\"><h1>` in one Transition: the shared-element morph."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-types-per-commit
  front: "How long do `addTransitionType` types last?"
  back: "The docs say types reset after each commit, so a fallback shown during a Transition gets its types but the later reveal doesn't."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-waits
  front: "What does a `<ViewTransition>` wait for before animating?"
  back: "Like any Transition, React waits for data and new stylesheets; `<ViewTransition>` also waits up to 500 ms for fonts and visible images."
  question: react/concurrent-rendering/view-transition
- id: viewtransition-reduced-motion
  front: "Does React handle `prefers-reduced-motion` for `<ViewTransition>`?"
  back: "No. The docs recommend checking it in your animation CSS."
  question: react/concurrent-rendering/view-transition
# 09 Suspense
- id: suspense-what-suspending-means
  front: "What does it mean for a component to suspend?"
  back: "It can't finish rendering because something it needs isn't ready. React stops rendering it and walks up to the nearest `<Suspense>` boundary."
  question: react/suspense/suspense-mechanics
- id: suspense-what-suspends
  front: "What suspends a component, per the docs?"
  back: "Reading a pending promise with `use` (directly or via a Suspense-enabled framework), rendering a `lazy` component whose code hasn't loaded, and some resources React manages, such as a stylesheet rendered with `precedence`."
  question: react/suspense/suspense-mechanics
- id: suspense-effect-fetch-invisible
  front: "Does fetching in an Effect or event handler show the Suspense fallback?"
  back: "No. React never sees that promise. Only `use`, `lazy` and Suspense-enabled sources suspend."
  question: react/suspense/suspense-mechanics
- id: suspense-boundary-is-one-unit
  front: "What does a boundary show when one child suspends?"
  back: "Its `fallback` in place of all its children. Siblings that rendered fine are replaced too, and everything inside appears together."
  question: react/suspense/suspense-mechanics
- id: suspense-fallback-commits-first
  front: "Since React 19.0, when does the fallback commit relative to the suspended boundary's siblings?"
  back: "Immediately, without rendering the remaining siblings first. React then renders them in a separate pre-render pass so their `lazy` code and data requests start early. Before 19.0, siblings rendered first, so a slow sibling delayed the loading state."
  question: react/suspense/suspense-mechanics
- id: suspense-retry-from-scratch
  front: "What happens when the suspended promise settles?"
  back: "React retries the render from scratch: components that never mounted keep no state. If the promise rejects, the nearest error boundary takes over."
  question: react/suspense/suspense-mechanics
- id: suspense-reveal-throttle
  front: "How are Suspense reveals throttled?"
  back: "React reveals suspended content at most once every 300 ms, so boundaries that become ready close together appear at once instead of popping in one by one."
  question: react/suspense/suspense-mechanics
- id: suspense-nested-boundaries
  front: "Where should `<Suspense>` boundaries go?"
  back: "Where the design wants loading states, not around every component. Nest them for a loading sequence: outer fallback for the page shell, inner ones for slower panels."
  question: react/suspense/suspense-mechanics
- id: suspense-resuspend-visible
  front: "What happens when already-visible content suspends again?"
  back: "On an urgent update React hides it, cleans up its layout effects and shows the fallback again. During a Transition or `useDeferredValue` update it keeps the old content on screen."
  question: react/suspense/suspense-mechanics
- id: suspense-demo-log
  front: "In the `A`, `Data`, `B` demo, what does React render before the fallback commits?"
  back: "`A`, `Data`, then the fallback; `B` isn't rendered before the fallback commits. The pre-render then renders A, Data, B. `A` rendered three times and committed once. Chrome 156, Firefox 159, React 19.3.1, both builds."
  question: react/suspense/suspense-mechanics
- id: suspense-promise-in-render
  front: "Why must the promise not be created during render?"
  back: "A suspended render that never mounted starts over, so the promise is created again and the component never gets past it. Cache it."
  question: react/suspense/suspense-mechanics
- id: suspense-single-root-boundary
  front: "What is wrong with one boundary near the root?"
  back: "Any suspension deep in the page replaces the whole layout with a spinner."
  question: react/suspense/suspense-mechanics
- id: suspense-no-state-before-mount
  front: "What state does a component keep if it suspends before mounting?"
  back: "None. In the test a `useState` initializer ran three times before the first commit."
  question: react/suspense/suspense-mechanics
- id: suspense-no-boundary
  front: "What happens in a `createRoot` app with no `<Suspense>` boundary at all?"
  back: "The render waits without committing, with no error. The first render showed an empty container for 100 ms; a later `flushSync` update that suspended left the previous screen until its promise resolved."
  question: react/suspense/suspense-mechanics
- id: suspense-fallback-suspends
  front: "What if the fallback itself suspends?"
  back: "Per the docs it activates the next boundary up, so that boundary's fallback shows instead."
  question: react/suspense/suspense-mechanics
- id: suspense-throw-promise
  front: "Can you still throw a promise to suspend?"
  back: "It isn't a documented API. React 19.3.1 still treats a thrown thenable as a suspension, labelled deprecated in the source, with no warning in either build. Use `use`."
  question: react/suspense/suspense-mechanics
- id: suspense-server-streaming
  front: "How does Suspense work with streaming server rendering?"
  back: "The server sends fallbacks first and streams each boundary's HTML as it's ready; since 19.2 those reveals are batched like the client's."
  question: react/suspense/suspense-mechanics
- id: suspense-impl-use-throws
  front: "How does `use` suspend in React 19.3.1?"
  back: "On a pending promise it attaches handlers writing `status` and `value` (or `reason`) onto the promise, then throws a sentinel `SuspenseException` (\"Suspense Exception: This is not a real error!\"). `lazy` throws the same way. Implementation detail."
  question: react/suspense/suspense-mechanics
- id: suspense-impl-unwind
  front: "How does the work loop find the boundary when something suspends?"
  back: "`handleThrow` records why the render stopped; `throwException` finds the nearest boundary from the suspense handler stack, marks it to capture and attaches a listener to the promise. Rendering resumes at that boundary with its fallback."
  question: react/suspense/suspense-mechanics
- id: suspense-impl-retry-lane
  front: "How does the retry commit after the promise settles?"
  back: "The listener schedules a render on a retry lane. The component calls `use` again, the promise's `status` is `fulfilled`, and `use` returns `value` synchronously."
  question: react/suspense/suspense-mechanics
- id: suspense-impl-throttle
  front: "How does the 300 ms throttle work in 19.3.1?"
  back: "`globalMostRecentFallbackTime` is set when a commit switches a boundary between fallback and content. A render of only retries finishing earlier than 300 ms after that (`FALLBACK_THROTTLE_MS`) is held back until 300 ms have passed."
  question: react/suspense/suspense-mechanics
- id: suspense-throttle-measured
  front: "Outer data at 100 ms and inner at 200 ms: when does each reveal, and what if inner is at 450 ms?"
  back: "200 ms inner: both reveal in one commit at 302–311 ms, inner fallback never shown. 450 ms inner: outer at 303–311 ms with the inner fallback, inner at 604–614 ms, because the outer reveal restarted the window. Chrome 156, Firefox 159."
  question: react/suspense/suspense-mechanics
- id: suspense-resuspend-dom
  front: "What happened to the DOM and effects when an urgent `flushSync` update re-suspended a mounted component?"
  back: "The old DOM stayed, hidden with `display: none !important`, and its state was kept. The layout effect cleanup ran, but `useEffect` stayed set up until the dependency changed. Layout effects re-ran on reveal, 300 ms after the fallback appeared."
  question: react/suspense/suspense-mechanics
- id: suspense-dashboard-scenario
  front: "How should you place boundaries for a dashboard with three charts?"
  back: "One boundary per chart gives independent skeletons, and the throttle merges charts finishing within 300 ms into one reveal. Nest a page-level fallback outside. Make date changes a Transition so old charts stay visible."
  question: react/suspense/suspense-mechanics
- id: suspense-tradeoff
  front: "What does Suspense cost in return for moving loading states out of components?"
  back: "The data source must cache promises, a never-mounted component can't keep state across a retry, a misplaced boundary hides more UI than intended, and the throttle adds up to 300 ms of latency for fewer layout jumps."
  question: react/suspense/suspense-mechanics
- id: use-three-outcomes
  front: "What does `use(promise)` do when the promise is fulfilled, rejected or pending?"
  back: "Fulfilled: returns the value. Rejected: throws the reason to the nearest error boundary. Pending: the component suspends and the nearest `<Suspense>` shows its fallback."
  question: react/suspense/use-api
- id: use-pending-retry
  front: "What does React do with a pending promise passed to `use`?"
  back: "Attaches handlers recording `status` and `value` on the promise; when it settles, React renders the component again and `use` returns synchronously."
  question: react/suspense/use-api
- id: use-same-promise-required
  front: "Why must the promise be the same object on the retry?"
  back: "The second render has to receive the same promise to find it settled. A component that suspended before mounting has no state and reruns from scratch, so a promise created in render is a new pending one each time."
  question: react/suspense/use-api
- id: use-promise-in-render-loop
  front: "What happens with `use(fetch(url).then(…))` in render?"
  back: "A new pending promise each render: the component suspends, the new promise settles, it suspends again, and the content never appears. A mounted component that re-renders hits the same trap."
  question: react/suspense/use-api
- id: use-where-to-cache
  front: "Where can the promise for `use` come from?"
  back: "A cache keyed by input (a module-level `Map` or data library), a Suspense-enabled framework, a Server Component promise prop, or an event handler storing it in state inside `startTransition`."
  question: react/suspense/use-api
- id: use-not-quite-hook
  front: "How does `use` differ from Hooks in call rules?"
  back: "It must be called during render of a component or Hook, but may sit inside `if` blocks and loops, because it isn't stored in the component's Hook list. It may not sit inside `try`/`catch`."
  question: react/suspense/use-api
- id: use-try-catch
  front: "Why can't `use` be wrapped in `try`/`catch`?"
  back: "It suspends by throwing. The `catch` receives React's internal \"Suspense Exception: This is not a real error!\", so the error branch renders while data is merely loading. Handle rejections with an error boundary or a cached `promise.catch(…)`."
  question: react/suspense/use-api
- id: use-try-catch-lint
  front: "How do dev and lint report `use` inside `try`/`catch`?"
  back: "The development build logs \"`use` was called from inside a try/catch block.\" `eslint-plugin-react-hooks` 7.1.1 reports `React Hook \"use\" cannot be called in a try/catch block`."
  question: react/suspense/use-api
- id: use-status-check
  front: "Why not skip `use` once `promise.status === 'fulfilled'`?"
  back: "React 19.3.1 logged \"This library called use() to suspend in a previous render but did not call use() when it finished.\" Always call `use` for the promise itself."
  question: react/suspense/use-api
- id: use-context
  front: "What does `use(Context)` do?"
  back: "Reads context like `useContext`, also conditionally."
  question: react/suspense/use-api
- id: use-uncached-warning
  front: "When does \"A component was suspended by an uncached promise\" appear?"
  back: "Only when the new promise was already resolved, as with `Promise.resolve(data)`. With pending ones nothing was logged, even in a Transition (the old content simply stayed). Don't trust the warning."
  question: react/suspense/use-api
- id: use-demo-requests
  front: "In the cached versus uncached demo, what were the request counts and result after 1 s?"
  back: "Cached: 1 request, `user 1` shown. Uncached: 13 requests and still `loading`. Chrome 156, Firefox 159, React 19.3.1, both builds, no warning."
  question: react/suspense/use-api
- id: use-cache-never-forgets
  front: "What is the problem with a plain `Map` cache?"
  back: "It keeps stale data and grows; real apps need invalidation, which data-fetching libraries provide."
  question: react/suspense/use-api
- id: use-refetch
  front: "How do you refetch with `use`?"
  back: "In an event handler, drop the cache entry, start a new request and store the new promise in state inside `startTransition`. The component suspends but the Transition keeps the old content visible until it resolves."
  question: react/suspense/use-api
- id: use-vs-effect-fetch
  front: "Why prefer `use` to fetching in `useEffect`?"
  back: "An Effect fetch starts after the commit and needs its own loading, error and race handling. `use` hands loading to Suspense and errors to error boundaries. The request still has to start before render to avoid waterfalls."
  question: react/suspense/use-api
- id: use-server-promises
  front: "How do promises from the server reach `use`?"
  back: "A Server Component passes an unresolved promise as a prop and the Client Component reads it with `use`. Its resolved value must be serializable."
  question: react/suspense/use-api
- id: use-exercise-try-catch
  front: "A `Profile` wraps `use(promise)` in `try`/`catch` and renders \"Couldn't load\" in the `catch`. What does the user see?"
  back: "\"Couldn't load\", permanently, though the promise fulfils: `use` suspends by throwing, the `catch` swallowed it, and nothing rendered it again."
  question: react/suspense/use-api
- id: transitions-urgent-update
  front: "What happens when an urgent update makes an already-showing boundary suspend?"
  back: "React commits right away, hides the content and shows the fallback again. Navigating with a boundary near the root swaps the whole page for a spinner."
  question: react/suspense/suspense-and-transitions
- id: transitions-keep-old-ui
  front: "What does a Transition do when committing would hide already-revealed content behind a fallback?"
  back: "It doesn't commit. The old UI stays on screen and interactive, and the new UI appears once the data has loaded. With `useTransition`, `isPending` is `true` meanwhile."
  question: react/suspense/suspense-and-transitions
- id: transitions-deferred-value
  front: "What if the `useDeferredValue` background re-render suspends?"
  back: "It is a Transition too, so the user keeps seeing the stale value instead of a fallback."
  question: react/suspense/suspense-and-transitions
- id: transitions-new-boundary
  front: "Does a Transition wait for a `<Suspense>` that appears for the first time in this update?"
  back: "No. A new boundary shows its fallback immediately, so the new page renders its shell while slower sections load. Nothing was visible there, so a fallback hides nothing."
  question: react/suspense/suspense-and-transitions
- id: transitions-key-resets
  front: "How do you make navigating to a different profile show the fallback in a Transition?"
  back: "Give the boundary (or a parent) `key={userId}`. A new key makes it a new boundary, so it shows its fallback even in a Transition."
  question: react/suspense/suspense-and-transitions
- id: transitions-only-non-urgent
  front: "Does React ever delay an urgent render to avoid a fallback?"
  back: "No. Only non-urgent updates get this treatment. That is why Suspense-enabled routers wrap navigations in Transitions by default."
  question: react/suspense/suspense-and-transitions
- id: transitions-demo-log
  front: "In the Bob/Ann demo, how do the logs differ with and without `key={user}` on the boundary?"
  back: "Without: `commit ann true`, `show` Bob's bio, `commit bob false`; Ann's bio stays for 300 ms. With the key: spinner shown at once. With a plain `setUser` the spinner showed in both. Chrome 156, Firefox 159, React 19.3.1."
  question: react/suspense/suspense-and-transitions
- id: transitions-no-timeout
  front: "Is there a timeout on the old UI staying during a Transition?"
  back: "No. In a test a 5-second request kept the old page for 5 seconds. Use `isPending` to give feedback."
  question: react/suspense/suspense-and-transitions
- id: transitions-interactive-while-pending
  front: "Can the user interact while the Transition waits?"
  back: "Yes. A counter click 200 ms into a pending navigation committed at once over the old page with `isPending` still `true`; the navigation committed 300 ms later, keeping the new count."
  question: react/suspense/suspense-and-transitions
- id: transitions-nested-waterfall
  front: "In a Transition that reset the boundary with `key`, when did a nested section's request start in 19.3.1?"
  back: "Only after the outer data arrived (200 ms later): React didn't pre-render the nested section. Start requests in the event handler."
  question: react/suspense/suspense-and-transitions
- id: transitions-navigation-vs-deferred
  front: "Do the docs suggest `useTransition` or `useDeferredValue` for navigation?"
  back: "Transitions for navigation, usually inside the router; `useDeferredValue` in application code where one part may lag, such as search results under an urgent input."
  question: react/suspense/suspense-and-transitions
- id: transitions-exercise
  front: "A Transition opens `ArtistPage` inside an already-revealed outer boundary: `Biography` takes 200 ms, a new inner boundary's `Albums` takes 1,000 ms. What does the user see?"
  back: "Index stays; \"page loading\" never shows. At about 200 ms the page appears with \"albums loading\"; albums at 1,000 ms. Measured 202–218 ms and 1,005–1,019 ms (Chrome 156, Firefox 159)."
  question: react/suspense/suspense-and-transitions
- id: lazy-declaration
  front: "What does `lazy(() => import('./Chart.jsx'))` do at declaration?"
  back: "Nothing. React calls the loader the first time it renders the component; until the promise settles it suspends to the nearest `<Suspense>`."
  question: react/suspense/lazy
- id: lazy-splitting
  front: "Why does a dynamic `import()` shrink the main bundle?"
  back: "It is a split point: the module and whatever only it imports go into a separate chunk."
  question: react/suspense/lazy
- id: lazy-default-export
  front: "What must a `lazy` loader return?"
  back: "A promise or thenable resolving to an object whose `.default` is a component. For a named export: `import('./Chart.jsx').then((m) => ({ default: m.Chart }))`."
  question: react/suspense/lazy
- id: lazy-caching
  front: "How often does a `lazy` loader run, and what is cached?"
  back: "At most once per `lazy` type: React caches both promise and result, so remounting renders the component synchronously. A rejected load is cached too and goes to the nearest error boundary."
  question: react/suspense/lazy
- id: lazy-top-level
  front: "Why declare `lazy` at module top level?"
  back: "Each `lazy()` call creates a new component type with its own cache. Inside a component, every render calls the loader again and flashes the fallback for visible content; the docs say state gets reset."
  question: react/suspense/lazy
- id: lazy-inside-component-measured
  front: "What happened with `lazy` declared inside a component in the test, and was state lost?"
  back: "Every parent re-render called the loader again and flashed the fallback for about 300 ms. State survived, because React 19.3.1 compares a lazy type by the component it resolves to, but the docs say to expect resets."
  question: react/suspense/lazy
- id: lazy-avoid-loading-state
  front: "How can you avoid the loading state of a lazy component?"
  back: "Render it during a Transition inside a boundary already showing content, so the old UI stays until the code arrives; or pre-render it hidden in `<Activity>`, which loads the code ahead of time."
  question: react/suspense/lazy
- id: lazy-demo
  front: "In the esbuild-bundled demo, when was the `Chart` chunk requested and how did Toggle clicks behave?"
  back: "Right after `load called`, not at page load. First click showed \"loading chart\" until the chunk arrived; the third showed the chart at once with no request. Loader called once. esbuild 0.28, Chrome 156, Firefox 159."
  question: react/suspense/lazy
- id: lazy-no-default
  front: "What error do you get from a lazy module with no default export?"
  back: "Development: \"lazy: Expected the result of a dynamic import() call. Instead received: [object Module]\", then the error boundary got \"Element type is invalid. Received a promise that resolves to: undefined.\" Production: error #306."
  question: react/suspense/lazy
- id: lazy-failed-chunk
  front: "Does resetting an error boundary retry a failed chunk?"
  back: "No. It showed the same error and called no loader: the rejection is cached. Retry with a new `lazy` type or a page reload."
  question: react/suspense/lazy
- id: lazy-bare-preload
  front: "Does preloading with a bare `import()` on hover avoid the fallback?"
  back: "It saved the request, but the click still showed the fallback for about 300 ms: the loader's promise was pending at first render, and the reveal was throttled."
  question: react/suspense/lazy
- id: lazy-loader-any-thenable
  front: "Does a `lazy` loader have to call `import()`?"
  back: "No. React calls it with no arguments and accepts any promise or thenable resolving to an object with a `default` component, useful in tests and for adapting named exports."
  question: react/suspense/lazy
- id: lazy-no-boundary
  front: "What if there is no `<Suspense>` above a lazy component?"
  back: "It suspends to the nearest boundary further up. With none at all, a `createRoot` app commits nothing for that update until the code arrives."
  question: react/suspense/lazy
- id: lazy-vs-use
  front: "How does `lazy` differ from `use`?"
  back: "`lazy` suspends while a component's code loads and caches it per type; `use` suspends on a data promise you must cache yourself. Both use the same Suspense and error boundary machinery."
  question: react/suspense/lazy
- id: errorboundary-definition
  front: "What is an error boundary?"
  back: "A class component defining `static getDerivedStateFromError(error)`. When a descendant throws while React works on the tree, React unwinds to the nearest boundary and renders its fallback in place of that subtree."
  question: react/suspense/error-boundaries
- id: errorboundary-gdsfe
  front: "What are the rules for `getDerivedStateFromError`?"
  back: "It runs during rendering and returns state that switches to the fallback. It must be pure: React may call it more than once (it ran twice for one render error in both builds)."
  question: react/suspense/error-boundaries
- id: errorboundary-did-catch
  front: "What is `componentDidCatch(error, info)` for?"
  back: "It runs in the commit, once, for side effects such as reporting; `info.componentStack` says where it happened."
  question: react/suspense/error-boundaries
- id: errorboundary-two-methods
  front: "Why two methods instead of one?"
  back: "`getDerivedStateFromError` runs in the render phase so React can switch to the fallback before committing; it must stay pure. `componentDidCatch` runs after the commit, where side effects like logging are allowed."
  question: react/suspense/error-boundaries
- id: errorboundary-caught
  front: "Which errors does a boundary catch?"
  back: "Errors thrown while rendering descendants, in their lifecycle methods and Effects, from `use` with a rejected promise, from a failed `lazy` load, and from a Transition started with `useTransition`'s `startTransition`."
  question: react/suspense/error-boundaries
- id: errorboundary-not-caught
  front: "Which errors does a boundary not catch?"
  back: "Event handlers, asynchronous code (`setTimeout`, promise callbacks, code after `await`), the boundary's own errors (they go to the next boundary up), and server rendering (falls back to the nearest `<Suspense>`)."
  question: react/suspense/error-boundaries
- id: errorboundary-why-not-async
  front: "Why doesn't a boundary catch async errors?"
  back: "The JavaScript rule, not a React one: by the time the callback runs, React has finished calling your component, so there's no React stack frame left to catch the throw."
  question: react/suspense/error-boundaries
- id: errorboundary-no-hook
  front: "Is there a Hook equivalent of an error boundary in React 19.3.1?"
  back: "No. Write one boundary class (or use a library) and reuse it."
  question: react/suspense/error-boundaries
- id: errorboundary-uncaught-root
  front: "What happens to an uncaught error?"
  back: "It unmounts the whole root: the container is left empty."
  question: react/suspense/error-boundaries
- id: errorboundary-react19-reporting
  front: "How does React 19 report errors?"
  back: "Errors are no longer rethrown. Caught ones go to `console.error`, uncaught ones to `window.reportError` (firing the window `error` event). `createRoot`/`hydrateRoot` accept `onCaughtError`, `onUncaughtError` and `onRecoverableError`."
  question: react/suspense/error-boundaries
- id: errorboundary-handler-fix
  front: "How do you bring an async or event-handler error into a boundary?"
  back: "Rethrow it from a state update: `setState(() => { throw error; })` throws while React renders, where the boundary sees it. In the test the boundary showed \"profile failed\" and `onCaughtError` reported it, in both builds."
  question: react/suspense/error-boundaries
- id: errorboundary-demo-order
  front: "In the demo, what logged for Handler, Timeout and Render clicks, and in what order for the render error?"
  back: "Handler and Timeout: window `error` events, UI unchanged. Render: `onCaughtError`, then `componentDidCatch`, fallback shown. Chrome 156, Firefox 159, React 19.3.1, both builds, served from `http://localhost`."
  question: react/suspense/error-boundaries
- id: errorboundary-try-catch-jsx
  front: "Why doesn't wrapping JSX in `try`/`catch` work?"
  back: "Child components render later, so their errors never reach the `catch`. `eslint-plugin-react-hooks` 7.1.1 reports \"Avoid constructing JSX within try/catch\"."
  question: react/suspense/error-boundaries
- id: errorboundary-reset
  front: "How do you reset a boundary that is stuck on its fallback?"
  back: "Reset its state from a \"Try again\" button, or give it a `key` that changes on navigation."
  question: react/suspense/error-boundaries
- id: errorboundary-recoverable
  front: "What is `onRecoverableError` for?"
  back: "Errors React recovered from itself, such as a concurrent render that threw once and succeeded on synchronous retry, or hydration mismatches. The original error is in `error.cause`."
  question: react/suspense/error-boundaries
- id: errorboundary-sync-retry
  front: "What does React do before showing a boundary's fallback?"
  back: "It renders the failed lanes once more synchronously (`getLanesToRetrySynchronouslyOnError`, 19.3.1). A component that threw only on its first attempt rendered fine and `onRecoverableError` fired. It also explains `getDerivedStateFromError` running twice."
  question: react/suspense/error-boundaries
- id: errorboundary-impl-capture
  front: "How does React 19.3.1 find the boundary for a thrown error?"
  back: "The work loop walks up from the failing fiber to the first class with `getDerivedStateFromError`, or `componentDidCatch` that hasn't failed already in this batch. With none, the root gets `{ element: null }` and the uncaught handler. Implementation detail."
  question: react/suspense/error-boundaries
- id: errorboundary-handler-order
  front: "Why did `onCaughtError` log before `componentDidCatch`?"
  back: "The queued update's commit callback calls the root's caught-error handler first, then `componentDidCatch`."
  question: react/suspense/error-boundaries
- id: errorboundary-default-logging
  front: "What do the default handlers log for a caught error in development versus production?"
  back: "Development: one `console.error` with the error and \"The above error occurred in the <Buggy> component.\" plus a note that React will recreate the tree using the boundary. Production: `console.error(error)`."
  question: react/suspense/error-boundaries
- id: errorboundary-uncaught-logging
  front: "How do default handlers report uncaught and recoverable errors?"
  back: "Uncaught: `reportError(error)`, plus in development a `console.warn` suggesting a boundary. Recoverable: `reportError(error)`. Passing `onUncaughtError` replaces the default, so the window `error` event no longer fired. Caught errors never reached it."
  question: react/suspense/error-boundaries
- id: errorboundary-legacy
  front: "How did error reporting work before React 19?"
  back: "Errors in render were caught and rethrown, so a caught error showed up as an uncaught exception, and development logged the same error up to three times."
  question: react/suspense/error-boundaries
- id: errorboundary-thrown-from-table
  front: "Where do errors from a `useEffect` setup, the boundary's own `render`, and a rejected promise in an Effect go?"
  back: "`useEffect` setup: boundary fallback. The boundary's own `render`: parent boundary's fallback. A rejected promise in an Effect: `unhandledrejection`, UI unchanged. Chrome 156, Firefox 159."
  question: react/suspense/error-boundaries
- id: errorboundary-granularity
  front: "How should boundaries be placed in a dashboard?"
  back: "One around the app shell (reload page) and one per widget, so a crashing chart leaves the rest usable. Around every component hides failures in tiny broken rectangles; only at the root, one bad widget blanks the page."
  question: react/suspense/error-boundaries
# 10 Forms and actions
- id: input-who-owns-value
  front: "What is the difference between a controlled and an uncontrolled input?"
  back: "Who owns the current value. Uncontrolled: the DOM does, and you read it from a ref or `FormData`. Controlled: React state does, and the input displays exactly the `value` prop."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-default-value-initial-only
  front: "Does changing `defaultValue` in a later render change what an uncontrolled input displays?"
  back: "No. It only sets the initial value. To apply a new one, remount the input with a `key`, or make it controlled."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-controlled-restore-after-change
  front: "What happens to a keystroke on a controlled input if the `onChange` handler doesn't store the new text?"
  back: "It is undone. After the change event React re-renders and resets the DOM to the `value` prop."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-when-to-control
  front: "When should an input be controlled rather than uncontrolled?"
  back: "When the UI depends on the value while the user types: live validation, a character count, conditional fields, formatting, or a \"Clear\" button."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-checked-textarea-select-split
  front: "Does the controlled/uncontrolled split apply beyond text inputs?"
  back: "Yes: `checked`/`defaultChecked` on checkboxes and radios, and `<textarea>` and `<select>`, where `value`/`defaultValue` replace HTML's children and `selected`."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-value-without-onchange
  front: "What happens in development when you pass `value` without `onChange` to an input?"
  back: "It renders a read-only field and logs an error. Fix it with `onChange`, `readOnly`, or `defaultValue`."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-value-undefined-uncontrolled
  front: "What does `value={undefined}` mean, and why does `useState()` with no argument cause trouble for an input?"
  back: "`undefined` means uncontrolled. Starting with `useState()` and later setting a string switches the input to controlled, which React reports. Use `useState('')`."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-value-null-reported
  front: "Is `value={null}` on an input treated as empty? What should you use for \"empty\"?"
  back: "No, React reports `null` too. Use `''` for \"empty\", for example `value={text ?? ''}` for API data."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-sync-update-caret
  front: "What happens to the caret if the state setter in `onChange` runs after an `await`, in a `setTimeout`, or with a transformed value?"
  back: "React writes the DOM value back, and the browser moves the caret to the end. Update state synchronously with `e.target.value`."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-late-update-lost-keystrokes
  front: "Typing fast in a controlled input whose setter runs in `setTimeout(…, 50)`, what is lost?"
  back: "Each keystroke is reverted before the next arrives, so every keystroke replaces the previous one and only the last survives (Chrome 156 and Firefox 159, React 19.3.1)."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-microtask-too-late
  front: "Is `await null` before `setText(next)` early enough to avoid the caret jump in a controlled input?"
  back: "No. The restore step runs before the microtask, so the caret still ended at the end of the text (measured in Chrome 156 and Firefox 159, React 19.3.1)."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-transition-update-browser-difference
  front: "What happened when a controlled input's setter ran inside a Transition and six keys were typed back to back?"
  back: "Chrome 156 left just `f`; Firefox 159 kept all six. A Transition is the same kind of late update."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-restore-step-mechanics
  front: "How does React 19.3.1 restore controlled state after your `onChange` ran? (implementation detail)"
  back: "It flushes the sync work, then calls `restoreControlledState` with the committed props. `updateInput` writes `node.value` only when the DOM value disagrees with the `value` prop."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-uncontrolled-dirty-flag
  front: "Why does a new `defaultValue` not update an untouched uncontrolled input after mount?"
  back: "React assigns `node.value` from `defaultValue` at mount, which sets the browser's dirty value flag. Later changes only update the `value` attribute."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-controlled-dev-warnings
  front: "Which message does the React 19.3.1 development build log when an input goes from `undefined` to a string value?"
  back: "\"A component is changing an uncontrolled input to be controlled. This is likely caused by the value changing from undefined to a defined value, which should not happen.\" Production prints no warnings. The input still follows the new mode."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-uppercase-caret-fix
  front: "How do you keep a coupon field upper case without the caret jumping to the end?"
  back: "Keep the typed text and show it with CSS `text-transform: uppercase`, normalising on submit. Or save `selectionStart` in `onChange` and restore it with `setSelectionRange` in a `useLayoutEffect`, which runs before paint."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-reset-uncontrolled
  front: "How do you reset an uncontrolled input?"
  back: "Change its `key` (or a parent's) so a fresh input mounts with `defaultValue`, call `form.reset()`, or let a successful `<form action>` reset the form."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-file-never-controlled
  front: "Can `<input type=\"file\">` be controlled?"
  back: "No. Browsers don't let scripts set a file input's value, apart from clearing it. Read `files` from a ref, the change event or `FormData`."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-readonly-vs-disabled
  front: "What does `readOnly` change on an input, and how does it differ from `disabled` for form submission?"
  back: "The user can't edit it and React stops warning about `value` without `onChange`. A `readOnly` value is still sent with the form, unlike `disabled`."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: input-controlled-cost-deferred
  front: "What is the performance cost of a controlled input, and how can you reduce it?"
  back: "Its component re-renders on every keystroke. Keep the state in a small component, or use `useDeferredValue` for an expensive consumer. Uncontrolled fields avoid those renders."
  question: react/forms-and-actions/controlled-vs-uncontrolled
- id: action-definition
  front: "What is an Action in React 19, and what does that give you?"
  back: "A function run inside a Transition, usually async. React knows when it starts and ends, so `isPending` stays `true` until it finishes and its updates commit, and `useOptimistic` and `useActionState` can build on it."
  question: react/forms-and-actions/actions
- id: action-error-routing
  front: "Where does an error thrown in an Action go?"
  back: "To the nearest error boundary, with `useTransition` or a form action. The standalone `startTransition` reports it as uncaught."
  question: react/forms-and-actions/actions
- id: form-action-submit-steps
  front: "What does React do when a `<form action={fn}>` is submitted?"
  back: "It cancels the browser navigation, builds `new FormData(form, submitter)`, calls `fn(formData)` inside `startTransition`, marks the form pending for `useFormStatus`, and calls `form.reset()` after `fn` completes without throwing."
  question: react/forms-and-actions/actions
- id: form-action-reset-controlled
  front: "After a successful form action resets the form, which fields keep their values?"
  back: "Controlled fields keep their state; uncontrolled fields return to their `defaultValue`."
  question: react/forms-and-actions/actions
- id: form-action-string-action
  front: "What happens when `action` or `formAction` is a string instead of a function?"
  back: "It is ordinary HTML: the browser submits and navigates (for example `action=\"target.html\"` navigated to `target.html?q=react`)."
  question: react/forms-and-actions/actions
- id: form-button-formaction-override
  front: "How do you override a form's action for one submit button?"
  back: "Give the `<button>` (or `<input type=\"submit\">`) a `formAction`. It replaces the form's action for that button."
  question: react/forms-and-actions/actions
- id: onsubmit-vs-action
  front: "What do you have to do yourself with `onSubmit` that `<form action>` does for you?"
  back: "Call `e.preventDefault()`, read `FormData` or your state, track loading and error state, and reset the form. `onSubmit` is just an event handler."
  question: react/forms-and-actions/actions
- id: onsubmit-prevent-default-cancels-action
  front: "What happens if an `onSubmit` handler calls `preventDefault()` on a form that also has a function `action`?"
  back: "The action never runs. `onSubmit` runs before React's action handling, and a prevented event cancels it. Without `preventDefault`, `onSubmit` logs and then the action runs."
  question: react/forms-and-actions/actions
- id: onsubmit-still-right-when
  front: "When is `onSubmit` still the right choice over `<form action>`?"
  back: "When you need the event, such as synchronous validation that blocks submission, or when a form library owns submission."
  question: react/forms-and-actions/actions
- id: form-action-server-function
  front: "What does a Server Function as the `action` prop allow that `onSubmit` can't?"
  back: "A server-rendered form can submit before JavaScript loads."
  question: react/forms-and-actions/actions
- id: use-form-status-returns
  front: "What does `useFormStatus()` return?"
  back: "`{ pending, data, method, action }` for the parent `<form>`. While submitting: `true`, the `FormData`, the form's `method` property (`'get'` by default), and the function. Between submissions: `false`, `null`, `null`, `null`."
  question: react/forms-and-actions/actions
- id: use-form-status-parent-only
  front: "Why is `pending` always `false` when `useFormStatus` is called in the component that renders the `<form>`?"
  back: "It reads the status of the parent form, so it must be in a child, typically the submit button. A copy in a child was `true` at the same time."
  question: react/forms-and-actions/actions
- id: request-form-reset
  front: "How do you reset a form manually with React 19, and where must the call run?"
  back: "`requestFormReset(form)` from `react-dom`, inside a Transition. Called outside one, development logs \"requestFormReset was called outside a transition or action.\""
  question: react/forms-and-actions/actions
- id: request-form-reset-no-reference
  front: "What documentation caveat applies to `requestFormReset` as of React 19.3.1?"
  back: "It has no react.dev reference page."
  question: react/forms-and-actions/actions
- id: form-action-caught-error-resets
  front: "Why does catching an error inside a form action and storing it in state lose the user's input?"
  back: "The action then succeeded, so the form reset. Return the error through `useActionState` with the submitted values, or make the fields controlled."
  question: react/forms-and-actions/actions
- id: form-submit-method-unexpected
  front: "Why must you call `requestSubmit()` rather than `form.submit()` on a form with a function action?"
  back: "`form.submit()` skips the `submit` event, so React never sees it. The form's `action` attribute is a `javascript:` URL that threw \"A React form was unexpectedly submitted…\"."
  question: react/forms-and-actions/actions
- id: action-state-after-await
  front: "What goes wrong with setting state after an `await` in an action without `startTransition`?"
  back: "The update commits before the action ends."
  question: react/forms-and-actions/actions
- id: form-action-error-boundary
  front: "What happens when a form action throws?"
  back: "The error is rethrown while rendering the `<form>`, so the nearest error boundary above it shows its fallback. Development logged \"The above error occurred in the <form> component.\""
  question: react/forms-and-actions/actions
- id: form-action-overlap
  front: "What happens when a plain `<form action>` is submitted twice before the first finishes?"
  back: "It doesn't queue: the second call started before the first finished, and `pending` stayed `true` until both ended. `useActionState` runs them one at a time."
  question: react/forms-and-actions/actions
- id: form-button-name-with-function-formaction
  front: "What happens to a submit button's `name` when it also has a function `formAction`?"
  back: "Development errors \"Cannot specify a \"name\" prop for a button that specifies a function as a formAction…\" and the value is missing from the `FormData`. With no `formAction`, `intent` was in the `FormData`."
  question: react/forms-and-actions/actions
- id: form-action-event-plugin-internals
  front: "How does React 19.3.1 decide whether to run a form action? (implementation detail)"
  back: "Its form event plugin runs after your `onSubmit` listeners. It skips if the event is `defaultPrevented` or the action isn't a function; otherwise it calls `preventDefault`, builds the `FormData` and calls `startHostTransition`."
  question: react/forms-and-actions/actions
- id: use-form-status-host-transition
  front: "Why can only child components read `useFormStatus`? (implementation detail)"
  back: "`startHostTransition` stores the status object as state on the `<form>` element's own fiber and provides it to descendants through an internal context. Like any context, the provider can't read it itself."
  question: react/forms-and-actions/actions
- id: form-reset-timing
  front: "When does the form reset happen relative to the action's result, and why does a changed `defaultValue` survive it?"
  back: "The reset is requested at the start as a Transition update, so it commits with the Action's result. React calls `form.reset()` after all other DOM mutations, so the new `defaultValue` is the one restored."
  question: react/forms-and-actions/actions
- id: form-onsubmit-with-transition
  front: "How can you keep an `onSubmit` handler and still drive `useFormStatus` and the form reset?"
  back: "Call `e.preventDefault()`, then run `startTransition(async () => { requestFormReset(form); await save(…) })`. `useFormStatus` reported `pending: true` but `action: null`. Capture `e.currentTarget` first; it is null after the `await`."
  question: react/forms-and-actions/actions
- id: use-action-state-signature
  front: "What does `useActionState(action, initialState)` return, and what is the optional third argument?"
  back: "`[state, dispatch, isPending]`. The optional third argument is `permalink`."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-action-args
  front: "What arguments does an action passed to `useActionState` receive when used as a form action?"
  back: "`(prevState, formData)`: the last result (initially `initialState`) and the `FormData`. Writing `(formData) => …` makes `formData.get` throw a `TypeError`."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-return-becomes-state
  front: "How does `useActionState` relate to `useReducer`?"
  back: "It is `useReducer` for side effects: the action may be async, and its return value is the next state. It runs in a Transition and is not called twice in Strict Mode, unlike a pure reducer."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-ispending
  front: "When is `isPending` from `useActionState` `true`?"
  back: "From the first dispatch until every queued call has finished and the result is committed."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-dispatch-transition
  front: "Where must `dispatch` from `useActionState` run?"
  back: "In a Transition. `<form action={dispatch}>` and `formAction` do that for you; from a click handler, wrap it in `startTransition`."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-queue
  front: "What happens when `dispatch` is called three times quickly?"
  back: "React runs the calls one at a time, in order, each receiving the previous return value. The runs started 100 ms apart, each after the previous resolved."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-batched-commit
  front: "In the add-to-cart test with three quick dispatches, which counts were committed?"
  back: "Only the last. Counts 1 and 2 were never committed: React batched the ongoing Actions and committed once at the end, so `count` stayed `0` until the queue drained."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-parallel-alternative
  front: "What do you use instead of `useActionState` when calls shouldn't wait in a queue?"
  back: "`useOptimistic` when the user shouldn't wait for the queue, or plain `useTransition` when calls are independent and may run in parallel."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-throw
  front: "What happens to queued calls when a `useActionState` action throws?"
  back: "Everything still queued is cancelled and the error goes to the nearest error boundary. In the test, calls 2 and 3 never ran. For expected failures such as validation, return an error state instead."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-permalink
  front: "When does the `permalink` argument of `useActionState` matter?"
  back: "Only with a Server Function on a server-rendered page: if the form is submitted before JavaScript loads, the browser goes to that URL and React passes the state through. After hydration it does nothing."
  question: react/forms-and-actions/use-action-state
- id: use-form-state-renamed
  front: "What happened to `ReactDOM.useFormState` in React 19.3.1?"
  back: "It was renamed `useActionState`. The old name still works but logs in development: \"ReactDOM.useFormState has been renamed to React.useActionState. Please update Legacy to use React.useActionState.\""
  question: react/forms-and-actions/use-action-state
- id: use-action-state-outside-transition
  front: "What happens when `dispatch` is called from `onClick` without `startTransition` and the action is async?"
  back: "Development logs \"An async function with useActionState was called outside of a transition. This is likely not what you intended (for example, isPending will not update correctly)…\", and the component suspends: the nearest `<Suspense>` fallback replaces it until the action finishes."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-sync-outside-transition
  front: "Is a synchronous `useActionState` action called outside a Transition a problem?"
  back: "No. It updated immediately with no warning."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-keep-input
  front: "How do you keep the user's input when a `useActionState` action returns an error?"
  back: "Return the submitted values in the state and use them as `defaultValue`. The reset happens in the commit that applies the new state, after `defaultValue` updates, so it restores the returned value."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-error-resets-uncontrolled
  front: "Why do uncontrolled fields reset when a `useActionState` action returns an error result?"
  back: "The form action still succeeded, so the form resets. Return `{ error }` plus the values instead of throwing."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-no-reset
  front: "How do you reset `useActionState`'s state?"
  back: "There is no reset function. Handle a reset payload in the action, or remount the component with a new `key`."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-queue-internals
  front: "How does the hook queue work in React 19.3.1? (implementation detail)"
  back: "`dispatch` appends a node; if the queue was empty it runs the action at once in a new Transition. When a promise resolves, its value becomes the state and the next node runs. If one rejects, all remaining nodes reject with that error and later dispatches are ignored."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-thenable
  front: "Why does a pending `useActionState` keep the old state on screen inside a Transition? (implementation detail)"
  back: "Each queue node is a thenable and the hook's state points to the latest one. The component reads it like `use(promise)`; inside a Transition React keeps the old UI while it's pending, outside one the component suspends."
  question: react/forms-and-actions/use-action-state
- id: use-action-state-abort-controller
  front: "How can a long `useActionState` queue be made cheaper?"
  back: "Use an `AbortController` per call so the action checks `signal.aborted` and returns early. The docs show this for a quantity stepper."
  question: react/forms-and-actions/use-action-state
- id: use-optimistic-signature
  front: "What does `useOptimistic(value, reducer?)` return, and what does it show when no Action is pending?"
  back: "`[shown, setShown]`. With no Action pending, `shown` is just `value`."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-in-action
  front: "What does `setShown(guess)` do inside an Action?"
  back: "It renders the guess immediately, even though the surrounding Transition is still running. With a reducer, `setShown(payload)` calls `reducer(current, payload)`; with a function, it's an updater like `setState`'s."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-when-action-ends
  front: "What happens to the optimistic value when the Action ends?"
  back: "React discards it. On success the real state (set in `startTransition` after an `await`) and the guess are replaced in one commit, with no flash. On failure the display reverts to the old value."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-no-rollback-code
  front: "Do you write rollback code for `useOptimistic`? What must you still do on failure?"
  back: "No: reverting is the default. You still have to tell the user it failed, by catching the error and showing a message or letting it reach an error boundary."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-must-be-in-action
  front: "Where must the `useOptimistic` setter run, and what happens otherwise?"
  back: "Inside `startTransition`, or a function passed to `<form action>`, `formAction` or another Action prop. Outside one, development logs an error and the value flashes and reverts."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-outside-transition-warning
  front: "What is the development warning for calling the optimistic setter from a plain `onClick`?"
  back: "\"An optimistic state update occurred outside a transition or action. To fix, move the update to an action, or wrap with startTransition.\" The value rendered once, then reverted within 10 ms."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-reducer-lists
  front: "How does the reducer form of `useOptimistic` behave when the real list changes during a pending Action?"
  back: "React re-runs the reducer on the new list, so optimistic entries stay on top of the latest data. For example `(current, text) => [...current, { text, pending: true }]`."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-forgot-real-state
  front: "What happens if the Action succeeds but never updates the real state?"
  back: "The guess is dropped when the Action ends and the UI snaps back to the old value."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-stale-guess
  front: "Why prefer an updater or reducer over `setShown(count + 1)`?"
  back: "An absolute guess from a stale closure can be wrong. An updater or reducer computes the guess from the current value."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-pairs-with-action-state
  front: "How do `useOptimistic` and `useActionState` complement each other?"
  back: "The optimistic value hides the queue's wait, while `useActionState` holds the confirmed result."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-is-pending
  front: "How do you know whether an optimistic update is pending?"
  back: "Compare `shown !== value`, take `isPending` from `useTransition` or `useActionState`, or mark the guessed items, for example `pending: true` in the reducer."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-action-throws
  front: "What happens to the optimistic value if the Action throws?"
  back: "The Transition still ends, so it reverts. With standalone `startTransition` the test showed the revert and an uncaught error on `window`; with a form action or `useTransition`'s `startTransition`, the error reaches an error boundary."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-overlapping-actions
  front: "Do overlapping optimistic Actions revert separately in React 19.3.1?"
  back: "No, React batches ongoing Transitions. Adding `b` (100 ms) then `c` (200 ms) showed both guesses stacked, and the real list got `b` and `c` together when `c` finished."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-two-lanes
  front: "How does an optimistic update use lanes in React 19.3.1? (implementation detail)"
  back: "It is queued with its own sync lane, so it renders at once, and a revert lane that is the Transition's lane. Renders without the revert lane apply it; rendering the Transition's lane, when the Action finishes, skips it."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-passthrough
  front: "What is the passthrough value in `useOptimistic`? (implementation detail)"
  back: "The value you pass in. Every render starts from it and replays the queued optimistic updates on top, so a reducer sees the latest real list and the guess and confirmed state are replaced in the same commit."
  question: react/forms-and-actions/use-optimistic
- id: use-optimistic-other-libraries
  front: "Do server-cache libraries need `useOptimistic` for optimistic updates?"
  back: "No. Libraries such as TanStack Query have their own optimistic APIs."
  question: react/forms-and-actions/use-optimistic
# 11 Server rendering
- id: ssr-two-renders
  front: "What are the two renders in server rendering with hydration?"
  back: "The server renders the tree to HTML with a `react-dom/server` API. The browser paints that HTML, then `hydrateRoot` renders the same tree again and claims the existing DOM nodes instead of creating them."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-streaming-apis
  front: "Which `react-dom/server` APIs stream HTML, and what goes first?"
  back: "`renderToPipeableStream` (Node streams) and `renderToReadableStream` (Web Streams). The shell, everything outside `<Suspense>` boundaries, goes first; suspended parts follow as data arrives."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-node-web-streams
  front: "Does Node support the Web Streams server APIs, and which does the React team recommend there?"
  back: "Since React 19.2 Node has the Web Streams APIs too, but the docs recommend Node streams there for speed."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-render-to-string-suspense
  front: "What does `renderToString` do when a component suspends?"
  back: "It can't wait for data. The nearest `<Suspense>` fallback goes into the HTML, inside a client-rendered boundary marker, and the client renders the content. It didn't throw."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-prerender
  front: "What do `prerender` and `prerenderToNodeStream` do differently from `renderToString`?"
  back: "They come from `react-dom/static`, wait for all data, and emit final HTML, for static generation."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-what-runs-on-server
  front: "Which parts of a component run during server rendering?"
  back: "Only the render phase: state initializers run. Effects, layout effects, ref callbacks and event handlers don't."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-bootstrap-scripts
  front: "How does the server output load the client bundle?"
  back: "The HTML contains `<script>` tags for the client bundle, set with the `bootstrapScripts` option."
  question: react/server-rendering/ssr-and-hydration
- id: hydration-claims-nodes
  front: "What does `hydrateRoot(container, <App />)` do instead of creating DOM nodes?"
  back: "It walks the existing nodes and claims them: each fiber gets the matching node, props and handlers attach, then the commit runs refs and Effects."
  question: react/server-rendering/ssr-and-hydration
- id: hydration-must-match-first-render
  front: "Why must the client's first render match the server's output?"
  back: "A difference is a hydration mismatch: React discards the server HTML for that part and renders it from scratch on the client."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-cost-gap
  front: "What is the cost of server rendering that streaming and selective hydration narrow?"
  back: "Until hydration finishes the page looks ready but ignores clicks."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-create-root-on-server-html
  front: "What happens if you call `createRoot` on server-rendered HTML?"
  back: "It throws the HTML away and builds new nodes. In the test the original `<button>` was disconnected. Use `hydrateRoot`."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-on-shell-ready-vs-all-ready
  front: "When do you pipe in `onShellReady` versus `onAllReady`?"
  back: "`onShellReady` to stream to people: shell and fallbacks arrive first. `onAllReady` for crawlers or static generation, with no progressive loading. `renderToReadableStream` exposes it as `await stream.allReady`."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-shell-error
  front: "What happens when the shell itself throws during streaming SSR?"
  back: "No bytes have been sent, so `onShellError` fires (or the `renderToReadableStream` promise rejects). Send a 500 or a client-rendered fallback page. An error inside a `<Suspense>` boundary only falls back to that boundary."
  question: react/server-rendering/ssr-and-hydration
- id: hydration-root-render-caveat
  front: "What does the docs warn about calling `root.render` on a hydrating root?"
  back: "Calling it before hydration finishes clears the server HTML and switches the whole root to client rendering. After hydration it works like on any root."
  question: react/server-rendering/ssr-and-hydration
- id: fizz-renderer
  front: "What is Fizz, and why does it have no Effects? (implementation detail)"
  back: "`react-dom/server` is React's Fizz renderer. It renders components to HTML segments, not fibers: no DOM and no commit phase, so no Effects."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-text-separator
  front: "Why did `Clicked {count}` become `Clicked <!-- -->0` in the server HTML?"
  back: "Two adjacent text nodes need a separator so the client can find both."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-suspense-comment-markers
  front: "How does the server HTML mark Suspense boundaries in React 19.3.1?"
  back: "With comment markers: `<!--$-->` … `<!--/$-->` around a boundary. A boundary rendered as a fallback by `renderToString` uses `<!--$!-->` with a `<template>`. These tell the client where a boundary starts and ends."
  question: react/server-rendering/ssr-and-hydration
- id: hydrate-root-lane
  front: "Does `hydrateRoot` render synchronously? (React 19.3.1, implementation detail)"
  back: "No. It attaches event listeners to the container, schedules the initial render on a hydration lane and returns before rendering: a log right after the call printed before `render on client`."
  question: react/server-rendering/ssr-and-hydration
- id: hydration-claim-algorithm
  front: "How does React 19.3.1 claim a DOM node for a host fiber? (implementation detail)"
  back: "`tryToClaimNextHydratableInstance` checks whether the next DOM node has the same tag (`canHydrateInstance`). If so the fiber's `stateNode` becomes that node; otherwise it is a mismatch."
  question: react/server-rendering/ssr-and-hydration
- id: hydrate-instance-events
  front: "What does `hydrateInstance` do, and where does the event system later find `onClick`? (implementation detail)"
  back: "It links the node to its fiber (`precacheFiberNode`) and stores the props (`updateFiberProps`). `onClick` is read from those stored props on dispatch. Text is compared to the server text."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-server-exports
  front: "Which functions does `react-dom/static` export in Node in React 19.3.1?"
  back: "`prerender`, `prerenderToNodeStream`, `resumeAndPrerender` and `resumeAndPrerenderToNodeStream`. `react-dom/server` has `renderToString`, `renderToStaticMarkup`, `renderToPipeableStream`, `renderToReadableStream`, `resumeToPipeableStream` and `resume`."
  question: react/server-rendering/ssr-and-hydration
- id: hydration-strict-mode-effects
  front: "What does Strict Mode do during hydration since React 19.3?"
  back: "It double-invokes Effects during hydration too, as with `createRoot`. In the development test the component rendered twice and ran its layout effect and Effect twice, while keeping the server node."
  question: react/server-rendering/ssr-and-hydration
- id: ssr-tradeoffs
  front: "Does server rendering reduce the JavaScript the client runs?"
  back: "No. The client still downloads and runs every component to hydrate it, so time to interactive can be later than with a client-only app. Server Components keep some components off the client entirely."
  question: react/server-rendering/ssr-and-hydration
- id: mismatch-definition
  front: "What is a hydration mismatch, and how does React 19's development build report it?"
  back: "Any difference between the client's first render and the server HTML. The development build reports it with a diff."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-causes-environment
  front: "Which render-time patterns commonly cause hydration mismatches?"
  back: "Branching on the environment (`typeof window`, `localStorage`, `matchMedia`) and values that change between renders (`Date.now()`, `Math.random()`, dates formatted in the server's time zone or locale)."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-causes-data
  front: "How can different data cause a hydration mismatch?"
  back: "The client fetched newer data instead of reusing the server's."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-invalid-nesting
  front: "Why does invalid nesting like `<p><div>` cause a hydration mismatch?"
  back: "The HTML parser closes the `<p>`, so the DOM no longer matches the tree. `<p>a<div>b</div></p>` became `<p>a</p><div>b</div><p></p>`."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-nesting-warning
  front: "What development warning appears for `<div>` inside `<p>` during hydration?"
  back: "\"In HTML, <div> cannot be a descendant of <p>. This will cause a hydration error.\" Then hydration failed and the client re-rendered."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-tag-or-text
  front: "What does React 19.3.1 do on a different tag or text during hydration?"
  back: "Hydration fails at that point. React reports a recoverable error, discards the server DOM up to the nearest `<Suspense>` boundary (or the whole root without one), and renders it on the client. `onRecoverableError` receives it."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-text-message
  front: "What recoverable error message does a text mismatch produce in React 19.3.1?"
  back: "\"Hydration failed because the server rendered text didn't match the client…\". In the production build it is \"Minified React error #418\"."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-attribute-not-patched
  front: "What does React 19.3.1 do on a different attribute during hydration?"
  back: "Only a development `console.error` (\"…This won't be patched up.\"). The DOM keeps the server's value, which the docs allow: attribute fixes aren't guaranteed."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-attribute-warning-text
  front: "Which development warning is logged for mismatched attributes on hydration?"
  back: "\"A tree hydrated but some attributes of the server rendered HTML didn't match the client properties. This won't be patched up.\" with a diff. Production left the attribute wrong silently."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-attribute-silent-prod
  front: "Why is ignoring attribute mismatch warnings risky?"
  back: "Nothing crashes, but the server's `class` stayed on the element in both builds: wrong styling with no error in production."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-fix-deterministic
  front: "What is the best fix for a hydration mismatch?"
  back: "Make the render deterministic: pass the server's data and timestamps to the client, format dates with an explicit `timeZone`, fix the markup, and generate ids with `useId`."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-browser-only-content
  front: "How do you render content that can only exist in the browser without a mismatch?"
  back: "Render a placeholder first: set a flag in `useEffect` and render a second pass, or since React 19.3 call `use(browser())` from `react-dom` inside a `<Suspense>` boundary, so the server sends the fallback and the client renders the content."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-browser-no-error
  front: "Does `use(browser())` report an error on the server or client?"
  back: "No. On the server the boundary is marked client-rendered (\"Switched to client rendering because a component requested it.\"); on the client the content rendered with no `onRecoverableError` call."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-suppress-warning-scope
  front: "What does `suppressHydrationWarning` cover?"
  back: "Only that element's own text and attributes, and React won't patch them. It doesn't reach children: on a `<div>` around a differing `<p>`, the error still fired and the subtree was re-rendered."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-use-effect-typeof-window
  front: "Why is fixing a mismatch with `typeof window` in render wrong?"
  back: "That is the mismatch. Move the browser-only part into an Effect or behind `use(browser())`."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-use-id
  front: "Why use `useId` rather than a counter for ids in server-rendered components?"
  back: "Hydration order can differ from server order; `useId` derives ids from tree position and matched (`_R_0_` on both sides)."
  question: react/server-rendering/hydration-mismatches
- id: use-id-prefixes
  front: "Which `useId` prefixes does React use since 19.2?"
  back: "`_R_` for server and hydration, `_r_` for a client render. A client-rendered tree after a failed hydration therefore changed the ids too."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-boundary-scope
  front: "How much does a text mismatch throw away?"
  back: "Up to the nearest `<Suspense>` boundary. With `<b>` outside and the mismatching `<p>` inside a boundary, `<b>` kept its server node and the boundary's nodes were recreated. Without a boundary, every node in the root was recreated."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-extensions
  front: "Do browser extensions cause hydration mismatches in React 19?"
  back: "Less: React 19 skips unexpected tags in `<head>` and `<body>` when hydrating the document. A `<div>` at the start of `<body>` or a `<style>` in `<head>` caused no error. One injected inside `<main>` failed hydration, and the client render removed it."
  question: react/server-rendering/hydration-mismatches
- id: mismatch-whitespace-container
  front: "What happens if whitespace precedes the server HTML inside the root container?"
  back: "The whitespace text node didn't match the expected `<div>`, so hydration failed with \"Hydration failed because the server rendered HTML didn't match the client\" and the root was client-rendered, with all new nodes."
  question: react/server-rendering/hydration-mismatches
- id: streaming-three-waterfalls
  front: "Which three waterfalls of old-style SSR do Suspense boundaries break?"
  back: "Fetching all data before sending any HTML, loading all JavaScript before hydrating anything, and hydrating everything before anything responds."
  question: react/server-rendering/streaming-and-selective-hydration
- id: streaming-html-mechanics
  front: "How does streaming HTML deliver a boundary's content after the shell?"
  back: "React sends its HTML in a hidden `<div>` at the end of the stream, plus an inline `<script>` that moves it into place. Boundaries complete in any order. The swap needs no React on the client."
  question: react/server-rendering/streaming-and-selective-hydration
- id: streaming-instruction-names
  front: "Which instruction names and ids appear in the streamed HTML of React 19.3.1? (implementation detail)"
  back: "`B:0` is a `<template>` marking where a boundary goes, `S:0` holds its content; `$RC` queues the pair and `$RV` swaps it in, with `$RB` and `$RT` also present. The names are implementation details."
  question: react/server-rendering/streaming-and-selective-hydration
- id: streaming-reveal-batching
  front: "How are boundary reveals throttled in SSR since React 19.2?"
  back: "Batched: at most one every 300 ms, as on the client. Near 2.3 s (for LCP) the throttle shortens."
  question: react/server-rendering/streaming-and-selective-hydration
- id: streaming-batching-measured
  front: "How did the 19.2 reveal batching look in Chrome 156 versus Firefox 159?"
  back: "Chrome 156: data at 100 and 200 ms appeared together at 311–327 ms; at 100 and 450 ms, about 315 and 615. Firefox 159 ran its first frame later: first reveal at 112–132 ms, the next at least 300 ms after."
  question: react/server-rendering/streaming-and-selective-hydration
- id: selective-hydration-order
  front: "How does `hydrateRoot` order selective hydration?"
  back: "It hydrates the shell first; each boundary hydrates separately once its HTML and code (say a `lazy` chunk) have arrived, in tree order, yielding between pieces so the page stays responsive."
  question: react/server-rendering/streaming-and-selective-hydration
- id: selective-hydration-click
  front: "What happens when the user clicks inside a Suspense boundary that isn't hydrated yet?"
  back: "React hydrates that boundary synchronously in the click's capture phase, then dispatches the click normally. Other boundaries wait."
  question: react/server-rendering/streaming-and-selective-hydration
- id: selective-hydration-click-dropped
  front: "What happens to a click on a boundary whose code hasn't loaded in React 19.3.1?"
  back: "React stops the event and raises the boundary's priority; the click is lost, not replayed. Discrete events on unhydrated boundaries are dropped."
  question: react/server-rendering/streaming-and-selective-hydration
- id: selective-hydration-measured
  front: "How did selective hydration behave in the test with a sidebar taking about 400 ms?"
  back: "A trusted click on a comments button 30 ms after `hydrateRoot` hydrated the comments boundary first; its `onClick` ran 57–145 ms after navigation and the sidebar finished at 461–548 ms (Chrome 156 and Firefox 159)."
  question: react/server-rendering/streaming-and-selective-hydration
- id: streaming-clicks-before-hydrate
  front: "Are clicks before `hydrateRoot` queued?"
  back: "No. Before `hydrateRoot` there is no listener at all, and a click on a boundary whose code was missing was dropped."
  question: react/server-rendering/streaming-and-selective-hydration
- id: streaming-server-error-boundary
  front: "What happens when a component throws on the server inside a Suspense boundary?"
  back: "The boundary's fallback is final in the HTML. The client renders that boundary from scratch and reports the error to `onRecoverableError`. Only an error in the shell fails the response."
  question: react/server-rendering/streaming-and-selective-hydration
- id: streaming-server-error-marker
  front: "How does the client learn about a server error in a boundary, and what message does it get?"
  back: "The shell had `<!--$!-->` and a `<template>` before the fallback. `onRecoverableError` got \"Switched to client rendering because the server rendering errored: db down\" (production: minified error #419)."
  question: react/server-rendering/streaming-and-selective-hydration
- id: partial-prerender
  front: "What is partial pre-rendering (React 19.2) and how does it work?"
  back: "The same shell/boundary split at build time: `prerender` with an aborted `signal` returns the shell as `prelude` plus a `postponed` state; at request time `resume` streams only the boundaries that were left."
  question: react/server-rendering/streaming-and-selective-hydration
- id: partial-prerender-resume-output
  front: "What did `resume` send in the test with a cart boundary left waiting?"
  back: "The prelude held its fallback and `postponed` was a 624-character JSON object. `resume` with the same tree streamed only `<div hidden id=\"S:0\">…</div>` and the `$RC` script."
  question: react/server-rendering/streaming-and-selective-hydration
- id: streaming-effects-dont-stream
  front: "Why doesn't a boundary stream when its data is fetched in an Effect?"
  back: "Effects don't run on the server; only data read with `use` or a Suspense-enabled library suspends."
  question: react/server-rendering/streaming-and-selective-hydration
- id: streaming-shell-boundary-placement
  front: "What goes wrong with a shell that has no boundaries, or one boundary around everything?"
  back: "No boundaries means no streaming; one boundary around everything means the first paint is a spinner."
  question: react/server-rendering/streaming-and-selective-hydration
- id: streaming-on-all-ready-for-everyone
  front: "Why not pipe in `onAllReady` for every visitor?"
  back: "The response then starts only when all data is in: no progressive loading. Keep it for crawlers and static generation."
  question: react/server-rendering/streaming-and-selective-hydration
