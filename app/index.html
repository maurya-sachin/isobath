<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before first paint so dark mode never flashes white. Keep in sync with src/appearance/theme.ts.
      try {
        var stored = localStorage.getItem('theme')
        var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (error) {}
      // Appearance settings, applied before first paint. Keep in sync with rootSettings in src/appearance/appearance.ts.
      try {
        var saved = JSON.parse(localStorage.getItem('appearance') || '{}')
        var root = document.documentElement
        if (isFinite(saved.hueLight)) root.style.setProperty('--hue-light', Math.round(saved.hueLight))
        if (isFinite(saved.hueDark)) root.style.setProperty('--hue-dark', Math.round(saved.hueDark))
        if (saved.textSize === 120 || saved.textSize === 145) root.style.fontSize = saved.textSize + '%'
        if (saved.contrast === 'high') root.setAttribute('data-contrast', 'high')
        if (saved.motion === 'reduce') root.setAttribute('data-motion', 'reduce')
        if (saved.readingFont === 'sans') root.setAttribute('data-reading-font', 'sans')
        if (saved.spacing === 'relaxed') root.setAttribute('data-spacing', 'relaxed')
      } catch (error) {}
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
